@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
:root{
  --ink:#0b1a2b; --ink2:#122a40; --panel:#0f2336;
  --paper:#f4f1e7; --paper-line:#ddd6c4;
  --amber:#e8a531; --amber-dk:#b97f1e;
  --signal:#d6482f; --go:#2fa06a;
  --txt:#eaf0f5; --muted:#8ea3b6; --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
.app{min-height:100vh;background:
  radial-gradient(1200px 500px at 80% -10%, #163a56 0%, rgba(22,58,86,0) 60%),
  var(--ink);
  color:var(--txt); font-family:Inter,system-ui,sans-serif; padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));}
.app *::selection{background:var(--amber);color:#0b1a2b}

/* header */
.hd{position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);
  background:linear-gradient(180deg, rgba(11,26,43,.96), rgba(11,26,43,.82));
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 18px) 0 calc(env(safe-area-inset-left,0px) + 18px);}
.hd-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hd h1{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.22em;
  font-size:22px;margin:0;color:var(--txt);
  border-bottom:3px solid var(--amber);padding-bottom:2px;line-height:1}
.hd-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tab{appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;
  padding:8px 12px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}

.mn{max-width:1060px;margin:0 auto;padding:18px}

/* method strip */
.method{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:6px;padding:12px 14px;font-size:13.5px;line-height:1.55;color:#cdd8e2;margin-bottom:18px}
.method b{color:var(--txt)} .hl{color:var(--amber);font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.scope-picker{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}
.scope-picker .seg{flex-wrap:wrap;background:var(--panel)}
.scope-picker .subseg{background:rgba(255,255,255,.03)}
.learn-count{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
  color:var(--muted);text-transform:uppercase;margin:-4px 0 14px}
.round-cta{display:block;width:100%;text-align:left;appearance:none;cursor:pointer;
  background:linear-gradient(180deg, rgba(232,165,49,.15), rgba(232,165,49,.05));
  border:1px solid rgba(232,165,49,.35);border-radius:10px;padding:14px 16px;margin:0 0 16px}
.round-cta:hover{border-color:var(--amber)}
.round-cta-t{display:block;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--amber)}
.round-cta-s{display:block;font-size:12.5px;color:#c7d2dc;margin-top:3px}
.round-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.round-exit{appearance:none;background:transparent;border:1px solid var(--line);border-radius:6px;
  color:var(--muted);padding:6px 10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer}
.round-exit:hover{color:var(--txt);border-color:var(--muted)}
.round-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.study{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.study .plate.big{width:100%;padding:22px;border-radius:0}
.study-body{padding:16px 16px 18px}
.study-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0}
.study-body .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.study-body .chips{display:flex;gap:6px;margin-bottom:12px}
.study-nav{display:flex;gap:10px}
.half-btn{flex:1;margin-top:0}
.rem{float:right;font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(11,26,43,.6);font-weight:600}
.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);padding:10px 12px;font-size:14px;font-family:inherit}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg.small button{padding:6px 10px;font-size:12.5px}
.seg button{appearance:none;background:transparent;border:0;color:var(--muted);
  font-family:inherit;font-size:13px;padding:9px 13px;cursor:pointer}
.seg button.on{background:var(--amber);color:#0b1a2b;font-weight:600}
.ghost{appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:6px;padding:9px 13px;font-family:inherit;font-size:13px;cursor:pointer}
.ghost:hover{color:var(--txt);border-color:var(--amber)}

/* groups + grid */
.grp{margin-bottom:26px}
.grp-h{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:15px;letter-spacing:.03em;color:var(--txt);margin:0 0 12px;
  padding-bottom:7px;border-bottom:1px solid var(--line);text-transform:uppercase}
.grp-n{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

/* card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column}
.plate{background:var(--paper);padding:12px;display:flex;align-items:center;justify-content:center}
.plate.sm{padding:9px} .plate.big{padding:20px} .plate.xs{padding:5px}
.flag-img{width:100%;display:block;border:1px solid var(--paper-line);border-radius:2px;
  box-shadow:0 1px 2px rgba(0,0,0,.18);overflow:hidden;line-height:0;background:#fff}
.flag-img svg{width:100%;height:auto;display:block}
.plate.big .flag-img{max-width:360px}
.plate.sm .flag-img{width:120px} .plate.xs .flag-img{width:46px}
.flag-fallback{width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;
  background:#e9e4d5;border:1px solid var(--paper-line);border-radius:2px}
.flag-fallback span{font-family:'IBM Plex Mono',monospace;font-weight:600;color:#6a6350;font-size:20px;letter-spacing:.1em}
.plate.sm .flag-fallback{width:120px} .plate.xs .flag-fallback{width:46px}
.card-body{padding:12px 13px 13px}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card-top h4{margin:0;font-size:15px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--txt)}
.code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 9px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#c3cfdb;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.chip-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip-region{color:#bcd0c6}
.tell{font-size:13px;line-height:1.5;color:#c8d3dd;margin:0}
.reveal-btn{margin-top:10px;appearance:none;background:transparent;border:1px dashed var(--line);
  color:var(--amber);border-radius:6px;padding:7px;width:100%;cursor:pointer;font-family:inherit;font-size:12.5px}
.reveal-btn:hover{border-color:var(--amber)}
.reveal{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.hook{font-size:13px;line-height:1.5;color:#eef3f7;margin:0}
.hk{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--amber);background:rgba(232,165,49,.12);
  border-radius:4px;padding:2px 6px;margin-right:7px;vertical-align:middle}
.mean{font-size:12px;line-height:1.45;color:var(--muted);margin:7px 0 0;font-style:italic}
.hist{font-size:12.5px;line-height:1.55;color:#c7d2dc;margin:8px 0 0}
.hk-alt{color:#8bd0ff;background:rgba(139,208,255,.12)}
.empty{color:var(--muted);text-align:center;padding:40px}

/* traps */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pair{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.pair-flags{display:flex;align-items:flex-start;justify-content:center;gap:14px}
.pf{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.pf-n{font-size:12.5px;font-weight:600;color:var(--txt);text-align:center;font-family:'Space Grotesk',sans-serif}
.pf .plate{width:100%;border-radius:6px}
.vs{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);align-self:center;margin-top:22px}
.diff{margin:13px 0 0;font-size:13px;line-height:1.55;color:#eaf0f5;
  background:rgba(214,72,47,.09);border:1px solid rgba(214,72,47,.32);border-radius:6px;padding:10px 12px}
.diff-tag{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--signal);margin-bottom:5px;font-weight:600}

/* drill */
.drill{max-width:620px;margin:0 auto}
.drill-bar{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.drill-bar .seg{flex-wrap:wrap}
.stats{display:flex;gap:18px;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.stats b{color:var(--amber);font-size:15px;margin-right:4px}
.drill-flag{display:flex;justify-content:center;margin:14px 0 18px}
.drill-flag .plate{border-radius:10px;width:100%;max-width:420px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:14px 14px 14px 40px;font-family:'Space Grotesk',sans-serif;
  font-size:14px;font-weight:500;cursor:pointer;transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--amber)}
.opt-k{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;width:19px;height:19px;
  display:flex;align-items:center;justify-content:center}
.opt.ok{background:rgba(47,160,106,.16);border-color:var(--go);color:#eafff3}
.opt.no{background:rgba(214,72,47,.16);border-color:var(--signal)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 0}
.q-name{background:var(--paper);color:#17263a;border-radius:10px;padding:18px 16px;text-align:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:23px;line-height:1.15;
  border:1px solid var(--paper-line);box-shadow:0 1px 2px rgba(0,0,0,.18);margin:10px 0 12px}
.q-name .q-sub{display:block;margin-top:7px;font-family:'IBM Plex Mono',monospace;font-weight:500;
  font-size:11px;letter-spacing:.16em;color:#7c745f;text-transform:uppercase}
.opts.flags{gap:8px}
.opts.flags .opt.flag{padding:6px;min-height:0;display:flex;align-items:center;justify-content:center}
.opts.flags .opt.flag .plate{background:transparent;padding:0;width:100%;display:flex;align-items:center;justify-content:center}
.opts.flags .opt.flag .flag-img{width:auto;max-width:100%;height:clamp(58px,13vh,112px)}
.opts.flags .opt.flag img.flag-img{width:auto;max-width:100%;height:clamp(58px,13vh,112px);object-fit:contain}
.opts.flags .opt.flag div.flag-img svg{width:auto;height:100%}
.opts.flags .opt.flag .opt-k{left:6px;top:6px;transform:none;background:rgba(11,26,43,.82);
  color:#f4f1e7;border-radius:4px;padding:1px 6px;z-index:2}
.fb{margin-top:16px;border-radius:10px;padding:15px;border:1px solid var(--line);background:var(--panel)}
.fb-ok{border-left:3px solid var(--go)} .fb-no{border-left:3px solid var(--signal)}
.fb-head{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-bottom:9px}
.fb-ok .fb-head{color:var(--go)} .fb-no .fb-head{color:#ff9a86}
.fb-chips{display:flex;gap:6px;margin-bottom:10px}
.fb-tell{font-size:13.5px;line-height:1.5;color:#cad5df;margin:0 0 9px}
.fb-hook{font-size:14px;line-height:1.55;color:#eef3f7;margin:0}
.fb-mean{font-size:12px;font-style:italic;color:var(--muted);margin:8px 0 0}
.fb-hist{font-size:13px;line-height:1.55;color:#c7d2dc;margin:9px 0 0}
.next{margin-top:14px;appearance:none;width:100%;background:var(--amber);color:#0b1a2b;border:0;
  border-radius:8px;padding:12px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.next:hover{background:var(--amber-dk);color:#fff}
.kbd{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(11,26,43,.22);
  border-radius:3px;padding:1px 5px;margin-left:6px;font-weight:500}

/* run: start screen */
.start-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 18px;margin-top:4px}
.start-h{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;margin:0 0 3px}
.start-sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.5}
.start-row{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.start-lb{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.start-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#c7d2dc;margin:2px 0 12px}
.start-meta b{color:var(--txt)}
.score-key{font-size:12px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;margin-bottom:16px;line-height:1.5}
.score-key b{color:var(--amber);font-family:'Space Grotesk',sans-serif}
.start-btn{appearance:none;width:100%;background:var(--amber);color:#0b1a2b;border:0;border-radius:9px;
  padding:14px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:.02em}
.start-btn:hover{background:var(--amber-dk);color:#fff}
.ghost-btn{appearance:none;width:100%;background:transparent;color:var(--muted);border:1px solid var(--line);
  border-radius:9px;padding:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;cursor:pointer;margin-top:9px}
.ghost-btn:hover{color:var(--txt);border-color:var(--muted)}

/* run: heads-up display */
.run-hud{margin:2px 0 14px}
.hud-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:9px}
.hud-fill{height:100%;background:var(--amber);border-radius:3px;transition:width .25s ease}
.hud-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.hud-q{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--txt);font-size:15px}
.hud-q small{color:var(--muted);font-weight:500;font-size:12px}
.hud-mid{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em}
.hud-t{font-family:'IBM Plex Mono',monospace;color:#c7d2dc}
.hud-p{color:var(--txt)} .hud-p b{color:var(--amber);font-family:'Space Grotesk',sans-serif}

/* run: hint */
.hintbtn{appearance:none;display:block;width:100%;margin-top:14px;background:transparent;
  border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:10px;
  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;cursor:pointer}
.hintbtn:hover{color:var(--txt);border-color:#8bd0ff}
.hintbtn .half{color:#8bd0ff;font-family:'IBM Plex Mono',monospace;font-size:11px;margin-left:6px}
.hintbox{margin-top:14px;background:rgba(139,208,255,.08);border:1px solid rgba(139,208,255,.25);
  border-radius:8px;padding:11px 12px;font-size:13px;line-height:1.5;color:#dceaf5}
.gain{float:right;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600}
.gain-full{color:var(--go)} .gain-half{color:#8bd0ff} .gain-zero{color:#ff9a86}

/* run: summary */
.summary{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 18px;margin-top:4px;text-align:center}
.sum-badge{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--amber);margin-bottom:18px;line-height:1.35}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.sum-cell{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;gap:3px}
.sum-n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--txt);line-height:1}
.sum-n small{font-size:14px;color:var(--muted);font-weight:500}
.sum-l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sum-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:18px}
.sum-actions{display:flex;flex-direction:column}

/* leaderboard */
.scores .scope{flex-wrap:wrap;margin-bottom:14px}
.lb{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lb-head,.lb-row{display:grid;grid-template-columns:34px 1fr 52px 58px 62px;align-items:center;gap:6px;padding:10px 12px;font-size:13px}
.lb-head{background:rgba(255,255,255,.04);color:var(--muted);font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.lb-row{border-top:1px solid var(--line);color:#c7d2dc}
.lb-row.top{background:rgba(232,165,49,.06)}
.lb-rank{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--txt);font-size:15px}
.lb-pts{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--txt)}
.lb-pts small{color:var(--muted);font-weight:500;font-size:11px}
.lb-dir{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}


/* progress */
.prog{max-width:640px;margin:0 auto}
.prog-hero{display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:20px;flex-wrap:wrap;justify-content:center}
.ring{width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring-in{width:88px;height:88px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring-pct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--amber);line-height:1}
.ring-lb{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.prog-nums{display:grid;grid-template-columns:repeat(4,auto);gap:20px}
.pn{display:flex;flex-direction:column;align-items:center}
.pn b{font-family:'Space Grotesk',sans-serif;font-size:24px;color:var(--txt)}
.pn span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sec-h{font-family:'Space Grotesk',sans-serif;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-lb{width:76px;font-size:13px;color:#cad5df}
.bar{flex:1;height:9px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--amber-dk),var(--amber));border-radius:5px;transition:width .4s}
.bar-n{width:56px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.weak{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.weak-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px}
.weak-t{display:flex;flex-direction:column;min-width:0}
.weak-t span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weak-t small{font-size:11px;color:var(--muted)}
.reset{margin-top:26px;appearance:none;background:transparent;border:1px solid rgba(214,72,47,.4);
  color:#ff9a86;border-radius:6px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:13px}
.reset:hover{background:rgba(214,72,47,.12)}
.note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}

@media(max-width:560px){
  .opts{grid-template-columns:1fr}
  .opts.flags{grid-template-columns:1fr 1fr}
  .prog-nums{gap:14px}
  .hd h1{font-size:19px}
}
