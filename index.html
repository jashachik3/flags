h="100%" height="100%" transform="translate(-133.3 37.3)"/></svg>',cr:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><g fill-rule="evenodd" stroke-width="1pt"><path fill="#0000b4" d="M0 0h640v480H0z"/><path fill="#fff" d="M0 75.4h640v322.3H0z"/><path fill="#d90000" d="M0 157.7h640v157.7H0z"/></g></svg>'},u2=[{n:"Denmark",c:"dk",r:"Europe",fam:"nordic",tell:"White cross on plain red \u2014 the oldest national flag, the Dannebrog.",hook:"DENmark = the DEN/original. Simplest Nordic: red field, white cross, nothing else. All other Nordic crosses are variations on this.",mean:"Legend: fell from the sky in 1219. The template for every Nordic cross.",hist:"The Dannebrog is traditionally called the oldest continuously used national flag; legend says it fell from the sky during a 1219 battle. Its off-centre white cross became the template for every Nordic flag.",sub:"Northern Europe"},{n:"Sweden",c:"se",r:"Europe",fam:"nordic",tell:"Yellow cross on blue.",hook:"Sweden = IKEA colours: blue + yellow. Blue field, gold cross.",mean:"Blue and gold from the national coat of arms.",hist:"A gold Scandinavian cross on blue, drawn from Sweden's blue-and-gold royal coat of arms and used since the 16th century.",sub:"Northern Europe"},{n:"Norway",c:"no",r:"Europe",fam:"nordic",tell:"Red field, white-outlined blue cross.",hook:"Norway = Red, White & Blue crammed into a Nordic cross (it was under Denmark=red then Sweden=blue). Iceland is the exact colour-swap.",mean:"Combines Danish red + French-revolution liberty blue.",hist:"Adopted 1821: Denmark's red-and-white with a blue cross added, giving the red-white-blue shared by the era's liberty movements.",sub:"Northern Europe"},{n:"Iceland",c:"is",r:"Europe",fam:"nordic",tell:"Blue field, white-outlined red cross.",hook:"Iceland = Norway's negative. Swap Norway's blue and red: blue field / red cross. (Fire=red on glacial=blue-white.)",mean:"Blue mountains, white ice, red volcanic fire.",hist:"Adopted 1915 and kept at independence in 1944 \u2014 blue for the mountains, white for ice and snow, red for volcanic fire.",sub:"Northern Europe"},{n:"Finland",c:"fi",r:"Europe",fam:"nordic",tell:"Blue cross on white \u2014 the palest Nordic flag.",hook:"Finland = a thousand blue LAKES on white SNOW. The only Nordic cross that is blue-on-white.",mean:"Blue lakes/sky, white snow.",hist:"Adopted 1918 after independence from Russia; the blue cross stands for the country's thousands of lakes and its sky, white for winter snow.",sub:"Northern Europe"},{n:"France",c:"fr",r:"Europe",fam:"tricolor",tell:"Blue-white-red vertical, blue at hoist.",hook:"The original tricolour. Blue-White-Red left to right = 'BWR' \u2192 alphabetical-ish. The ancestor of most tricolours.",mean:"Libert\xE9, \xE9galit\xE9, fraternit\xE9 (1789).",hist:"The 1789 Revolution combined the white of the monarchy with the red and blue of Paris. This tricolour became the model copied around the world.",sub:"Western Europe"},{n:"Netherlands",c:"nl",r:"Europe",fam:"panslavic",tell:"Red-white-blue horizontal; a deep/bright red on top.",hook:"vs Luxembourg: Netherlands red is darker and the flag is squarer. 'Dutch is Deeper red.'",mean:"Oldest tricolour; inspired Russia and many others.",hist:"The world's oldest tricolour, evolving from the orange-white-blue 'Prince's Flag' of the 16th-century revolt against Spain; the orange later shifted to red.",sub:"Western Europe"},{n:"Luxembourg",c:"lu",r:"Europe",fam:"panslavic",tell:"Red-white-blue horizontal; lighter sky-blue, longer/skinnier.",hook:"vs Netherlands: Luxembourg is Lighter blue and Longer. Two L's.",mean:"Colours from the Grand Duke's arms.",hist:"Red-white-blue stripes from the Grand Duke's coat of arms \u2014 nearly the Dutch flag, but longer and with a lighter blue.",sub:"Western Europe"},{n:"Russia",c:"ru",r:"Europe",fam:"panslavic",tell:"White-blue-red horizontal, top to bottom.",hook:"The Pan-Slavic parent. WBR top\u2192down. 'White snow, Blue sky, Red blood.' Slovakia/Slovenia add an emblem to this exact stack.",mean:"Source of Pan-Slavic colours (1690s).",hist:"Peter the Great adopted white-blue-red in the 1690s after visiting the Netherlands; it became the source of the Pan-Slavic colours.",sub:"Eastern Europe"},{n:"Slovakia",c:"sk",r:"Europe",fam:"panslavic",tell:"White-blue-red + shield with a white double-cross on three blue hills.",hook:"vs Slovenia: SlovaKia's shield is at CENTRE-ish and has a Cross on hills. 'K = Kross.'",mean:"Double-cross = Christian heritage.",hist:"The Pan-Slavic white-blue-red with the national arms \u2014 a double cross on three hills \u2014 shifted toward the hoist.",sub:"Eastern Europe"},{n:"Slovenia",c:"si",r:"Europe",fam:"panslavic",tell:"White-blue-red + shield near the HOIST with Mt. Triglav + stars.",hook:"vs Slovakia: SloveNia's shield hugs the hoist (top-left) and shows a mountaiN. 'N = mountaiN, Near the pole.'",mean:"Triglav is Slovenia's highest peak.",hist:"Pan-Slavic white-blue-red with arms showing Mount Triglav and stars from the Counts of Celje.",sub:"Southern Europe"},{n:"Serbia",c:"rs",r:"Europe",fam:"panslavic",tell:"Red-blue-white (inverted order) + eagle & crown shield toward hoist.",hook:"Serbia flips the Slavic order to Red-Blue-White and adds a double eagle. 'Serbia = Same colours, Swapped order.'",mean:"Double-headed eagle, royal arms.",hist:"Inverted Pan-Slavic stripes (red-blue-white) charged with the state arms: a double-headed eagle and shield.",sub:"Southern Europe"},{n:"Croatia",c:"hr",r:"Europe",fam:"panslavic",tell:"Red-white-blue + red-and-white CHECKERBOARD shield.",hook:"Croatia = the CHECKERED shield (\u0161ahovnica). Only Slavic tricolour with a chessboard.",mean:"Checkerboard is centuries-old Croatian symbol.",hist:"Pan-Slavic red-white-blue stripes centred by the checkerboard '\u0161ahovnica' shield, a Croatian symbol for centuries.",sub:"Southern Europe"},{n:"Czechia",c:"cz",r:"Europe",fam:"panslavic",tell:"White over red with a blue triangle from the hoist.",hook:"Czech = a blue WEDGE eating into white/red. Poland+blue triangle.",mean:"Blue added to distinguish from Poland.",hist:"White over red (the old Bohemian colours) with a blue triangle added in 1920 to tell it apart from Poland; kept after the 1993 split.",sub:"Eastern Europe"},{n:"Poland",c:"pl",r:"Europe",fam:"unique",tell:"White on top, red on bottom. Nothing else.",hook:"vs Indonesia/Monaco (red-over-white): Poland is White-over-red \u2014 the INVERSE. 'Poland = Pale on top.'",mean:"White eagle on red field, simplified.",hist:"Simply white over red, taken from the white eagle on a red shield used since medieval times.",sub:"Eastern Europe"},{n:"Austria",c:"at",r:"Europe",fam:"unique",tell:"Red-white-red horizontal bands.",hook:"Red-White-Red. Legend: a duke's white tunic stayed white only under his belt after battle. Same stripes as Latvia but Austria's red is brighter and bands are equal.",mean:"One of the oldest flags.",hist:"Red-white-red is among Europe's oldest designs; legend ties it to a duke's blood-soaked tunic, white where his belt had been.",sub:"Western Europe"},{n:"Latvia",c:"lv",r:"Europe",fam:"unique",tell:"Dark carmine-red / white / dark-red, with a thin white stripe.",hook:"vs Austria: Latvia's red is a MAROON/dried-blood shade and the white stripe is THINNER. 'Latvia = darker, leaner.'",mean:"Legend of a bloodstained sheet.",hist:"A deep carmine 'Latvian red' with a narrow white stripe, mentioned in a 13th-century chronicle and revived at independence in 1918.",sub:"Northern Europe"},{n:"Germany",c:"de",r:"Europe",fam:"tricolor",tell:"Black-red-gold horizontal.",hook:"Black-Red-Gold, top\u2192down. vs Belgium (same colours but VERTICAL).",mean:"1848 liberal revolution colours.",hist:"Black-red-gold dates to 19th-century liberal and unification movements and became the flag of the democratic republic and of reunified Germany.",sub:"Western Europe"},{n:"Belgium",c:"be",r:"Europe",fam:"tricolor",tell:"Black-yellow-red VERTICAL.",hook:"vs Germany: Belgium is the same trio but standing UP (vertical), and yellow is in the middle.",mean:"From the Duchy of Brabant.",hist:"Black-yellow-red vertical stripes from the arms of the Duchy of Brabant, adopted at the 1830 revolution.",sub:"Western Europe"},{n:"Italy",c:"it",r:"Europe",fam:"tricolor",tell:"Green-white-red vertical.",hook:"vs Ireland/Mexico: Italy is short/even and has NO emblem. 'Italy = pizza margherita: green basil, white mozzarella, red tomato.'",mean:"Napoleonic-era tricolour.",hist:"Green-white-red, inspired by the French tricolour in the Napoleonic era and adopted at Italian unification.",sub:"Southern Europe"},{n:"Ireland",c:"ie",r:"Europe",fam:"tricolor",tell:"Green-white-ORANGE vertical, green at hoist.",hook:"vs C\xF4te d'Ivoire: Ireland's GREEN is at the pole (Irish are 'green with envy'), orange trails. Also longer than Italy and ends in orange not red.",mean:"Green Catholics, orange Protestants, white peace.",hist:"Green for the Gaelic-Catholic tradition, orange for Protestants, and white for peace between them \u2014 a tricolour of reconciliation from 1848.",sub:"Northern Europe"},{n:"Hungary",c:"hu",r:"Europe",fam:"tricolor",tell:"Red-white-green horizontal.",hook:"vs Italy (vertical) & Bulgaria (has green not red on bottom): Hungary is horizontal Red-White-Green.",mean:"Strength, faithfulness, hope.",hist:"Red-white-green stripes: red for strength, white for faithfulness, green for hope, flown since the 1848 revolution.",sub:"Eastern Europe"},{n:"Bulgaria",c:"bg",r:"Europe",fam:"tricolor",tell:"White-green-red horizontal.",hook:"vs Hungary: Bulgaria puts GREEN in the middle and white on top. 'Bulgaria's Belly is green.'",mean:"White peace, green land, red valour.",hist:"White-green-red horizontal bands: white for peace, green for the country's farmland and forests, red for the blood of independence.",sub:"Eastern Europe"},{n:"Spain",c:"es",r:"Europe",fam:"unique",tell:"Red-yellow-red with a wide gold band + coat of arms toward hoist.",hook:"'Blood and sand' \u2014 thin red / thick gold / thin red, crest on the left. The wide gold stripe is the tell.",mean:"Pillars of Hercules on the arms.",hist:"The red-yellow-red 'Rojigualda' was chosen in the 18th century for visibility at sea; the arms show the historic kingdoms and the Pillars of Hercules.",sub:"Southern Europe"},{n:"Portugal",c:"pt",r:"Europe",fam:"unique",tell:"Green (hoist) + red, with armillary sphere & shield on the seam.",hook:"Portugal = the golden SPHERE (navigator's armillary) on the green/red seam. Green is the smaller hoist side.",mean:"Sphere = Age of Discovery.",hist:"Green and red were adopted with the 1910 republic; the armillary sphere recalls the Age of Discovery and the shield the victories over the Moors.",sub:"Southern Europe"},{n:"Greece",c:"gr",r:"Europe",fam:"unique",tell:"Nine blue-white stripes + white cross on blue canton.",hook:"Greece = SEA STRIPES (9, for the syllables of 'Freedom or Death') with a cross in the corner.",mean:"Blue sea/sky, white waves, Orthodox cross.",hist:"Nine blue-and-white stripes (often linked to the syllables of 'Freedom or Death') with a white cross for Orthodox Christianity.",sub:"Southern Europe"},{n:"Switzerland",c:"ch",r:"Europe",fam:"unique",tell:"SQUARE. White cross on red.",hook:"One of only two square flags (with Vatican). Red Cross is its colour-inverse.",mean:"Neutrality; medieval Swiss cross.",hist:"A white cross on red \u2014 one of only two square national flags \u2014 with a cross dating to medieval confederate forces.",sub:"Western Europe"},{n:"United Kingdom",c:"gb",r:"Europe",fam:"unique",tell:"The Union Jack \u2014 overlaid red+white crosses on blue.",hook:"Three crosses stacked: England (red +), Scotland (white X), Ireland (red X). The 'canton parent' of Australia, NZ, Fiji, Tuvalu.",mean:"Union of the kingdoms.",hist:"The Union Jack overlays the crosses of St George (England), St Andrew (Scotland) and St Patrick (Ireland), combined in 1801.",sub:"Northern Europe"},{n:"Albania",c:"al",r:"Europe",fam:"unique",tell:"Black double-headed EAGLE on deep red.",hook:"Albania = one angry black double eagle on blood-red. 'Land of the Eagles.'",mean:"Skanderbeg's eagle.",hist:"A black double-headed eagle on red, taken from the seal of the 15th-century national hero Skanderbeg.",sub:"Southern Europe"},{n:"Montenegro",c:"me",r:"Europe",fam:"unique",tell:"Gold-bordered red field with a gold double-headed eagle + lion.",hook:"vs Albania: Montenegro's eagle is GOLD on red with a gold border (looks 'framed/royal').",mean:"Royal standard revived.",hist:"A red banner with a gold border bearing the state arms \u2014 a crowned double-headed eagle \u2014 adopted in 2004.",sub:"Southern Europe"},{n:"Malta",c:"mt",r:"Europe",fam:"unique",tell:"White + red halves with the George Cross (grey) at top hoist.",hook:"Malta = split White|Red with a little grey medal in the top-left corner.",mean:"George Cross awarded for WWII bravery.",hist:"White and red with the George Cross, awarded by Britain in 1942 for the islanders' wartime bravery, in the top hoist corner.",sub:"Southern Europe"},{n:"Andorra",c:"ad",r:"Europe",fam:"grancolombia",tell:"Blue-yellow-red vertical + coat of arms in the centre.",hook:"vs Romania/Chad/Moldova: Andorra has an EMBLEM in the middle (cows & mitre). 'Andorra = Arms in the middle, thin.'",mean:"Franco-Spanish co-principality.",hist:"A blue-yellow-red tricolour blending French and Spanish colours (for its two co-princes) with the national arms at the centre.",sub:"Southern Europe"},{n:"Moldova",c:"md",r:"Europe",fam:"grancolombia",tell:"Blue-yellow-red vertical + eagle-with-shield emblem centred.",hook:"vs Andorra: Moldova's emblem is an EAGLE holding a shield (aurochs head). Same tricolour, different crest.",mean:"Related to Romania; eagle & aurochs.",hist:"A blue-yellow-red tricolour close to Romania's, with the state arms: an eagle holding a shield with an aurochs head.",sub:"Eastern Europe"},{n:"Romania",c:"ro",r:"Europe",fam:"grancolombia",tell:"Blue-yellow-red vertical, NO emblem, brighter cobalt blue.",hook:"vs Chad: Romania's blue is a brighter cobalt. Twins otherwise. 'Romania = Radiant blue.'",mean:"Plain civil version of the arms flag.",hist:"Blue-yellow-red vertical tricolour \u2014 nearly identical to Chad's \u2014 drawn from the colours of the historic provinces.",sub:"Eastern Europe"},{n:"Ukraine",c:"ua",r:"Europe",fam:"unique",tell:"Blue over yellow, two equal bands.",hook:"Ukraine = blue SKY over yellow WHEAT fields. Just two stripes.",mean:"Sky and grain.",hist:"Two bands, blue above yellow, for blue sky over golden wheat fields.",sub:"Eastern Europe"},{n:"Belarus",c:"by",r:"Europe",fam:"unique",tell:"Red over green with a red-on-white embroidery pattern at the hoist.",hook:"Belarus = red/green with a woven RUG pattern running up the left edge.",mean:"Ornament from folk textiles.",hist:"Red and green with a white-and-red traditional embroidery pattern at the hoist, based on the 1951 Soviet-era design.",sub:"Eastern Europe"},{n:"Estonia",c:"ee",r:"Europe",fam:"unique",tell:"Blue-black-white horizontal.",hook:"Estonia = the only Baltic with BLACK in the middle. 'Blue skies, black past, white hope.' Blue on top.",mean:"National awakening colours.",hist:"Blue-black-white: blue for sky and lakes, black for the soil and hardship, white for snow and hope \u2014 from a 19th-century student society.",sub:"Northern Europe"},{n:"Lithuania",c:"lt",r:"Europe",fam:"panafrican",tell:"Yellow-green-red horizontal.",hook:"vs Africa's yellow/green/red: Lithuania is the European one. 'Lit up: yellow sun on top.'",mean:"Sun, forests, blood.",hist:"Yellow-green-red: yellow for sun and prosperity, green for forests, red for the blood shed for the nation.",sub:"Northern Europe"},{n:"Bosnia and Herzegovina",c:"ba",r:"Europe",fam:"unique",tell:"Blue field, yellow triangle, row of white stars along the diagonal.",hook:"Bosnia = a yellow TRIANGLE (the country's shape) with stars marching up its edge.",mean:"Triangle = 3 peoples; EU-style stars.",hist:"Blue with a yellow triangle (for the three peoples and the country's shape) and a line of white stars; adopted in 1998 as a neutral design.",sub:"Southern Europe"},{n:"North Macedonia",c:"mk",r:"Europe",fam:"unique",tell:"Golden sun with rays radiating to the edges on red.",hook:"N. Macedonia = a blazing SUN with 8 thick rays reaching the corners, on red.",mean:"'New sun of liberty.'",hist:"A stylised golden sun with eight rays on red, adopted in 1995 to replace the disputed Vergina sun.",sub:"Southern Europe"},{n:"Kosovo",c:"xk",r:"Europe",fam:"unique",tell:"Blue field, gold map of Kosovo, 6 white stars in an arc.",hook:"Kosovo = the country's own MAP in gold under 6 stars. (Bosnia/EU cousin.)",mean:"6 stars = 6 ethnic groups.",hist:"Blue with a gold map of the territory and six white stars for its main communities; adopted at independence in 2008.",sub:"Southern Europe"},{n:"Cyprus",c:"cy",r:"Europe",fam:"unique",tell:"White field, copper-coloured island map + two green olive branches.",hook:"Cyprus = its own copper ISLAND shape (Cyprus = copper) over crossed olive branches.",mean:"Neutral map + peace branches.",hist:"A copper-coloured map of the island above two olive branches for peace \u2014 one of the few flags to depict its own map.",sub:"Southern Europe"},{n:"Liechtenstein",c:"li",r:"Europe",fam:"unique",tell:"Blue over red with a gold CROWN in the top hoist.",hook:"Liechtenstein = blue/red with a little gold crown (added after being mistaken for Haiti at the Olympics!).",mean:"Crown = the princely house.",hist:"Blue over red with a gold crown, added in 1937 after the flag was found to be identical to Haiti's at the Olympics.",sub:"Western Europe"},{n:"Monaco",c:"mc",r:"Europe",fam:"unique",tell:"Red over white, nearly square.",hook:"vs Indonesia: identical colours, but Monaco is more SQUARE (and tiny country). vs Poland: inverse.",mean:"Grimaldi heraldic colours.",hist:"Red over white from the heraldic colours of the ruling Grimaldi family; almost identical to Indonesia's flag.",sub:"Western Europe"},{n:"San Marino",c:"sm",r:"Europe",fam:"unique",tell:"White over light-blue + coat of arms with three towers.",hook:"San Marino = white/sky-blue with THREE TOWERS on a mountain crest.",mean:"Three towers of Monte Titano.",hist:"White over light blue with the state arms \u2014 white for the snowy peaks of Mount Titano, blue for the sky.",sub:"Southern Europe"},{n:"Vatican City",c:"va",r:"Europe",fam:"unique",tell:"SQUARE. Yellow + white with crossed keys & tiara.",hook:"Vatican = the other square flag: gold|white with St. Peter's KEYS.",mean:"Keys of the papacy.",hist:"Yellow and white vertical bands with the papal tiara and crossed keys of St Peter; one of only two square flags.",sub:"Southern Europe"},{n:"Japan",c:"jp",r:"Asia",fam:"unique",tell:"Single red disc centred on white.",hook:"Land of the Rising Sun \u2192 one red SUN on white. The cleanest sun flag.",mean:"Hinomaru, 'circle of the sun.'",hist:"The Hinomaru, a red sun disc on white, reflects Japan as the 'Land of the Rising Sun'; used for centuries and official since the 19th.",sub:"East Asia"},{n:"Bangladesh",c:"bd",r:"Asia",fam:"unique",tell:"Red disc slightly off-centre on green.",hook:"vs Japan: Bangladesh = green field (lush delta), disc nudged toward the hoist so it looks centred when flying.",mean:"Green land, red sun of independence.",hist:"A red disc set slightly toward the hoist on green: green for the land, the red sun for the blood of the 1971 independence war.",sub:"South Asia"},{n:"Palau",c:"pw",r:"Oceania",fam:"unique",tell:"Yellow disc off-centre on sky-blue.",hook:"vs Japan: Palau = golden MOON on Pacific blue, disc left of centre.",mean:"Full moon over the ocean.",hist:"A golden full moon offset on sky blue \u2014 blue for the ocean, the moon for peace and nationhood, not Japan's sun.",sub:"Micronesia"},{n:"South Korea",c:"kr",r:"Asia",fam:"unique",tell:"Red-blue yin-yang + 4 black trigrams in the corners.",hook:"Korea = the TAEGEUK swirl with 4 bar-symbols in the corners. 'Balance + 4 corners.'",mean:"Um-yang harmony; I Ching trigrams.",hist:"The white field bears the red-blue taegeuk (yin-yang) and four black trigrams from the I Ching, symbols of balance.",sub:"East Asia"},{n:"China",c:"cn",r:"Asia",fam:"unique",tell:"Red field, one big gold star + 4 small stars arcing around it.",hook:"China = one BIG star (Party) leading 4 little stars, top-left. Red field.",mean:"Communist Party + the people.",hist:"Red for the revolution with one large gold star for the Communist Party and four smaller stars for the united people.",sub:"East Asia"},{n:"Vietnam",c:"vn",r:"Asia",fam:"unique",tell:"Single large yellow star centred on red.",hook:"vs China: Vietnam = ONE big yellow star, dead CENTRE.",mean:"Star of revolution.",hist:"A single gold five-pointed star on red, for the revolution and the unity of the people's classes.",sub:"Southeast Asia"},{n:"Taiwan",c:"tw",r:"Asia",fam:"unique",tell:"Red field, blue canton with a white 12-ray sun.",hook:"Taiwan = 'blue sky, white sun, red earth' \u2014 a white 12-point sun in a blue box.",mean:"12 rays = 12 hours/months of progress.",hist:"A red field with a blue canton holding a 'white sun with twelve rays', the emblem of the Kuomintang and the Republic of China.",sub:"East Asia"},{n:"North Korea",c:"kp",r:"Asia",fam:"unique",tell:"Blue-red-blue bands + white disc with a red star toward hoist.",hook:"N. Korea = red central band with a red STAR in a white circle. Blue borders.",mean:"Star of communism.",hist:"A wide red band with a red star in a white disc, framed by white and blue stripes \u2014 red for revolution, blue for sovereignty.",sub:"East Asia"},{n:"Mongolia",c:"mn",r:"Asia",fam:"unique",tell:"Red-blue-red vertical + gold soyombo symbol at hoist.",hook:"Mongolia = the gold SOYOMBO column (fire, sun, moon) on the left, blue sky stripe in the middle.",mean:"Soyombo = national emblem.",hist:"Red-blue-red panels with the yellow 'Soyombo' emblem at the hoist, a column of symbols for fire, sun, moon and more.",sub:"East Asia"},{n:"India",c:"in",r:"Asia",fam:"unique",tell:"Saffron-white-green + navy 24-spoke wheel in the centre.",hook:"India = the blue CHAKRA wheel centred on the white band.",mean:"Ashoka wheel of dharma.",hist:"Saffron, white and green with the navy-blue Ashoka Chakra (a 24-spoke wheel) at the centre, standing for law and motion.",sub:"South Asia"},{n:"Niger",c:"ne",r:"Africa",fam:"unique",tell:"Orange-white-green with a small orange disc centred.",hook:"vs India: Niger has a plain orange CIRCLE (sun) instead of a wheel, and is nearly square.",mean:"Sun over the Sahara + Niger River.",hist:"Orange-white-green horizontal bands with an orange sun disc \u2014 close to India's flag, but with a plain circle.",sub:"Western Africa"},{n:"Pakistan",c:"pk",r:"Asia",fam:"crescent",tell:"White hoist stripe + green field with white crescent & star.",hook:"Pakistan = green with a white VERTICAL stripe at the pole, plus crescent+star.",mean:"White stripe = minorities.",hist:"Dark green with a white crescent and star, plus a white hoist stripe representing the country's religious minorities.",sub:"South Asia"},{n:"Turkey",c:"tr",r:"Asia",fam:"crescent",tell:"Red field, white crescent + star.",hook:"Turkey = the classic red crescent flag; star sits INSIDE the crescent's opening.",mean:"Ottoman heritage.",hist:"A white crescent and star on red, symbols carried over from the Ottoman Empire.",sub:"Western Asia"},{n:"Tunisia",c:"tn",r:"Africa",fam:"crescent",tell:"Red field, white CIRCLE containing red crescent & star.",hook:"vs Turkey: Tunisia puts its crescent+star inside a white DISC.",mean:"White sun-disc, Ottoman roots.",hist:"A red field with a white disc containing a red crescent and star, rooted in Ottoman-era design.",sub:"Northern Africa"},{n:"Malaysia",c:"my",r:"Asia",fam:"crescent",tell:"14 red/white stripes + blue canton with yellow crescent & 14-point star.",hook:"vs USA: Malaysia = 'Stars & Stripes' cousin but with a CRESCENT + one big star. 14 stripes = 14 states.",mean:"Federation of 14.",hist:"The 'Jalur Gemilang': 14 red-and-white stripes and a 14-pointed star for the states and territories, with a crescent for Islam.",sub:"Southeast Asia"},{n:"Singapore",c:"sg",r:"Asia",fam:"crescent",tell:"Red over white + white crescent & 5 stars in the top hoist.",hook:"Singapore = red/white split, crescent hugging FIVE stars in a ring, top-left.",mean:"5 stars = democracy, peace, progress, justice, equality.",hist:"Red over white with a white crescent and five stars for democracy, peace, progress, justice and equality.",sub:"Southeast Asia"},{n:"Indonesia",c:"id",r:"Asia",fam:"unique",tell:"Red over white, 3:2 ratio.",hook:"vs Monaco (squarer) & Poland (inverse): Indonesia = big red-over-white banner. 'Indonesia is Immense/wide.'",mean:"Courage over purity.",hist:"Simply red over white ('Sang Saka Merah-Putih') \u2014 red for courage, white for purity; identical to Monaco's but wider.",sub:"Southeast Asia"},{n:"Thailand",c:"th",r:"Asia",fam:"unique",tell:"Red-white-BLUE-white-red horizontal (blue centre is double-height).",hook:"Thailand = 5 stripes, fat BLUE middle. 'Nation(red)-Religion(white)-King(blue).'",mean:"Blue = monarchy, wider centre.",hist:"Five stripes ('Trairong'): red for the nation, white for religion, and the central blue for the monarchy.",sub:"Southeast Asia"},{n:"Laos",c:"la",r:"Asia",fam:"unique",tell:"Red-blue-red + big white disc centred.",hook:"vs Thailand: Laos = red/blue/red with a plain white MOON on the blue.",mean:"Moon over the Mekong.",hist:"Red bands around a blue centre bearing a white disc \u2014 the full moon over the Mekong and the unity of the people.",sub:"Southeast Asia"},{n:"Cambodia",c:"kh",r:"Asia",fam:"unique",tell:"Blue-red-blue + white ANGKOR WAT temple centred.",hook:"Cambodia = the only flag with a BUILDING: white Angkor Wat on red.",mean:"Angkor Wat temple.",hist:"The only national flag to show a building: a white image of Angkor Wat on a red band between blue stripes.",sub:"Southeast Asia"},{n:"Nepal",c:"np",r:"Asia",fam:"unique",tell:"The only NON-rectangular flag \u2014 two stacked triangular pennants with moon & sun.",hook:"Nepal = double PENNANT (crimson, blue border), sun below, moon above. Unmistakable shape.",mean:"Himalayan peaks; sun & moon = permanence.",hist:"The world's only non-rectangular national flag \u2014 two stacked pennants bearing a moon and sun to symbolise permanence.",sub:"South Asia"},{n:"Bhutan",c:"bt",r:"Asia",fam:"unique",tell:"Diagonal split yellow/orange with a white DRAGON.",hook:"Bhutan = 'Land of the Thunder Dragon' \u2014 a white dragon lies along the diagonal.",mean:"Druk, the thunder dragon.",hist:"A white 'Druk' (the Thunder Dragon) across a divided field \u2014 yellow for civil authority, orange for Buddhism.",sub:"South Asia"},{n:"Sri Lanka",c:"lk",r:"Asia",fam:"unique",tell:"Golden LION holding a sword on maroon, plus green+orange stripes at hoist.",hook:"Sri Lanka = a sword-wielding LION and 4 corner leaves; green/orange bars for minorities.",mean:"Sinhalese lion + Tamil/Muslim stripes.",hist:"A gold lion holding a sword on maroon, with bo-tree leaves at the corners and stripes for the Tamil and Muslim communities.",sub:"South Asia"},{n:"Philippines",c:"ph",r:"Asia",fam:"unique",tell:"Blue over red + white hoist triangle with sun & 3 stars.",hook:"Philippines = white TRIANGLE at the pole, golden sun + 3 stars. (Flips to red-on-top in wartime.)",mean:"Sun = liberty, 3 stars = island groups.",hist:"Blue, red and white with a golden sun and three stars; uniquely, it is flown blue-up in peacetime and red-up in war.",sub:"Southeast Asia"},{n:"Myanmar",c:"mm",r:"Asia",fam:"unique",tell:"Yellow-green-red horizontal + big white star centred.",hook:"Myanmar = Pan-Africa-looking bands (yellow/green/red) but with one big white STAR.",mean:"Solidarity star.",hist:"Yellow-green-red horizontal stripes with a large white star at the centre, adopted in 2010.",sub:"Southeast Asia"},{n:"Israel",c:"il",r:"Asia",fam:"unique",tell:"Blue Star of David between two blue stripes on white.",hook:"Israel = blue STAR OF DAVID; stripes echo a prayer shawl (tallit).",mean:"Menorah nation; tallit design.",hist:"A blue Star of David between two blue stripes on white, echoing the tallit prayer shawl.",sub:"Western Asia"},{n:"Lebanon",c:"lb",r:"Asia",fam:"unique",tell:"Red-white-red with a green CEDAR tree centred.",hook:"Lebanon = the green CEDAR on the white band (red bands top & bottom).",mean:"Cedar of Lebanon.",hist:"Red stripes around a white band bearing a green cedar tree, the ancient symbol of Lebanon.",sub:"Western Asia"},{n:"Saudi Arabia",c:"sa",r:"Asia",fam:"unique",tell:"Green field, white Arabic shahada + a sword.",hook:"Saudi = green with white SCRIPT and a SWORD underlining it.",mean:"The Islamic declaration of faith.",hist:"Green with the Islamic declaration of faith (shahada) and a sword in white; because of the sacred text, it is never flown at half-mast.",sub:"Western Asia"},{n:"Afghanistan",c:"af",r:"Asia",fam:"unique",tell:"White field with black shahada script (Taliban flag).",hook:"Afghanistan (current) = plain WHITE with black Arabic script.",mean:"Islamic Emirate banner.",hist:"Afghanistan's flag has changed more often than almost any nation's, shifting with each government; recent versions carry the Islamic declaration of faith.",sub:"South Asia"},{n:"Iran",c:"ir",r:"Asia",fam:"panafrican",tell:"Green-white-red + red emblem centred + Kufic script along the band edges.",hook:"Iran = green/white/red with a tulip-like EMBLEM and rows of tiny script (Allahu Akbar x22).",mean:"Emblem = stylised 'Allah'.",hist:"Green-white-red with a stylised red emblem forming the word 'Allah', and 'Allahu Akbar' repeated along the band edges.",sub:"Western Asia"},{n:"Iraq",c:"iq",r:"Asia",fam:"panarab",tell:"Red-white-black + green 'Allahu Akbar' script centred.",hook:"Iraq = Pan-Arab bars with green SCRIPT (takbir) across the white middle.",mean:"Red/white/black + takbir.",hist:"Red-white-black Arab-liberation stripes with the green takbir, 'Allahu Akbar', in the white band.",sub:"Western Asia"},{n:"Syria",c:"sy",r:"Asia",fam:"panarab",tell:"Green-white-black with three red stars (current transitional flag).",hook:"Syria (2024+) = green top, black bottom, THREE red stars on white. (Note: recently changed from red-top.)",mean:"Independence-era flag revived.",hist:"An Arab-liberation design in red/black, white and green with stars; Syria's official flag changed in 2024 with its new government.",sub:"Western Asia"},{n:"Yemen",c:"ye",r:"Asia",fam:"panarab",tell:"Red-white-black horizontal, plain.",hook:"Yemen = the BARE Pan-Arab tricolour, no emblem. 'Yemen = plainest of the reds.'",mean:"Arab Liberation colours.",hist:"A plain red-white-black horizontal tricolour in the Arab-liberation colours, adopted at the 1990 unification of North and South Yemen.",sub:"Western Asia"},{n:"Egypt",c:"eg",r:"Africa",fam:"panarab",tell:"Red-white-black + gold Eagle of Saladin centred.",hook:"vs Yemen/Iraq/Syria: Egypt = the golden EAGLE on the white band.",mean:"Eagle of Saladin.",hist:"Red-white-black Arab-liberation stripes with the gold Eagle of Saladin at the centre.",sub:"Northern Africa"},{n:"Jordan",c:"jo",r:"Asia",fam:"panarab",tell:"Black-white-green + red hoist triangle with a white 7-point star.",hook:"vs Palestine: Jordan adds a white 7-pointed STAR inside the red triangle.",mean:"Star = 7 verses of the Quran's opening.",hist:"Black, white and green Arab Revolt stripes with a red hoist triangle bearing a white seven-pointed star.",sub:"Western Asia"},{n:"Palestine",c:"ps",r:"Asia",fam:"panarab",tell:"Black-white-green + plain red hoist triangle (no star).",hook:"vs Jordan: Palestine's red triangle is EMPTY. 'Palestine = plain triangle.'",mean:"Pan-Arab; Arab Revolt colours.",hist:"The Arab Revolt colours \u2014 black, white and green stripes with a red triangle \u2014 symbolising Palestinian nationhood.",sub:"Western Asia"},{n:"Sudan",c:"sd",r:"Africa",fam:"panarab",tell:"Red-white-black + GREEN hoist triangle.",hook:"vs Jordan/Palestine: Sudan's triangle is GREEN, not red. 'Sudan = green wedge.'",mean:"Green wedge = Islam/prosperity.",hist:"Red-white-black Arab-liberation stripes with a green hoist triangle, adopted in 1970.",sub:"Northern Africa"},{n:"United Arab Emirates",c:"ae",r:"Asia",fam:"panarab",tell:"Red VERTICAL hoist bar + green-white-black horizontal bands.",hook:"UAE = red stands UP the pole, then green/white/black flow right. 'UAE = red pillar on the left.'",mean:"Pan-Arab unity.",hist:"The Pan-Arab colours \u2014 red, green, white and black \u2014 uniting the seven emirates in 1971.",sub:"Western Asia"},{n:"Kuwait",c:"kw",r:"Asia",fam:"panarab",tell:"Green-white-red + black TRAPEZOID from the hoist.",hook:"vs UAE: Kuwait's hoist shape is a black slanted TRAPEZOID, and bands are green/white/red.",mean:"Pan-Arab; black trapezoid.",hist:"Pan-Arab green, white and red stripes with a black trapezoid at the hoist, adopted at independence in 1961.",sub:"Western Asia"},{n:"Qatar",c:"qa",r:"Asia",fam:"unique",tell:"MAROON + white split by a 9-point serrated line.",hook:"vs Bahrain: Qatar is MAROON with NINE white spikes (and taller/skinnier). 'Qatar = 9, darker.'",mean:"9 points = 9th Gulf emirate.",hist:"Maroon and white split by a nine-point serrated line; the distinctive maroon came from natural dye fading in the sun over time.",sub:"Western Asia"},{n:"Bahrain",c:"bh",r:"Asia",fam:"unique",tell:"RED + white split by a 5-point serrated line.",hook:"vs Qatar: Bahrain is bright RED with FIVE spikes. 'Bahrain = fewer, brighter.'",mean:"5 points = 5 pillars of Islam.",hist:"White and red divided by a five-point zigzag, the points standing for the Five Pillars of Islam.",sub:"Western Asia"},{n:"Oman",c:"om",r:"Asia",fam:"unique",tell:"Red hoist bar (with khanjar dagger) + white/red/green fields.",hook:"Oman = the crossed DAGGER (khanjar) emblem in the top hoist; red L-shape.",mean:"National khanjar dagger.",hist:"White, red and green with the national emblem \u2014 crossed swords and a khanjar dagger \u2014 in the top hoist.",sub:"Western Asia"},{n:"Kazakhstan",c:"kz",r:"Asia",fam:"unique",tell:"Sky-blue with a gold sun + eagle + ornamental hoist pattern.",hook:"Kazakhstan = golden EAGLE under a sun on turquoise; a gold 'vine' runs up the pole.",mean:"Steppe eagle, endless sky.",hist:"Sky blue with a golden sun and a soaring steppe eagle, and an ornamental national pattern down the hoist.",sub:"Central Asia"},{n:"Uzbekistan",c:"uz",r:"Asia",fam:"unique",tell:"Blue-white-green (thin red lines) + crescent & 12 stars in top blue.",hook:"Uzbekistan = blue/white/green with a crescent and an ARC of 12 stars.",mean:"12 stars = zodiac/months.",hist:"Blue, white and green stripes edged in red, with a crescent and twelve stars, adopted at independence in 1991.",sub:"Central Asia"},{n:"Turkmenistan",c:"tm",r:"Asia",fam:"unique",tell:"Green field + vertical CARPET stripe of guls + crescent & 5 stars.",hook:"Turkmenistan = green with a red CARPET band running up the hoist (most detailed flag).",mean:"Carpet guls = five tribes.",hist:"Green with a vertical band of five carpet 'guls' (rug patterns) beside a crescent and stars \u2014 often called the world's most detailed flag.",sub:"Central Asia"},{n:"Kyrgyzstan",c:"kg",r:"Asia",fam:"unique",tell:"Red field, yellow sun with a criss-cross tunduk (yurt roof) centre.",hook:"Kyrgyzstan = red with a SUN whose centre shows a yurt's roof lattice.",mean:"Tunduk = the crown of a yurt.",hist:"A red field with a golden sun whose centre shows the crossed roof-poles (tunduk) of a traditional yurt.",sub:"Central Asia"},{n:"Tajikistan",c:"tj",r:"Asia",fam:"unique",tell:"Red-white-green (wide white) + gold crown & 7 stars.",hook:"vs Iran/Hungary: Tajikistan = red/white/green with a gold CROWN + arc of 7 stars on the wide white band.",mean:"Crown + 7 stars = unity.",hist:"Red-white-green stripes with a golden crown and an arc of seven stars in the centre.",sub:"Central Asia"},{n:"Azerbaijan",c:"az",r:"Asia",fam:"unique",tell:"Blue-red-green + white crescent & 8-point star on red.",hook:"Azerbaijan = blue/red/green stack with crescent+star. 'Turkic (blue), progress (red), Islam (green).'",mean:"8 points = Turkic peoples.",hist:"Blue, red and green stripes with a white crescent and eight-pointed star \u2014 blue for Turkic heritage, red for progress, green for Islam.",sub:"Western Asia"},{n:"Armenia",c:"am",r:"Asia",fam:"unique",tell:"Red-blue-orange horizontal.",hook:"Armenia = red/blue/APRICOT-orange. 'Armenian apricot on the bottom.'",mean:"Blood, sky, apricot/wheat.",hist:"Red, blue and apricot-orange stripes \u2014 red for the people's blood, blue for the sky, orange for the land and courage.",sub:"Western Asia"},{n:"Georgia",c:"ge",r:"Asia",fam:"unique",tell:"Big red cross on white + a small red cross in each quarter (5 crosses).",hook:"Georgia = FIVE red crosses (one big, four small) on white \u2014 the 'Five Cross Flag.'",mean:"St. George crosses.",hist:"The 'Five Cross Flag': one large red St George's cross with four smaller Bolnisi crosses, a medieval design revived in 2004.",sub:"Western Asia"},{n:"Maldives",c:"mv",r:"Asia",fam:"unique",tell:"Red border, green rectangle, white crescent.",hook:"Maldives = green box inside a red frame, white crescent inside the green.",mean:"Red frame, green palms, Islam.",hist:"A red border around green with a white crescent \u2014 red for national heroes, green for palms and prosperity, the crescent for Islam.",sub:"South Asia"},{n:"Brunei",c:"bn",r:"Asia",fam:"unique",tell:"Yellow field, black & white diagonal stripes, red crest centred.",hook:"Brunei = YELLOW with two slanted black/white bars and a red parasol crest.",mean:"Yellow = sultan; crest = state motto.",hist:"Yellow with black and white diagonal stripes and a red national crest that includes a crescent and upturned hands.",sub:"Southeast Asia"},{n:"Timor-Leste",c:"tl",r:"Asia",fam:"unique",tell:"Red field, black triangle with white star, yellow triangle behind.",hook:"Timor-Leste = nested TRIANGLES (yellow then black) with a white star at the point.",mean:"Star of hope emerging.",hist:"Red with a black triangle and a white star, adopted at independence in 2002 \u2014 black for the darkness to be overcome, the star for peace.",sub:"Southeast Asia"},{n:"Ethiopia",c:"et",r:"Africa",fam:"panafrican",tell:"Green-yellow-red + blue disc with a gold star (pentagram).",hook:"Ethiopia = the ORIGIN of Pan-African colours; centre has a blue circle + radiant star.",mean:"Never colonised; the template.",hist:"Green-yellow-red with a blue disc and gold star; as an uncolonised power, Ethiopia was the original source of the Pan-African colours.",sub:"Eastern Africa"},{n:"Ghana",c:"gh",r:"Africa",fam:"panafrican",tell:"Red-yellow-green + black STAR centred.",hook:"Ghana = the 'Black Star' of Africa on red/gold/green.",mean:"Black star of African freedom.",hist:"Red-yellow-green Pan-African stripes with a black star for African freedom \u2014 the star that named the Black Star Line.",sub:"Western Africa"},{n:"Senegal",c:"sn",r:"Africa",fam:"panafrican",tell:"Green-yellow-red VERTICAL + green star on the middle band.",hook:"vs Mali/Guinea: Senegal is vertical with a green STAR in the centre.",mean:"Star = unity, hope.",hist:"Green-yellow-red vertical Pan-African stripes with a green star at the centre.",sub:"Western Africa"},{n:"Mali",c:"ml",r:"Africa",fam:"panafrican",tell:"Green-yellow-red vertical, NO emblem.",hook:"vs Guinea: Mali reads Green\u2192Red left-to-right ('Mali = green Mint on the left'). No star (unlike Senegal).",mean:"Pan-African vertical.",hist:"Green, yellow and red vertical Pan-African stripes, adopted at independence in 1960.",sub:"Western Africa"},{n:"Guinea",c:"gn",r:"Africa",fam:"panafrican",tell:"Red-yellow-green vertical.",hook:"vs Mali: Guinea is the MIRROR \u2014 Red on the left. 'Guinea = Gules(red) at the pole.'",mean:"Reverse of Mali's order.",hist:"Red-yellow-green vertical stripes \u2014 the reverse of Mali's \u2014 for work, justice and solidarity.",sub:"Western Africa"},{n:"Cameroon",c:"cm",r:"Africa",fam:"panafrican",tell:"Green-red-yellow VERTICAL + gold star on the red middle.",hook:"vs Senegal: Cameroon's middle band is RED with a gold star (not green band/green star).",mean:"Star of unity.",hist:"Green, red and yellow vertical Pan-African stripes with a yellow star on the red band.",sub:"Middle Africa"},{n:"Guinea-Bissau",c:"gw",r:"Africa",fam:"panafrican",tell:"Red hoist bar (black star) + yellow/green horizontal fields.",hook:"Guinea-Bissau = red VERTICAL band with a black star, then yellow-over-green. Ghana's colours rearranged.",mean:"Black star of PAIGC.",hist:"A red hoist band with a black star beside yellow and green stripes \u2014 Pan-African colours from the independence party.",sub:"Western Africa"},{n:"Congo (Rep.)",c:"cg",r:"Africa",fam:"panafrican",tell:"Diagonal green/yellow/red from bottom-hoist to top-fly.",hook:"Congo-Brazzaville = Pan-African colours on a DIAGONAL slash.",mean:"Diagonal green/gold/red.",hist:"A yellow diagonal band splitting green and red, a distinctive Pan-African arrangement adopted in 1959.",sub:"Middle Africa"},{n:"Benin",c:"bj",r:"Africa",fam:"panafrican",tell:"Green vertical hoist bar + yellow-over-red horizontal.",hook:"Benin = green box on the left, then yellow above red. 'Benin = big green Block.'",mean:"Pan-African.",hist:"A green hoist band beside horizontal yellow and red, using the Pan-African colours.",sub:"Western Africa"},{n:"Burkina Faso",c:"bf",r:"Africa",fam:"panafrican",tell:"Red over green + yellow STAR in the centre.",hook:"Burkina Faso = red/green split with a gold star on the seam.",mean:"Star of revolution.",hist:"Red over green with a central yellow star \u2014 red for revolution, green for hope and plenty, the star for guidance.",sub:"Western Africa"},{n:"Togo",c:"tg",r:"Africa",fam:"panafrican",tell:"5 green/yellow stripes + red canton with white star.",hook:"Togo = looks like a Pan-African 'Liberia': stripes + a red corner box with a white star.",mean:"5 stripes = 5 regions.",hist:"Five green and yellow stripes with a red canton and a white star, blending Pan-African and stars-and-stripes influences.",sub:"Western Africa"},{n:"Cabo Verde",c:"cv",r:"Africa",fam:"unique",tell:"Blue field, white-red-white stripes low, ring of 10 yellow stars.",hook:"Cabo Verde = a CIRCLE of 10 stars (the islands) on ocean blue.",mean:"10 islands.",hist:"Blue with a white-red-white band and a circle of ten yellow stars for the islands \u2014 closer to European blue than to Pan-African colours.",sub:"Western Africa"},{n:"S\xE3o Tom\xE9 and Pr\xEDncipe",c:"st",r:"Africa",fam:"panafrican",tell:"Green-yellow-green + red hoist triangle + 2 black stars.",hook:"S\xE3o Tom\xE9 = yellow centre with TWO black stars (the two islands), red triangle at pole.",mean:"Two islands, Pan-African.",hist:"Green-yellow-green with a red hoist triangle and two black stars for the two islands, in Pan-African colours.",sub:"Middle Africa"},{n:"Angola",c:"ao",r:"Africa",fam:"unique",tell:"Red over black + gold half-gear, machete & star.",hook:"Angola = red/black with a yellow GEAR + MACHETE (industry + farming).",mean:"Socialist-style emblem.",hist:"Red over black with a crossed machete and half-gearwheel and a star, echoing independence-era and socialist symbolism.",sub:"Middle Africa"},{n:"Mozambique",c:"mz",r:"Africa",fam:"unique",tell:"Green/black/yellow stripes + red triangle with a RIFLE, hoe & book.",hook:"Mozambique = the only flag with a modern RIFLE (AK-47) in the emblem.",mean:"Defence, agriculture, education.",hist:"The only flag with a modern rifle \u2014 an AK-47 crossed with a hoe over an open book \u2014 on Pan-African colours with a red triangle.",sub:"Eastern Africa"},{n:"South Africa",c:"za",r:"Africa",fam:"unique",tell:"Green Y-shape (pall) splitting red/blue with black-and-gold hoist triangle.",hook:"South Africa = the green 'Y' converging \u2014 two paths joining into one.",mean:"Unity of diverse peoples.",hist:"The 1994 'Rainbow Nation' flag: a green Y joins two paths into one, symbolising the unity of a once-divided society.",sub:"Southern Africa"},{n:"Kenya",c:"ke",r:"Africa",fam:"unique",tell:"Black-red-green (white edges) + Maasai SHIELD & spears centred.",hook:"Kenya = a Maasai SHIELD with crossed spears on black/red/green.",mean:"Defence of freedom.",hist:"Black, red and green stripes edged in white with a red-and-white Maasai shield and spears for the defence of freedom.",sub:"Eastern Africa"},{n:"Tanzania",c:"tz",r:"Africa",fam:"unique",tell:"Green & blue split by a black DIAGONAL band with yellow edges.",hook:"Tanzania = green + blue triangles divided by a gold-edged black slash.",mean:"Land, sea, people, minerals.",hist:"A green and blue field split by a gold-edged black diagonal \u2014 green for land, blue for sea, black for the people, gold for minerals.",sub:"Eastern Africa"},{n:"Malawi",c:"mw",r:"Africa",fam:"unique",tell:"Black-red-green + rising red SUN on the black.",hook:"vs Kenya: Malawi = horizontal black/red/green with a red HALF-SUN rising on top.",mean:"Dawn of freedom.",hist:"Black, red and green with a rising red sun on the black band, marking the dawn of freedom for Africa.",sub:"Eastern Africa"},{n:"Uganda",c:"ug",r:"Africa",fam:"unique",tell:"Six black-yellow-red stripes + white disc with a grey CRANE.",hook:"Uganda = the grey crowned CRANE in a white circle; 6 stripes twice over.",mean:"National bird.",hist:"Six black-yellow-red stripes with the grey crowned crane, the national bird, in a central white disc.",sub:"Eastern Africa"},{n:"Rwanda",c:"rw",r:"Africa",fam:"unique",tell:"Blue-yellow-green + golden SUN in the top-fly corner.",hook:"Rwanda = calm blue on top with a small gold sun in the upper right.",mean:"Peace, prosperity, hope + sun of enlightenment.",hist:"Blue, yellow and green with a golden sun, adopted in 2001 to move past the earlier flag tied to the genocide.",sub:"Eastern Africa"},{n:"Burundi",c:"bi",r:"Africa",fam:"unique",tell:"White SALTIRE (X) dividing red/green + 3 red stars in a white centre disc.",hook:"Burundi = a white X splitting red & green, with 3 stars in the middle.",mean:"3 stars = unity, work, progress.",hist:"A white saltire dividing red and green panels, with three red stars for unity, work and progress.",sub:"Eastern Africa"},{n:"Zambia",c:"zm",r:"Africa",fam:"unique",tell:"Green field with orange EAGLE + red/black/orange bars in the fly corner.",hook:"Zambia = mostly GREEN, with the flair (eagle + 3 stripes) shoved into the bottom-right.",mean:"Eagle of freedom, copper.",hist:"Green with an orange eagle above red-black-orange stripes at the fly \u2014 green for land, the eagle for freedom, copper-orange for mineral wealth.",sub:"Eastern Africa"},{n:"Zimbabwe",c:"zw",r:"Africa",fam:"unique",tell:"7 green/yellow/red/black stripes + white triangle with red star & soapstone BIRD.",hook:"Zimbabwe = the Great Zimbabwe BIRD on a red star, in a white triangle.",mean:"Zimbabwe Bird = national emblem.",hist:"Green-yellow-red-black stripes with a white triangle holding the soapstone 'Zimbabwe Bird' and a red star.",sub:"Eastern Africa"},{n:"Botswana",c:"bw",r:"Africa",fam:"unique",tell:"Light-blue field with a black horizontal stripe edged in white.",hook:"Botswana = sky blue with a single black/white bar. 'Water(blue) + racial harmony(black&white).'",mean:"Rain (pula) + unity.",hist:"Sky blue for the life-giving rain behind its motto 'Pula', crossed by a black-and-white band symbolising racial harmony.",sub:"Southern Africa"},{n:"Namibia",c:"na",r:"Africa",fam:"unique",tell:"Diagonal red band (white-edged) splitting blue & green + gold sun.",hook:"Namibia = a red DIAGONAL with a golden sun in the blue upper triangle.",mean:"Sun of life; blue sky, green land.",hist:"A red diagonal with a gold sun dividing blue and green \u2014 blue for sky and ocean, green for vegetation, red for the people.",sub:"Southern Africa"},{n:"Lesotho",c:"ls",r:"Africa",fam:"unique",tell:"Blue-white-green + black Basotho HAT centred.",hook:"Lesotho = the black conical HAT (mokorotlo) on the white band.",mean:"Basotho hat = national identity.",hist:"Blue, white and green with a black 'mokorotlo' (Basotho straw hat) at the centre, adopted in 2006.",sub:"Southern Africa"},{n:"Eswatini",c:"sz",r:"Africa",fam:"unique",tell:"Blue-red-blue (yellow edges) + black/white SHIELD, spears & staff.",hook:"Eswatini = a big Nguni SHIELD lying sideways across the red band.",mean:"Ox-hide shield & weapons.",hist:"A large ox-hide shield with spears and staff over red, blue and yellow bands \u2014 red for past battles, blue for peace, yellow for resources.",sub:"Southern Africa"},{n:"Nigeria",c:"ng",r:"Africa",fam:"unique",tell:"Green-white-green vertical.",hook:"Nigeria = simple green/white/green. 'Naija: green fields around white peace.'",mean:"Agriculture + peace.",hist:"Green-white-green vertical bands \u2014 green for the land and agriculture, white for peace.",sub:"Western Africa"},{n:"Algeria",c:"dz",r:"Africa",fam:"crescent",tell:"Green & white halves + red crescent & star centred.",hook:"Algeria = green|white split with a red crescent straddling the seam.",mean:"Islam + purity + martyrs.",hist:"Green and white with a red crescent and star \u2014 green and white for Islam and peace, red for the blood of the independence struggle.",sub:"Northern Africa"},{n:"Morocco",c:"ma",r:"Africa",fam:"unique",tell:"Red field with a green 5-point PENTAGRAM outline.",hook:"Morocco = red with a green 'Seal of Solomon' STAR (open outline).",mean:"Pentagram = seal of Solomon.",hist:"A red field with a green interlaced pentagram, the 'Seal of Solomon'.",sub:"Northern Africa"},{n:"Libya",c:"ly",r:"Africa",fam:"panarab",tell:"Red-black-green (black band is double-height) + white crescent & star.",hook:"Libya = fat BLACK middle band with crescent+star; thin red & green edges.",mean:"Kingdom-era flag restored.",hist:"Red, black and green with a white crescent and star; the black recalls the historic Cyrenaica flag, restored in 2011.",sub:"Northern Africa"},{n:"Somalia",c:"so",r:"Africa",fam:"unique",tell:"Light-blue field, single white 5-point star centred.",hook:"Somalia = one white star on UN-blue. 'Somalia = solo star.'",mean:"5 points = Somali regions.",hist:"A single white five-pointed 'Star of Unity' on light blue, for the regions of the Somali people.",sub:"Eastern Africa"},{n:"Djibouti",c:"dj",r:"Africa",fam:"unique",tell:"Light-blue & green with a white hoist triangle + red star.",hook:"vs Somalia: Djibouti adds a white triangle (red star inside) and a green lower half.",mean:"Sky, earth, peace + unity star.",hist:"Light blue and green with a white hoist triangle and red star \u2014 blue for the Issa, green for the Afar, the star for unity.",sub:"Eastern Africa"},{n:"Eritrea",c:"er",r:"Africa",fam:"unique",tell:"Red TRIANGLE (olive wreath) spanning the flag + green & blue triangles.",hook:"Eritrea = a big red triangle pointing to the fly with a gold wreath/olive emblem.",mean:"Wreath = the independence struggle.",hist:"A red triangle bearing a gold wreath-and-olive emblem, set against green and blue triangles for the land and sea.",sub:"Eastern Africa"},{n:"South Sudan",c:"ss",r:"Africa",fam:"unique",tell:"Black-red-green (white lines) + blue hoist triangle with gold star.",hook:"South Sudan = 6-colour flag (like Kenya + blue triangle + gold 'Star of Bethlehem').",mean:"Star of unity.",hist:"Black, red and green stripes edged in white, with a blue hoist triangle and a gold star for unity; adopted in 2011.",sub:"Eastern Africa"},{n:"Central African Republic",c:"cf",r:"Africa",fam:"unique",tell:"4 horizontal bands crossed by a red VERTICAL stripe + gold star.",hook:"CAR = blue/white/green/yellow bands with a red bar down the middle (French + Pan-African fused) and a star top-left.",mean:"Union of French & African colours.",hist:"Four horizontal stripes crossed by a red vertical band, uniting French and Pan-African colours, with a gold star at the hoist.",sub:"Middle Africa"},{n:"Chad",c:"td",r:"Africa",fam:"grancolombia",tell:"Blue-yellow-red vertical, DARK indigo blue.",hook:"vs Romania: Chad's blue is a deep indigo. 'Chad = shade (darker).'",mean:"Blue sky, gold sun, red sacrifice.",hist:"A blue-yellow-red vertical tricolour, essentially identical to Romania's \u2014 blue for sky, yellow for sun, red for sacrifice.",sub:"Middle Africa"},{n:"Gabon",c:"ga",r:"Africa",fam:"unique",tell:"Green-yellow-blue horizontal, no emblem.",hook:"Gabon = green(forest)/yellow(equator sun)/blue(sea), top\u2192down.",mean:"Forest, equator, ocean.",hist:"Three simple bands \u2014 green for the forests, yellow for the equator and sun, blue for the sea.",sub:"Middle Africa"},{n:"Equatorial Guinea",c:"gq",r:"Africa",fam:"unique",tell:"Green-white-red + blue hoist triangle + coat of arms (silk-cotton tree).",hook:"Eq. Guinea = green/white/red with a blue wedge and a TREE crest.",mean:"Silk-cotton tree + 6 stars.",hist:"Green, white and red stripes with a blue hoist triangle and the national arms, which feature a silk-cotton tree.",sub:"Middle Africa"},{n:"Liberia",c:"lr",r:"Africa",fam:"unique",tell:"11 red/white stripes + blue canton with ONE white star.",hook:"vs USA: Liberia = the 'American' flag with just ONE star. Founded by freed US slaves.",mean:"11 signers of its declaration.",hist:"Eleven red-and-white stripes and a single white star on blue, modelled on the US flag by freed American settlers.",sub:"Western Africa"},{n:"Sierra Leone",c:"sl",r:"Africa",fam:"unique",tell:"Green-white-blue horizontal.",hook:"Sierra Leone = green/white/blue. 'Mountains, unity, sea.'",mean:"Agriculture, peace, harbour.",hist:"Green, white and blue bands \u2014 green for agriculture and mountains, white for unity and justice, blue for the harbour.",sub:"Western Africa"},{n:"C\xF4te d'Ivoire",c:"ci",r:"Africa",fam:"tricolor",tell:"Orange-white-green vertical, ORANGE at hoist.",hook:"vs Ireland: Ivory Coast leads with ORANGE at the pole and is shorter/even. 'Ivory = orange first.'",mean:"Savanna, peace, forests.",hist:"Orange-white-green vertical stripes \u2014 the mirror image of Ireland \u2014 with orange at the hoist for the northern savanna.",sub:"Western Africa"},{n:"Gambia",c:"gm",r:"Africa",fam:"unique",tell:"Red-blue-green horizontal with white dividing lines.",hook:"Gambia = red/blue/green with the blue RIVER band pinstriped in white (the Gambia River).",mean:"Sun, river, land.",hist:"Red, blue and green separated by thin white lines \u2014 red for sun and savanna, blue for the Gambia River, green for the land.",sub:"Western Africa"},{n:"Mauritania",c:"mr",r:"Africa",fam:"crescent",tell:"Green field, gold crescent & star, red top & bottom stripes.",hook:"Mauritania = golden crescent 'smiling' upward on green, red bands added top & bottom.",mean:"Crescent + red = sacrifice.",hist:"Green with a gold crescent and star, plus red stripes top and bottom added in 2017 for the blood of independence.",sub:"Western Africa"},{n:"Mauritius",c:"mu",r:"Africa",fam:"unique",tell:"Red-blue-yellow-green four equal bands.",hook:"Mauritius = FOUR stripes: red/blue/yellow/green (rare 4-band flag).",mean:"Freedom, ocean, light, agriculture.",hist:"Four equal bands of red, blue, yellow and green \u2014 for independence, the ocean, the light of freedom, and agriculture.",sub:"Eastern Africa"},{n:"Seychelles",c:"sc",r:"Africa",fam:"unique",tell:"Five rays fanning from the bottom-hoist: blue/yellow/red/white/green.",hook:"Seychelles = a colour FAN bursting from the corner. 'Rays of a new dawn.'",mean:"Dynamic nation moving forward.",hist:"Five colourful bands radiating from the lower hoist, symbolising a young country moving into the future.",sub:"Eastern Africa"},{n:"Comoros",c:"km",r:"Africa",fam:"unique",tell:"4 stripes (yellow/white/red/blue) + green hoist triangle with crescent & 4 stars.",hook:"Comoros = 4 coloured stripes + a green triangle holding a crescent and 4 stars (the islands).",mean:"4 islands = 4 stars/stripes.",hist:"Four stripes for the islands plus a green hoist triangle with a crescent and four stars \u2014 an Islamic unity motif.",sub:"Eastern Africa"},{n:"Madagascar",c:"mg",r:"Africa",fam:"unique",tell:"White VERTICAL hoist band + red-over-green horizontal.",hook:"Madagascar = white column at the pole, then red above green.",mean:"Purity, sovereignty, coast.",hist:"A white vertical band beside red-over-green horizontals, its colours drawn from the island's history and Southeast-Asian heritage.",sub:"Eastern Africa"},{n:"United States",c:"us",r:"Americas",fam:"unique",tell:"13 red/white stripes + blue canton of 50 white stars.",hook:"USA = Stars & Stripes: 13 stripes (colonies), 50 stars (states).",mean:"Original 13 + current 50.",hist:"The Stars and Stripes: thirteen stripes for the original colonies and fifty stars for the current states \u2014 a count that has grown with the nation.",sub:"Northern America"},{n:"Canada",c:"ca",r:"Americas",fam:"unique",tell:"Red-white-red vertical + red MAPLE LEAF centred.",hook:"Canada = the 11-point red MAPLE LEAF on white, red bars either side.",mean:"Maple leaf, national symbol.",hist:"The red-and-white Maple Leaf, adopted in 1965 to replace British-based ensigns with a distinctly Canadian symbol.",sub:"Northern America"},{n:"Mexico",c:"mx",r:"Americas",fam:"tricolor",tell:"Green-white-red vertical + EAGLE eating a snake on a cactus, centred.",hook:"vs Italy: Mexico has the EAGLE-on-cactus emblem in the middle (and is longer).",mean:"Aztec founding legend of Tenochtitlan.",hist:"Green-white-red carrying the Aztec founding legend \u2014 an eagle on a cactus devouring a serpent, marking where Tenochtitlan was built.",sub:"Central America"},{n:"Brazil",c:"br",r:"Americas",fam:"unique",tell:"Green field, yellow diamond, blue globe with stars + banner.",hook:"Brazil = green with a gold DIAMOND and a starry blue globe reading 'Ordem e Progresso.'",mean:"Sky over Rio at independence.",hist:"Green for forests and a gold rhombus for wealth, with a blue globe showing the night sky over Rio at the 1889 republic and the motto 'Ordem e Progresso'.",sub:"South America"},{n:"Argentina",c:"ar",r:"Americas",fam:"unique",tell:"Light-blue/white/light-blue + gold 'Sun of May' face centred.",hook:"Argentina = sky-blue/white with a smiling SUN face in the middle.",mean:"Sun of May (1810 revolution).",hist:"Sky blue and white with the golden 'Sun of May', commemorating the 1810 revolution against Spain.",sub:"South America"},{n:"Uruguay",c:"uy",r:"Americas",fam:"unique",tell:"9 white/blue stripes + white canton with a Sun of May.",hook:"vs Argentina: Uruguay adds STRIPES (9) and puts the sun in the top-left corner.",mean:"9 stripes = original departments.",hist:"Nine blue-and-white stripes for the original departments, with a Sun of May in the canton.",sub:"South America"},{n:"Colombia",c:"co",r:"Americas",fam:"grancolombia",tell:"Yellow (double-height) / blue / red horizontal, no emblem.",hook:"vs Venezuela/Ecuador: Colombia is PLAIN with a fat yellow top. 'Colombia = pure gold on top.'",mean:"Gold, sea, blood (Gran Colombia).",hist:"Yellow (half the flag), blue and red from the Gran Colombia tradition \u2014 yellow for the land's riches, blue for the seas, red for blood.",sub:"South America"},{n:"Ecuador",c:"ec",r:"Americas",fam:"grancolombia",tell:"Yellow/blue/red + condor coat of arms centred.",hook:"vs Colombia: Ecuador adds a CONDOR crest in the middle.",mean:"Andean condor, Mt. Chimborazo.",hist:"The Gran Colombia yellow-blue-red with the national arms \u2014 Mount Chimborazo, a river and a condor \u2014 at the centre.",sub:"South America"},{n:"Venezuela",c:"ve",r:"Americas",fam:"grancolombia",tell:"Yellow/blue/red + arc of 8 white STARS on the blue.",hook:"vs Colombia: Venezuela sprinkles an ARC of stars on the blue band.",mean:"8 stars = provinces of independence.",hist:"Gran Colombia yellow-blue-red with an arc of eight white stars and the national arms in the canton.",sub:"South America"},{n:"Peru",c:"pe",r:"Americas",fam:"unique",tell:"Red-white-red VERTICAL (state version adds crest).",hook:"vs Canada/Austria: Peru is red/white/red VERTICAL. 'Peru points up.'",mean:"Red = Inca/blood, white = peace.",hist:"Red-white-red vertical bands, said to come from the red-and-white flamingos the liberator San Mart\xEDn saw on landing.",sub:"South America"},{n:"Chile",c:"cl",r:"Americas",fam:"unique",tell:"White over red + blue canton with one white STAR.",hook:"vs Texas/others: Chile = white top, red bottom, single star in a blue square (top-hoist).",mean:"'La Estrella Solitaria' \u2014 lone star.",hist:"White and red with a blue canton and a single white star \u2014 the 'Estrella Solitaria', a guide to progress and honour.",sub:"South America"},{n:"Cuba",c:"cu",r:"Americas",fam:"unique",tell:"5 blue/white stripes + red hoist triangle with white star.",hook:"vs Puerto Rico: Cuba = BLUE stripes, RED triangle, white star.",mean:"3 blue stripes = old provinces.",hist:"Three blue stripes for the old provinces and two white for purity, with a red triangle for equality and a white 'Lone Star'.",sub:"Caribbean"},{n:"Panama",c:"pa",r:"Americas",fam:"unique",tell:"Quartered: white with blue star / red / white / blue with red star.",hook:"Panama = four QUARTERS, diagonal stars (blue star top-left, red star bottom-right).",mean:"Two-party unity.",hist:"Quartered white, red and blue with two stars \u2014 the colours nodding to the political parties and to purity, authority and law.",sub:"Central America"},{n:"Bolivia",c:"bo",r:"Americas",fam:"panafrican",tell:"Red-yellow-green + coat of arms centred (state flag).",hook:"vs Ghana/Ethiopia: Bolivia = red/yellow/green horizontal with a crest. (Also flies the multicolour Wiphala.)",mean:"Andean condor arms.",hist:"Red-yellow-green horizontal bands with the national arms \u2014 red for valour, yellow for mineral wealth, green for fertility.",sub:"South America"},{n:"Paraguay",c:"py",r:"Americas",fam:"unique",tell:"Red-white-blue horizontal \u2014 DIFFERENT emblem on each side.",hook:"Paraguay = the only flag with different FRONT & BACK emblems (star one side, lion the other).",mean:"National seal / treasury seal.",hist:"Red-white-blue horizontal; uniquely, it shows different emblems on each side \u2014 the national arms on the front, the treasury seal on the back.",sub:"South America"},{n:"Guyana",c:"gy",r:"Americas",fam:"unique",tell:"Green field + gold ARROWHEAD (red inner triangle), black & white edges.",hook:"Guyana = 'The Golden Arrowhead' pointing to the fly, red spearhead inside.",mean:"Green forests, gold future, red zeal.",hist:"The 'Golden Arrowhead': a green field with a white-edged gold arrow and a black-edged red hoist triangle \u2014 for forests, minerals and people.",sub:"South America"},{n:"Suriname",c:"sr",r:"Americas",fam:"unique",tell:"Green-white-red-white-green + gold STAR centred.",hook:"Suriname = green/red bands (fat red middle) with a big yellow star.",mean:"Unity star.",hist:"Green, white and red bands with a large gold star for unity and a golden future.",sub:"South America"},{n:"Haiti",c:"ht",r:"Americas",fam:"unique",tell:"Blue over red + white square with coat of arms (palm & flags).",hook:"vs Liechtenstein: Haiti = blue/red with a white CREST box (palm tree + cannons) in the centre.",mean:"Palm of liberty.",hist:"Blue over red with the national arms \u2014 a palm tree, cannons and the motto 'L'Union Fait La Force' \u2014 from the 1803 revolution.",sub:"Caribbean"},{n:"Dominican Republic",c:"do",r:"Americas",fam:"unique",tell:"White CROSS dividing blue/red quarters + central coat of arms.",hook:"Dom. Rep. = the only flag with a Bible in the crest; a white cross splits blue & red.",mean:"Cross + open Bible.",hist:"A white cross dividing blue and red quarters, with the national arms and an open Bible at the centre \u2014 the only flag to depict a Bible.",sub:"Caribbean"},{n:"Jamaica",c:"jm",r:"Americas",fam:"unique",tell:"Gold SALTIRE (X) dividing green (top/bottom) & black (sides).",hook:"Jamaica = gold X making triangles: green top&bottom, black left&right. Only flag with no red/white/blue.",mean:"Gold sun, green land, black strength.",hist:"A gold diagonal cross splitting green and black triangles \u2014 gold for sunshine, green for the land, black for strength; one of the few flags with no red, white or blue.",sub:"Caribbean"},{n:"Trinidad and Tobago",c:"tt",r:"Americas",fam:"unique",tell:"Red field with a black DIAGONAL stripe edged in white.",hook:"Trinidad = red with a bold black-and-white slash from top-hoist to bottom-fly.",mean:"Fire, water/earth, unity.",hist:"A white-edged black diagonal on red \u2014 red for warmth and people, black for strength and unity, white for the surrounding sea.",sub:"Caribbean"},{n:"Bahamas",c:"bs",r:"Americas",fam:"unique",tell:"Aquamarine-gold-aquamarine + black hoist TRIANGLE.",hook:"Bahamas = turquoise/gold sea-and-sand bands with a black triangle at the pole.",mean:"Sea, sand, vigour of the people.",hist:"Aquamarine and gold stripes for the sea and sand, with a black hoist triangle for the strength and enterprise of the people.",sub:"Caribbean"},{n:"Barbados",c:"bb",r:"Americas",fam:"unique",tell:"Blue-gold-blue + black TRIDENT head centred.",hook:"Barbados = Neptune's broken TRIDENT on the gold middle band.",mean:"Broken trident = break from colonial past.",hist:"Blue-gold-blue with a black broken trident head \u2014 the trident of the sea god, broken to mark the break from colonial rule.",sub:"Caribbean"},{n:"Belize",c:"bz",r:"Americas",fam:"unique",tell:"Blue field, thin red top & bottom + detailed coat of arms (two woodcutters).",hook:"Belize = the most DETAILED flag (most colours); two men + a mahogany tree in a white disc.",mean:"'Sub Umbra Floreo' \u2014 logging heritage.",hist:"Royal blue with red edges and a detailed coat of arms \u2014 the only national flag to depict people, two woodcutters at work.",sub:"Central America"},{n:"Grenada",c:"gd",r:"Americas",fam:"unique",tell:"Red border with 6 stars + green/yellow triangles + a NUTMEG.",hook:"Grenada = red frame, 6 stars, and a little NUTMEG pod (the 'Spice Isle').",mean:"Nutmeg, 6 parishes + 1 island star.",hist:"A red border with six stars for the parishes, a seventh central star, and a nutmeg pod for the 'Isle of Spice'.",sub:"Caribbean"},{n:"Saint Lucia",c:"lc",r:"Americas",fam:"unique",tell:"Blue field + black-and-white ARROW/triangle over a gold triangle.",hook:"St. Lucia = twin volcanic PITONS: a black triangle over gold over blue.",mean:"The Pitons rising from the sea.",hist:"Blue with a black-and-white arrowhead over a gold triangle, representing the twin Pitons rising from the sea.",sub:"Caribbean"},{n:"Dominica",c:"dm",r:"Americas",fam:"unique",tell:"Green field, tricolour cross, red centre disc with a purple SISSEROU PARROT.",hook:"Dominica = the only flag with PURPLE \u2014 a Sisserou parrot ringed by 10 stars.",mean:"National parrot; 10 parishes.",hist:"Green with a cross of yellow, black and white stripes and a central Sisserou parrot ringed by ten stars \u2014 one of only two flags to use purple.",sub:"Caribbean"},{n:"Antigua and Barbuda",c:"ag",r:"Americas",fam:"unique",tell:"Red field + black/blue/white bands with a rising gold SUN.",hook:"Antigua = a golden half-SUN on black, inside a red V. 'Dawn of a new era.'",mean:"Sunrise of independence.",hist:"A rising golden sun on black over red, blue and white \u2014 the sun for a new era, the colours for soil, sea and hope.",sub:"Caribbean"},{n:"Saint Kitts and Nevis",c:"kn",r:"Americas",fam:"unique",tell:"Green & red split by a black DIAGONAL band with 2 white stars.",hook:"vs Trinidad: St. Kitts = a black diagonal with TWO stars, green & red fields (yellow edges).",mean:"2 stars = the two islands.",hist:"A black diagonal band with two white stars, edged in green and red \u2014 the stars for hope and liberty of the two islands.",sub:"Caribbean"},{n:"Saint Vincent and the Grenadines",c:"vc",r:"Americas",fam:"unique",tell:"Blue-yellow-green vertical + three green DIAMONDS (V-shape) on gold.",hook:"St. Vincent = three green gems forming a 'V' on the yellow band. 'The Gems.'",mean:"V for Vincent; Caribbean gems.",hist:"Blue, gold and green with three green diamonds set in a 'V' \u2014 the 'Gems of the Antilles', arranged for Vincent.",sub:"Caribbean"},{n:"Australia",c:"au",r:"Oceania",fam:"unique",tell:"Union Jack canton + big 7-point Commonwealth star + Southern Cross (5 stars, one small).",hook:"vs New Zealand: Australia has MORE stars, all WHITE, plus a large star under the Jack.",mean:"Commonwealth star + Southern Cross.",hist:"The Union Jack, the large seven-pointed Commonwealth Star, and the Southern Cross constellation on a blue field.",sub:"Australasia"},{n:"New Zealand",c:"nz",r:"Oceania",fam:"unique",tell:"Union Jack canton + FOUR red, white-edged stars (Southern Cross).",hook:"vs Australia: NZ = just 4 RED stars, no big star. 'NZ = fewer, red.'",mean:"Southern Cross constellation.",hist:"The Union Jack with four red, white-bordered stars of the Southern Cross \u2014 set apart from Australia's by the stars' colour and count.",sub:"Australasia"},{n:"Fiji",c:"fj",r:"Oceania",fam:"unique",tell:"Light-blue field + Union Jack + shield (lion, sugarcane, dove).",hook:"Fiji = pale sky-BLUE ensign with a shield of a lion & sugarcane.",mean:"Pacific sky + colonial shield.",hist:"A light blue ensign with the Union Jack and a shield of sugarcane, a dove and a lion \u2014 light blue for the Pacific Ocean.",sub:"Melanesia"},{n:"Tuvalu",c:"tv",r:"Oceania",fam:"unique",tell:"Light-blue + Union Jack + 9 yellow STARS mapping the islands.",hook:"Tuvalu = sky-blue with 9 gold stars laid out like the islands' geography.",mean:"9 islands mapped.",hist:"A light blue ensign with the Union Jack and nine yellow stars laid out to map the positions of the islands.",sub:"Polynesia"},{n:"Papua New Guinea",c:"pg",r:"Oceania",fam:"unique",tell:"Diagonal split: red (with gold bird-of-paradise) & black (with Southern Cross).",hook:"PNG = diagonal red/black; a gold BIRD-OF-PARADISE up top, Southern Cross below.",mean:"National bird + constellation.",hist:"Divided diagonally: a gold bird-of-paradise on red, and the white stars of the Southern Cross on black.",sub:"Melanesia"},{n:"Samoa",c:"ws",r:"Oceania",fam:"unique",tell:"Red field + blue canton with the Southern Cross (5 white stars).",hook:"Samoa = red flag, blue box with the Southern Cross. 'Red Samoa, corner cross.'",mean:"Southern Cross.",hist:"Red with a blue canton bearing the five white stars of the Southern Cross.",sub:"Polynesia"},{n:"Tonga",c:"to",r:"Oceania",fam:"unique",tell:"Red field + white canton with a red CROSS.",hook:"Tonga = red with a little red CROSS on a white box. (Looks like a Red-Cross-in-a-corner.)",mean:"Christianity; couldn't use the Red Cross emblem itself.",hist:"Red with a white canton holding a red cross for the nation's Christian faith; the red stands for the blood of Christ.",sub:"Polynesia"},{n:"Solomon Islands",c:"sb",r:"Oceania",fam:"unique",tell:"Diagonal thin yellow line splitting blue (5 stars) & green.",hook:"Solomon Is. = a thin gold DIAGONAL; blue triangle holds 5 white stars.",mean:"5 stars = original provinces.",hist:"A yellow diagonal stripe dividing blue and green, with five white stars for the island groups \u2014 blue for water, green for land.",sub:"Melanesia"},{n:"Vanuatu",c:"vu",r:"Oceania",fam:"unique",tell:"Black Y (pall) + red & green fields + yellow boar's-TUSK & fern emblem.",hook:"Vanuatu = black 'Y' on its side with a curled boar TUSK crest.",mean:"Tusk = prosperity; Y = island chain.",hist:"A black 'Y' echoing the islands' shape, with a boar's-tusk and fern emblem \u2014 red for blood, green for the land, black for the people.",sub:"Melanesia"},{n:"Kiribati",c:"ki",r:"Oceania",fam:"unique",tell:"Red top with a gold FRIGATEBIRD & sun; blue-white wavy sea below.",hook:"Kiribati = a golden bird flying over a rising sun, above blue ocean WAVES.",mean:"Frigatebird over the Pacific.",hist:"A gold frigatebird flying over a rising sun, above three white wavy bands for the ocean and the island groups.",sub:"Micronesia"},{n:"Marshall Islands",c:"mh",r:"Oceania",fam:"unique",tell:"Blue field + orange/white diagonal RAYS + white star (many points).",hook:"Marshall Is. = two widening diagonal rays (orange/white) with a big 24-ray star in the corner.",mean:"Rays = equator/islands; star points = municipalities.",hist:"Blue with two rising diagonal stripes (orange and white) and a large 24-point star, for the equator, the island chains and the atolls.",sub:"Micronesia"},{n:"Micronesia",c:"fm",r:"Oceania",fam:"unique",tell:"Light-blue field, 4 white stars in a diamond.",hook:"Micronesia = UN-blue with just FOUR stars in a diamond (the 4 states).",mean:"4 island states.",hist:"Light blue with four white stars for the states of the federation \u2014 blue for the Pacific.",sub:"Micronesia"},{n:"Nauru",c:"nr",r:"Oceania",fam:"unique",tell:"Blue field, thin gold horizontal line, single white 12-point STAR below-hoist.",hook:"Nauru = a gold line = the EQUATOR, and a star showing the island's position just below it.",mean:"The island sits just south of the equator.",hist:"A blue field with a thin gold line for the equator and a single white star marking the island's position just below it.",sub:"Micronesia"},{n:"DR Congo",c:"cd",r:"Africa",fam:"unique",tell:"Sky-blue field, red DIAGONAL stripe (yellow-edged) + gold star top-hoist.",hook:"DR Congo = sky-blue with a red diagonal sash and a gold star in the corner. (vs Congo-Brazzaville's green/yellow/red diagonal.)",mean:"Star of a united future.",hist:"Sky blue with a large yellow star and a yellow-edged red diagonal \u2014 red for the martyrs of independence, blue for peace.",sub:"Middle Africa"},{n:"Guatemala",c:"gt",r:"Americas",fam:"centralamerica",tell:"Blue-white-blue VERTICAL + crest with a quetzal bird & scroll.",hook:"vs the others: Guatemala is the only Central-American one that's VERTICAL, and its emblem has the resplendent QUETZAL + crossed rifles.",mean:"Quetzal = liberty; rifles & swords = defence.",hist:"Sky-blue and white vertical bands with the national arms \u2014 a resplendent quetzal, a scroll and crossed rifles \u2014 for liberty.",sub:"Central America"},{n:"El Salvador",c:"sv",r:"Americas",fam:"centralamerica",tell:"Blue-white-blue + coat of arms with a triangle & 5 volcanoes.",hook:"vs Nicaragua: El Salvador's crest is denser \u2014 a triangle over 5 VOLCANOES, wreathed. Text reads 'Republica de El Salvador'.",mean:"Triangle = equality; volcanoes = the isthmus.",hist:"Blue-white-blue, the historic Central American colours, with the national coat of arms at the centre.",sub:"Central America"},{n:"Nicaragua",c:"ni",r:"Americas",fam:"centralamerica",tell:"Blue-white-blue + triangle with 5 volcanoes and a RAINBOW.",hook:"vs El Salvador: Nicaragua's emblem has a bright RAINBOW and a Phrygian cap on a pole; text reads 'Republica de Nicaragua'.",mean:"Rainbow of peace; 5 volcanoes = 5 members.",hist:"Blue-white-blue with a central triangle, rainbow and volcanoes, closely modelled on the old United Provinces of Central America.",sub:"Central America"},{n:"Honduras",c:"hn",r:"Americas",fam:"centralamerica",tell:"Blue-white-blue + FIVE blue stars in an X pattern on the white.",hook:"Honduras = the easy one: FIVE STARS (no fussy crest) arranged in an X on the white band.",mean:"5 stars = the 5 union states, Honduras central.",hist:"Blue-white-blue with five blue stars in the centre for the five nations of the former Central American federation.",sub:"Central America"},{n:"Costa Rica",c:"cr",r:"Americas",fam:"centralamerica",tell:"Blue-white-RED-white-blue; fat red centre band.",hook:"Costa Rica = the odd one out: it adds a bold RED stripe down the middle (inspired by France). Civil version has
