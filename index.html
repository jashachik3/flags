h="100%" height="100%" transform="translate(-133.3 37.3)"/></svg>',cr:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><g fill-rule="evenodd" stroke-width="1pt"><path fill="#0000b4" d="M0 0h640v480H0z"/><path fill="#fff" d="M0 75.4h640v322.3H0z"/><path fill="#d90000" d="M0 157.7h640v157.7H0z"/></g></svg>'},$2=[{n:"Denmark",c:"dk",r:"Europe",fam:"nordic",tell:"White cross on plain red \u2014 the oldest national flag, the Dannebrog.",hook:"DENmark = the DEN/original. Simplest Nordic: red field, white cross, nothing else. All other Nordic crosses are variations on this.",mean:"Legend: fell from the sky in 1219. The template for every Nordic cross."},{n:"Sweden",c:"se",r:"Europe",fam:"nordic",tell:"Yellow cross on blue.",hook:"Sweden = IKEA colours: blue + yellow. Blue field, gold cross.",mean:"Blue and gold from the national coat of arms."},{n:"Norway",c:"no",r:"Europe",fam:"nordic",tell:"Red field, white-outlined blue cross.",hook:"Norway = Red, White & Blue crammed into a Nordic cross (it was under Denmark=red then Sweden=blue). Iceland is the exact colour-swap.",mean:"Combines Danish red + French-revolution liberty blue."},{n:"Iceland",c:"is",r:"Europe",fam:"nordic",tell:"Blue field, white-outlined red cross.",hook:"Iceland = Norway's negative. Swap Norway's blue and red: blue field / red cross. (Fire=red on glacial=blue-white.)",mean:"Blue mountains, white ice, red volcanic fire."},{n:"Finland",c:"fi",r:"Europe",fam:"nordic",tell:"Blue cross on white \u2014 the palest Nordic flag.",hook:"Finland = a thousand blue LAKES on white SNOW. The only Nordic cross that is blue-on-white.",mean:"Blue lakes/sky, white snow."},{n:"France",c:"fr",r:"Europe",fam:"tricolor",tell:"Blue-white-red vertical, blue at hoist.",hook:"The original tricolour. Blue-White-Red left to right = 'BWR' \u2192 alphabetical-ish. The ancestor of most tricolours.",mean:"Libert\xE9, \xE9galit\xE9, fraternit\xE9 (1789)."},{n:"Netherlands",c:"nl",r:"Europe",fam:"panslavic",tell:"Red-white-blue horizontal; a deep/bright red on top.",hook:"vs Luxembourg: Netherlands red is darker and the flag is squarer. 'Dutch is Deeper red.'",mean:"Oldest tricolour; inspired Russia and many others."},{n:"Luxembourg",c:"lu",r:"Europe",fam:"panslavic",tell:"Red-white-blue horizontal; lighter sky-blue, longer/skinnier.",hook:"vs Netherlands: Luxembourg is Lighter blue and Longer. Two L's.",mean:"Colours from the Grand Duke's arms."},{n:"Russia",c:"ru",r:"Europe",fam:"panslavic",tell:"White-blue-red horizontal, top to bottom.",hook:"The Pan-Slavic parent. WBR top\u2192down. 'White snow, Blue sky, Red blood.' Slovakia/Slovenia add an emblem to this exact stack.",mean:"Source of Pan-Slavic colours (1690s)."},{n:"Slovakia",c:"sk",r:"Europe",fam:"panslavic",tell:"White-blue-red + shield with a white double-cross on three blue hills.",hook:"vs Slovenia: SlovaKia's shield is at CENTRE-ish and has a Cross on hills. 'K = Kross.'",mean:"Double-cross = Christian heritage."},{n:"Slovenia",c:"si",r:"Europe",fam:"panslavic",tell:"White-blue-red + shield near the HOIST with Mt. Triglav + stars.",hook:"vs Slovakia: SloveNia's shield hugs the hoist (top-left) and shows a mountaiN. 'N = mountaiN, Near the pole.'",mean:"Triglav is Slovenia's highest peak."},{n:"Serbia",c:"rs",r:"Europe",fam:"panslavic",tell:"Red-blue-white (inverted order) + eagle & crown shield toward hoist.",hook:"Serbia flips the Slavic order to Red-Blue-White and adds a double eagle. 'Serbia = Same colours, Swapped order.'",mean:"Double-headed eagle, royal arms."},{n:"Croatia",c:"hr",r:"Europe",fam:"panslavic",tell:"Red-white-blue + red-and-white CHECKERBOARD shield.",hook:"Croatia = the CHECKERED shield (\u0161ahovnica). Only Slavic tricolour with a chessboard.",mean:"Checkerboard is centuries-old Croatian symbol."},{n:"Czechia",c:"cz",r:"Europe",fam:"panslavic",tell:"White over red with a blue triangle from the hoist.",hook:"Czech = a blue WEDGE eating into white/red. Poland+blue triangle.",mean:"Blue added to distinguish from Poland."},{n:"Poland",c:"pl",r:"Europe",fam:"unique",tell:"White on top, red on bottom. Nothing else.",hook:"vs Indonesia/Monaco (red-over-white): Poland is White-over-red \u2014 the INVERSE. 'Poland = Pale on top.'",mean:"White eagle on red field, simplified."},{n:"Austria",c:"at",r:"Europe",fam:"unique",tell:"Red-white-red horizontal bands.",hook:"Red-White-Red. Legend: a duke's white tunic stayed white only under his belt after battle. Same stripes as Latvia but Austria's red is brighter and bands are equal.",mean:"One of the oldest flags."},{n:"Latvia",c:"lv",r:"Europe",fam:"unique",tell:"Dark carmine-red / white / dark-red, with a thin white stripe.",hook:"vs Austria: Latvia's red is a MAROON/dried-blood shade and the white stripe is THINNER. 'Latvia = darker, leaner.'",mean:"Legend of a bloodstained sheet."},{n:"Germany",c:"de",r:"Europe",fam:"tricolor",tell:"Black-red-gold horizontal.",hook:"Black-Red-Gold, top\u2192down. vs Belgium (same colours but VERTICAL).",mean:"1848 liberal revolution colours."},{n:"Belgium",c:"be",r:"Europe",fam:"tricolor",tell:"Black-yellow-red VERTICAL.",hook:"vs Germany: Belgium is the same trio but standing UP (vertical), and yellow is in the middle.",mean:"From the Duchy of Brabant."},{n:"Italy",c:"it",r:"Europe",fam:"tricolor",tell:"Green-white-red vertical.",hook:"vs Ireland/Mexico: Italy is short/even and has NO emblem. 'Italy = pizza margherita: green basil, white mozzarella, red tomato.'",mean:"Napoleonic-era tricolour."},{n:"Ireland",c:"ie",r:"Europe",fam:"tricolor",tell:"Green-white-ORANGE vertical, green at hoist.",hook:"vs C\xF4te d'Ivoire: Ireland's GREEN is at the pole (Irish are 'green with envy'), orange trails. Also longer than Italy and ends in orange not red.",mean:"Green Catholics, orange Protestants, white peace."},{n:"Hungary",c:"hu",r:"Europe",fam:"tricolor",tell:"Red-white-green horizontal.",hook:"vs Italy (vertical) & Bulgaria (has green not red on bottom): Hungary is horizontal Red-White-Green.",mean:"Strength, faithfulness, hope."},{n:"Bulgaria",c:"bg",r:"Europe",fam:"tricolor",tell:"White-green-red horizontal.",hook:"vs Hungary: Bulgaria puts GREEN in the middle and white on top. 'Bulgaria's Belly is green.'",mean:"White peace, green land, red valour."},{n:"Spain",c:"es",r:"Europe",fam:"unique",tell:"Red-yellow-red with a wide gold band + coat of arms toward hoist.",hook:"'Blood and sand' \u2014 thin red / thick gold / thin red, crest on the left. The wide gold stripe is the tell.",mean:"Pillars of Hercules on the arms."},{n:"Portugal",c:"pt",r:"Europe",fam:"unique",tell:"Green (hoist) + red, with armillary sphere & shield on the seam.",hook:"Portugal = the golden SPHERE (navigator's armillary) on the green/red seam. Green is the smaller hoist side.",mean:"Sphere = Age of Discovery."},{n:"Greece",c:"gr",r:"Europe",fam:"unique",tell:"Nine blue-white stripes + white cross on blue canton.",hook:"Greece = SEA STRIPES (9, for the syllables of 'Freedom or Death') with a cross in the corner.",mean:"Blue sea/sky, white waves, Orthodox cross."},{n:"Switzerland",c:"ch",r:"Europe",fam:"unique",tell:"SQUARE. White cross on red.",hook:"One of only two square flags (with Vatican). Red Cross is its colour-inverse.",mean:"Neutrality; medieval Swiss cross."},{n:"United Kingdom",c:"gb",r:"Europe",fam:"unique",tell:"The Union Jack \u2014 overlaid red+white crosses on blue.",hook:"Three crosses stacked: England (red +), Scotland (white X), Ireland (red X). The 'canton parent' of Australia, NZ, Fiji, Tuvalu.",mean:"Union of the kingdoms."},{n:"Albania",c:"al",r:"Europe",fam:"unique",tell:"Black double-headed EAGLE on deep red.",hook:"Albania = one angry black double eagle on blood-red. 'Land of the Eagles.'",mean:"Skanderbeg's eagle."},{n:"Montenegro",c:"me",r:"Europe",fam:"unique",tell:"Gold-bordered red field with a gold double-headed eagle + lion.",hook:"vs Albania: Montenegro's eagle is GOLD on red with a gold border (looks 'framed/royal').",mean:"Royal standard revived."},{n:"Malta",c:"mt",r:"Europe",fam:"unique",tell:"White + red halves with the George Cross (grey) at top hoist.",hook:"Malta = split White|Red with a little grey medal in the top-left corner.",mean:"George Cross awarded for WWII bravery."},{n:"Andorra",c:"ad",r:"Europe",fam:"grancolombia",tell:"Blue-yellow-red vertical + coat of arms in the centre.",hook:"vs Romania/Chad/Moldova: Andorra has an EMBLEM in the middle (cows & mitre). 'Andorra = Arms in the middle, thin.'",mean:"Franco-Spanish co-principality."},{n:"Moldova",c:"md",r:"Europe",fam:"grancolombia",tell:"Blue-yellow-red vertical + eagle-with-shield emblem centred.",hook:"vs Andorra: Moldova's emblem is an EAGLE holding a shield (aurochs head). Same tricolour, different crest.",mean:"Related to Romania; eagle & aurochs."},{n:"Romania",c:"ro",r:"Europe",fam:"grancolombia",tell:"Blue-yellow-red vertical, NO emblem, brighter cobalt blue.",hook:"vs Chad: Romania's blue is a brighter cobalt. Twins otherwise. 'Romania = Radiant blue.'",mean:"Plain civil version of the arms flag."},{n:"Ukraine",c:"ua",r:"Europe",fam:"unique",tell:"Blue over yellow, two equal bands.",hook:"Ukraine = blue SKY over yellow WHEAT fields. Just two stripes.",mean:"Sky and grain."},{n:"Belarus",c:"by",r:"Europe",fam:"unique",tell:"Red over green with a red-on-white embroidery pattern at the hoist.",hook:"Belarus = red/green with a woven RUG pattern running up the left edge.",mean:"Ornament from folk textiles."},{n:"Estonia",c:"ee",r:"Europe",fam:"unique",tell:"Blue-black-white horizontal.",hook:"Estonia = the only Baltic with BLACK in the middle. 'Blue skies, black past, white hope.' Blue on top.",mean:"National awakening colours."},{n:"Lithuania",c:"lt",r:"Europe",fam:"panafrican",tell:"Yellow-green-red horizontal.",hook:"vs Africa's yellow/green/red: Lithuania is the European one. 'Lit up: yellow sun on top.'",mean:"Sun, forests, blood."},{n:"Bosnia and Herzegovina",c:"ba",r:"Europe",fam:"unique",tell:"Blue field, yellow triangle, row of white stars along the diagonal.",hook:"Bosnia = a yellow TRIANGLE (the country's shape) with stars marching up its edge.",mean:"Triangle = 3 peoples; EU-style stars."},{n:"North Macedonia",c:"mk",r:"Europe",fam:"unique",tell:"Golden sun with rays radiating to the edges on red.",hook:"N. Macedonia = a blazing SUN with 8 thick rays reaching the corners, on red.",mean:"'New sun of liberty.'"},{n:"Kosovo",c:"xk",r:"Europe",fam:"unique",tell:"Blue field, gold map of Kosovo, 6 white stars in an arc.",hook:"Kosovo = the country's own MAP in gold under 6 stars. (Bosnia/EU cousin.)",mean:"6 stars = 6 ethnic groups."},{n:"Cyprus",c:"cy",r:"Europe",fam:"unique",tell:"White field, copper-coloured island map + two green olive branches.",hook:"Cyprus = its own copper ISLAND shape (Cyprus = copper) over crossed olive branches.",mean:"Neutral map + peace branches."},{n:"Liechtenstein",c:"li",r:"Europe",fam:"unique",tell:"Blue over red with a gold CROWN in the top hoist.",hook:"Liechtenstein = blue/red with a little gold crown (added after being mistaken for Haiti at the Olympics!).",mean:"Crown = the princely house."},{n:"Monaco",c:"mc",r:"Europe",fam:"unique",tell:"Red over white, nearly square.",hook:"vs Indonesia: identical colours, but Monaco is more SQUARE (and tiny country). vs Poland: inverse.",mean:"Grimaldi heraldic colours."},{n:"San Marino",c:"sm",r:"Europe",fam:"unique",tell:"White over light-blue + coat of arms with three towers.",hook:"San Marino = white/sky-blue with THREE TOWERS on a mountain crest.",mean:"Three towers of Monte Titano."},{n:"Vatican City",c:"va",r:"Europe",fam:"unique",tell:"SQUARE. Yellow + white with crossed keys & tiara.",hook:"Vatican = the other square flag: gold|white with St. Peter's KEYS.",mean:"Keys of the papacy."},{n:"Japan",c:"jp",r:"Asia",fam:"unique",tell:"Single red disc centred on white.",hook:"Land of the Rising Sun \u2192 one red SUN on white. The cleanest sun flag.",mean:"Hinomaru, 'circle of the sun.'"},{n:"Bangladesh",c:"bd",r:"Asia",fam:"unique",tell:"Red disc slightly off-centre on green.",hook:"vs Japan: Bangladesh = green field (lush delta), disc nudged toward the hoist so it looks centred when flying.",mean:"Green land, red sun of independence."},{n:"Palau",c:"pw",r:"Oceania",fam:"unique",tell:"Yellow disc off-centre on sky-blue.",hook:"vs Japan: Palau = golden MOON on Pacific blue, disc left of centre.",mean:"Full moon over the ocean."},{n:"South Korea",c:"kr",r:"Asia",fam:"unique",tell:"Red-blue yin-yang + 4 black trigrams in the corners.",hook:"Korea = the TAEGEUK swirl with 4 bar-symbols in the corners. 'Balance + 4 corners.'",mean:"Um-yang harmony; I Ching trigrams."},{n:"China",c:"cn",r:"Asia",fam:"unique",tell:"Red field, one big gold star + 4 small stars arcing around it.",hook:"China = one BIG star (Party) leading 4 little stars, top-left. Red field.",mean:"Communist Party + the people."},{n:"Vietnam",c:"vn",r:"Asia",fam:"unique",tell:"Single large yellow star centred on red.",hook:"vs China: Vietnam = ONE big yellow star, dead CENTRE.",mean:"Star of revolution."},{n:"Taiwan",c:"tw",r:"Asia",fam:"unique",tell:"Red field, blue canton with a white 12-ray sun.",hook:"Taiwan = 'blue sky, white sun, red earth' \u2014 a white 12-point sun in a blue box.",mean:"12 rays = 12 hours/months of progress."},{n:"North Korea",c:"kp",r:"Asia",fam:"unique",tell:"Blue-red-blue bands + white disc with a red star toward hoist.",hook:"N. Korea = red central band with a red STAR in a white circle. Blue borders.",mean:"Star of communism."},{n:"Mongolia",c:"mn",r:"Asia",fam:"unique",tell:"Red-blue-red vertical + gold soyombo symbol at hoist.",hook:"Mongolia = the gold SOYOMBO column (fire, sun, moon) on the left, blue sky stripe in the middle.",mean:"Soyombo = national emblem."},{n:"India",c:"in",r:"Asia",fam:"unique",tell:"Saffron-white-green + navy 24-spoke wheel in the centre.",hook:"India = the blue CHAKRA wheel centred on the white band.",mean:"Ashoka wheel of dharma."},{n:"Niger",c:"ne",r:"Africa",fam:"unique",tell:"Orange-white-green with a small orange disc centred.",hook:"vs India: Niger has a plain orange CIRCLE (sun) instead of a wheel, and is nearly square.",mean:"Sun over the Sahara + Niger River."},{n:"Pakistan",c:"pk",r:"Asia",fam:"crescent",tell:"White hoist stripe + green field with white crescent & star.",hook:"Pakistan = green with a white VERTICAL stripe at the pole, plus crescent+star.",mean:"White stripe = minorities."},{n:"Turkey",c:"tr",r:"Asia",fam:"crescent",tell:"Red field, white crescent + star.",hook:"Turkey = the classic red crescent flag; star sits INSIDE the crescent's opening.",mean:"Ottoman heritage."},{n:"Tunisia",c:"tn",r:"Africa",fam:"crescent",tell:"Red field, white CIRCLE containing red crescent & star.",hook:"vs Turkey: Tunisia puts its crescent+star inside a white DISC.",mean:"White sun-disc, Ottoman roots."},{n:"Malaysia",c:"my",r:"Asia",fam:"crescent",tell:"14 red/white stripes + blue canton with yellow crescent & 14-point star.",hook:"vs USA: Malaysia = 'Stars & Stripes' cousin but with a CRESCENT + one big star. 14 stripes = 14 states.",mean:"Federation of 14."},{n:"Singapore",c:"sg",r:"Asia",fam:"crescent",tell:"Red over white + white crescent & 5 stars in the top hoist.",hook:"Singapore = red/white split, crescent hugging FIVE stars in a ring, top-left.",mean:"5 stars = democracy, peace, progress, justice, equality."},{n:"Indonesia",c:"id",r:"Asia",fam:"unique",tell:"Red over white, 3:2 ratio.",hook:"vs Monaco (squarer) & Poland (inverse): Indonesia = big red-over-white banner. 'Indonesia is Immense/wide.'",mean:"Courage over purity."},{n:"Thailand",c:"th",r:"Asia",fam:"unique",tell:"Red-white-BLUE-white-red horizontal (blue centre is double-height).",hook:"Thailand = 5 stripes, fat BLUE middle. 'Nation(red)-Religion(white)-King(blue).'",mean:"Blue = monarchy, wider centre."},{n:"Laos",c:"la",r:"Asia",fam:"unique",tell:"Red-blue-red + big white disc centred.",hook:"vs Thailand: Laos = red/blue/red with a plain white MOON on the blue.",mean:"Moon over the Mekong."},{n:"Cambodia",c:"kh",r:"Asia",fam:"unique",tell:"Blue-red-blue + white ANGKOR WAT temple centred.",hook:"Cambodia = the only flag with a BUILDING: white Angkor Wat on red.",mean:"Angkor Wat temple."},{n:"Nepal",c:"np",r:"Asia",fam:"unique",tell:"The only NON-rectangular flag \u2014 two stacked triangular pennants with moon & sun.",hook:"Nepal = double PENNANT (crimson, blue border), sun below, moon above. Unmistakable shape.",mean:"Himalayan peaks; sun & moon = permanence."},{n:"Bhutan",c:"bt",r:"Asia",fam:"unique",tell:"Diagonal split yellow/orange with a white DRAGON.",hook:"Bhutan = 'Land of the Thunder Dragon' \u2014 a white dragon lies along the diagonal.",mean:"Druk, the thunder dragon."},{n:"Sri Lanka",c:"lk",r:"Asia",fam:"unique",tell:"Golden LION holding a sword on maroon, plus green+orange stripes at hoist.",hook:"Sri Lanka = a sword-wielding LION and 4 corner leaves; green/orange bars for minorities.",mean:"Sinhalese lion + Tamil/Muslim stripes."},{n:"Philippines",c:"ph",r:"Asia",fam:"unique",tell:"Blue over red + white hoist triangle with sun & 3 stars.",hook:"Philippines = white TRIANGLE at the pole, golden sun + 3 stars. (Flips to red-on-top in wartime.)",mean:"Sun = liberty, 3 stars = island groups."},{n:"Myanmar",c:"mm",r:"Asia",fam:"unique",tell:"Yellow-green-red horizontal + big white star centred.",hook:"Myanmar = Pan-Africa-looking bands (yellow/green/red) but with one big white STAR.",mean:"Solidarity star."},{n:"Israel",c:"il",r:"Asia",fam:"unique",tell:"Blue Star of David between two blue stripes on white.",hook:"Israel = blue STAR OF DAVID; stripes echo a prayer shawl (tallit).",mean:"Menorah nation; tallit design."},{n:"Lebanon",c:"lb",r:"Asia",fam:"unique",tell:"Red-white-red with a green CEDAR tree centred.",hook:"Lebanon = the green CEDAR on the white band (red bands top & bottom).",mean:"Cedar of Lebanon."},{n:"Saudi Arabia",c:"sa",r:"Asia",fam:"unique",tell:"Green field, white Arabic shahada + a sword.",hook:"Saudi = green with white SCRIPT and a SWORD underlining it.",mean:"The Islamic declaration of faith."},{n:"Afghanistan",c:"af",r:"Asia",fam:"unique",tell:"White field with black shahada script (Taliban flag).",hook:"Afghanistan (current) = plain WHITE with black Arabic script.",mean:"Islamic Emirate banner."},{n:"Iran",c:"ir",r:"Asia",fam:"panafrican",tell:"Green-white-red + red emblem centred + Kufic script along the band edges.",hook:"Iran = green/white/red with a tulip-like EMBLEM and rows of tiny script (Allahu Akbar x22).",mean:"Emblem = stylised 'Allah'."},{n:"Iraq",c:"iq",r:"Asia",fam:"panarab",tell:"Red-white-black + green 'Allahu Akbar' script centred.",hook:"Iraq = Pan-Arab bars with green SCRIPT (takbir) across the white middle.",mean:"Red/white/black + takbir."},{n:"Syria",c:"sy",r:"Asia",fam:"panarab",tell:"Green-white-black with three red stars (current transitional flag).",hook:"Syria (2024+) = green top, black bottom, THREE red stars on white. (Note: recently changed from red-top.)",mean:"Independence-era flag revived."},{n:"Yemen",c:"ye",r:"Asia",fam:"panarab",tell:"Red-white-black horizontal, plain.",hook:"Yemen = the BARE Pan-Arab tricolour, no emblem. 'Yemen = plainest of the reds.'",mean:"Arab Liberation colours."},{n:"Egypt",c:"eg",r:"Africa",fam:"panarab",tell:"Red-white-black + gold Eagle of Saladin centred.",hook:"vs Yemen/Iraq/Syria: Egypt = the golden EAGLE on the white band.",mean:"Eagle of Saladin."},{n:"Jordan",c:"jo",r:"Asia",fam:"panarab",tell:"Black-white-green + red hoist triangle with a white 7-point star.",hook:"vs Palestine: Jordan adds a white 7-pointed STAR inside the red triangle.",mean:"Star = 7 verses of the Quran's opening."},{n:"Palestine",c:"ps",r:"Asia",fam:"panarab",tell:"Black-white-green + plain red hoist triangle (no star).",hook:"vs Jordan: Palestine's red triangle is EMPTY. 'Palestine = plain triangle.'",mean:"Pan-Arab; Arab Revolt colours."},{n:"Sudan",c:"sd",r:"Africa",fam:"panarab",tell:"Red-white-black + GREEN hoist triangle.",hook:"vs Jordan/Palestine: Sudan's triangle is GREEN, not red. 'Sudan = green wedge.'",mean:"Green wedge = Islam/prosperity."},{n:"United Arab Emirates",c:"ae",r:"Asia",fam:"panarab",tell:"Red VERTICAL hoist bar + green-white-black horizontal bands.",hook:"UAE = red stands UP the pole, then green/white/black flow right. 'UAE = red pillar on the left.'",mean:"Pan-Arab unity."},{n:"Kuwait",c:"kw",r:"Asia",fam:"panarab",tell:"Green-white-red + black TRAPEZOID from the hoist.",hook:"vs UAE: Kuwait's hoist shape is a black slanted TRAPEZOID, and bands are green/white/red.",mean:"Pan-Arab; black trapezoid."},{n:"Qatar",c:"qa",r:"Asia",fam:"unique",tell:"MAROON + white split by a 9-point serrated line.",hook:"vs Bahrain: Qatar is MAROON with NINE white spikes (and taller/skinnier). 'Qatar = 9, darker.'",mean:"9 points = 9th Gulf emirate."},{n:"Bahrain",c:"bh",r:"Asia",fam:"unique",tell:"RED + white split by a 5-point serrated line.",hook:"vs Qatar: Bahrain is bright RED with FIVE spikes. 'Bahrain = fewer, brighter.'",mean:"5 points = 5 pillars of Islam."},{n:"Oman",c:"om",r:"Asia",fam:"unique",tell:"Red hoist bar (with khanjar dagger) + white/red/green fields.",hook:"Oman = the crossed DAGGER (khanjar) emblem in the top hoist; red L-shape.",mean:"National khanjar dagger."},{n:"Kazakhstan",c:"kz",r:"Asia",fam:"unique",tell:"Sky-blue with a gold sun + eagle + ornamental hoist pattern.",hook:"Kazakhstan = golden EAGLE under a sun on turquoise; a gold 'vine' runs up the pole.",mean:"Steppe eagle, endless sky."},{n:"Uzbekistan",c:"uz",r:"Asia",fam:"unique",tell:"Blue-white-green (thin red lines) + crescent & 12 stars in top blue.",hook:"Uzbekistan = blue/white/green with a crescent and an ARC of 12 stars.",mean:"12 stars = zodiac/months."},{n:"Turkmenistan",c:"tm",r:"Asia",fam:"unique",tell:"Green field + vertical CARPET stripe of guls + crescent & 5 stars.",hook:"Turkmenistan = green with a red CARPET band running up the hoist (most detailed flag).",mean:"Carpet guls = five tribes."},{n:"Kyrgyzstan",c:"kg",r:"Asia",fam:"unique",tell:"Red field, yellow sun with a criss-cross tunduk (yurt roof) centre.",hook:"Kyrgyzstan = red with a SUN whose centre shows a yurt's roof lattice.",mean:"Tunduk = the crown of a yurt."},{n:"Tajikistan",c:"tj",r:"Asia",fam:"unique",tell:"Red-white-green (wide white) + gold crown & 7 stars.",hook:"vs Iran/Hungary: Tajikistan = red/white/green with a gold CROWN + arc of 7 stars on the wide white band.",mean:"Crown + 7 stars = unity."},{n:"Azerbaijan",c:"az",r:"Asia",fam:"unique",tell:"Blue-red-green + white crescent & 8-point star on red.",hook:"Azerbaijan = blue/red/green stack with crescent+star. 'Turkic (blue), progress (red), Islam (green).'",mean:"8 points = Turkic peoples."},{n:"Armenia",c:"am",r:"Asia",fam:"unique",tell:"Red-blue-orange horizontal.",hook:"Armenia = red/blue/APRICOT-orange. 'Armenian apricot on the bottom.'",mean:"Blood, sky, apricot/wheat."},{n:"Georgia",c:"ge",r:"Asia",fam:"unique",tell:"Big red cross on white + a small red cross in each quarter (5 crosses).",hook:"Georgia = FIVE red crosses (one big, four small) on white \u2014 the 'Five Cross Flag.'",mean:"St. George crosses."},{n:"Maldives",c:"mv",r:"Asia",fam:"unique",tell:"Red border, green rectangle, white crescent.",hook:"Maldives = green box inside a red frame, white crescent inside the green.",mean:"Red frame, green palms, Islam."},{n:"Brunei",c:"bn",r:"Asia",fam:"unique",tell:"Yellow field, black & white diagonal stripes, red crest centred.",hook:"Brunei = YELLOW with two slanted black/white bars and a red parasol crest.",mean:"Yellow = sultan; crest = state motto."},{n:"Timor-Leste",c:"tl",r:"Asia",fam:"unique",tell:"Red field, black triangle with white star, yellow triangle behind.",hook:"Timor-Leste = nested TRIANGLES (yellow then black) with a white star at the point.",mean:"Star of hope emerging."},{n:"Ethiopia",c:"et",r:"Africa",fam:"panafrican",tell:"Green-yellow-red + blue disc @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
:root{
  --ink:#0b1a2b; --ink2:#122a40; --panel:#0f2336;
  --paper:#f4f1e7; --paper-line:#ddd6c4;
  --amber:#e8a531; --amber-dk:#b97f1e;
  --signal:#d6482f; --go:#2fa06a;
  --txt:#eaf0f5; --muted:#8ea3b6; --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
.app{min-height:100vh;background:
  radial-gradient(1200px 500px at 80% -10%, #163a56 0%, rgba(22,58,86,0) 60%),
  var(--ink);
  color:var(--txt); font-family:Inter,system-ui,sans-serif; padding-bottom:48px;}
.app *::selection{background:var(--amber);color:#0b1a2b}

/* header */
.hd{position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);
  background:linear-gradient(180deg, rgba(11,26,43,.96), rgba(11,26,43,.82));
  border-bottom:1px solid var(--line); padding:14px 18px 0;}
.hd-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hd h1{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.22em;
  font-size:22px;margin:0;color:var(--txt);
  border-bottom:3px solid var(--amber);padding-bottom:2px;line-height:1}
.hd-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tab{appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;
  padding:8px 12px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}

.mn{max-width:1060px;margin:0 auto;padding:18px}

/* method strip */
.method{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:6px;padding:12px 14px;font-size:13.5px;line-height:1.55;color:#cdd8e2;margin-bottom:18px}
.method b{color:var(--txt)} .hl{color:var(--amber);font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);padding:10px 12px;font-size:14px;font-family:inherit}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg.small button{padding:6px 10px;font-size:12.5px}
.seg button{appearance:none;background:transparent;border:0;color:var(--muted);
  font-family:inherit;font-size:13px;padding:9px 13px;cursor:pointer}
.seg button.on{background:var(--amber);color:#0b1a2b;font-weight:600}
.ghost{appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:6px;padding:9px 13px;font-family:inherit;font-size:13px;cursor:pointer}
.ghost:hover{color:var(--txt);border-color:var(--amber)}

/* groups + grid */
.grp{margin-bottom:26px}
.grp-h{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:15px;letter-spacing:.03em;color:var(--txt);margin:0 0 12px;
  padding-bottom:7px;border-bottom:1px solid var(--line);text-transform:uppercase}
.grp-n{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

/* card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column}
.plate{background:var(--paper);padding:12px;display:flex;align-items:center;justify-content:center}
.plate.sm{padding:9px} .plate.big{padding:20px} .plate.xs{padding:5px}
.flag-img{width:100%;display:block;border:1px solid var(--paper-line);border-radius:2px;
  box-shadow:0 1px 2px rgba(0,0,0,.18);overflow:hidden;line-height:0;background:#fff}
.flag-img svg{width:100%;height:auto;display:block}
.plate.big .flag-img{max-width:360px}
.plate.sm .flag-img{width:120px} .plate.xs .flag-img{width:46px}
.flag-fallback{width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;
  background:#e9e4d5;border:1px solid var(--paper-line);border-radius:2px}
.flag-fallback span{font-family:'IBM Plex Mono',monospace;font-weight:600;color:#6a6350;font-size:20px;letter-spacing:.1em}
.plate.sm .flag-fallback{width:120px} .plate.xs .flag-fallback{width:46px}
.card-body{padding:12px 13px 13px}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card-top h4{margin:0;font-size:15px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--txt)}
.code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 9px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#c3cfdb;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.chip-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip-region{color:#bcd0c6}
.tell{font-size:13px;line-height:1.5;color:#c8d3dd;margin:0}
.reveal-btn{margin-top:10px;appearance:none;background:transparent;border:1px dashed var(--line);
  color:var(--amber);border-radius:6px;padding:7px;width:100%;cursor:pointer;font-family:inherit;font-size:12.5px}
.reveal-btn:hover{border-color:var(--amber)}
.reveal{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.hook{font-size:13px;line-height:1.5;color:#eef3f7;margin:0}
.hk{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--amber);background:rgba(232,165,49,.12);
  border-radius:4px;padding:2px 6px;margin-right:7px;vertical-align:middle}
.mean{font-size:12px;line-height:1.45;color:var(--muted);margin:7px 0 0;font-style:italic}
.empty{color:var(--muted);text-align:center;padding:40px}

/* traps */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pair{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.pair-flags{display:flex;align-items:flex-start;justify-content:center;gap:14px}
.pf{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.pf-n{font-size:12.5px;font-weight:600;color:var(--txt);text-align:center;font-family:'Space Grotesk',sans-serif}
.pf .plate{width:100%;border-radius:6px}
.vs{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);align-self:center;margin-top:22px}
.diff{margin:13px 0 0;font-size:13px;line-height:1.55;color:#eaf0f5;
  background:rgba(214,72,47,.09);border:1px solid rgba(214,72,47,.32);border-radius:6px;padding:10px 12px}
.diff-tag{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--signal);margin-bottom:5px;font-weight:600}

/* drill */
.drill{max-width:620px;margin:0 auto}
.drill-bar{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.drill-bar .seg{flex-wrap:wrap}
.stats{display:flex;gap:18px;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.stats b{color:var(--amber);font-size:15px;margin-right:4px}
.drill-flag{display:flex;justify-content:center;margin:14px 0 18px}
.drill-flag .plate{border-radius:10px;width:100%;max-width:420px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:14px 14px 14px 40px;font-family:'Space Grotesk',sans-serif;
  font-size:14px;font-weight:500;cursor:pointer;transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--amber)}
.opt-k{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;width:19px;height:19px;
  display:flex;align-items:center;justify-content:center}
.opt.ok{background:rgba(47,160,106,.16);border-color:var(--go);color:#eafff3}
.opt.no{background:rgba(214,72,47,.16);border-color:var(--signal)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 0}
.fb{margin-top:16px;border-radius:10px;padding:15px;border:1px solid var(--line);background:var(--panel)}
.fb-ok{border-left:3px solid var(--go)} .fb-no{border-left:3px solid var(--signal)}
.fb-head{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-bottom:9px}
.fb-ok .fb-head{color:var(--go)} .fb-no .fb-head{color:#ff9a86}
.fb-chips{display:flex;gap:6px;margin-bottom:10px}
.fb-tell{font-size:13.5px;line-height:1.5;color:#cad5df;margin:0 0 9px}
.fb-hook{font-size:14px;line-height:1.55;color:#eef3f7;margin:0}
.fb-mean{font-size:12px;font-style:italic;color:var(--muted);margin:8px 0 0}
.next{margin-top:14px;appearance:none;width:100%;background:var(--amber);color:#0b1a2b;border:0;
  border-radius:8px;padding:12px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.next:hover{background:var(--amber-dk);color:#fff}
.kbd{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(11,26,43,.22);
  border-radius:3px;padding:1px 5px;margin-left:6px;font-weight:500}

/* progress */
.prog{max-width:640px;margin:0 auto}
.prog-hero{display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:20px;flex-wrap:wrap;justify-content:center}
.ring{width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring-in{width:88px;height:88px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring-pct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--amber);line-height:1}
.ring-lb{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.prog-nums{display:grid;grid-template-columns:repeat(4,auto);gap:20px}
.pn{display:flex;flex-direction:column;align-items:center}
.pn b{font-family:'Space Grotesk',sans-serif;font-size:24px;color:var(--txt)}
.pn span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sec-h{font-family:'Space Grotesk',sans-serif;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-lb{width:76px;font-size:13px;color:#cad5df}
.bar{flex:1;height:9px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--amber-dk),var(--amber));border-radius:5px;transition:width .4s}
.bar-n{width:56px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.weak{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.weak-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px}
.weak-t{display:flex;flex-direction:column;min-width:0}
.weak-t span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weak-t small{font-size:11px;color:var(--muted)}
.reset{margin-top:26px;appearance:none;background:transparent;border:1px solid rgba(214,72,47,.4);
  color:#ff9a86;border-radius:6px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:13px}
.reset:hover{background:rgba(214,72,47,.12)}
.note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}

@media(max-width:560px){
  .opts{grid-template-columns:1fr}
  .prog-nums{gap:14px}
  .hd h1{font-size:19px}
}
