c",c:"do",r:"Americas",fam:"unique",tell:"White CROSS dividing blue/red quarters + central coat of arms.",hook:"Dom. Rep. = the only flag with a Bible in the crest; a white cross splits blue & red.",mean:"Cross + open Bible.",hist:"A white cross dividing blue and red quarters, with the national arms and an open Bible at the centre \u2014 the only flag to depict a Bible.",sub:"Caribbean",fact:"The only national flag to display a Bible \u2014 open at its centre above the motto \u2018God, Homeland, Liberty\u2019."},{n:"Jamaica",c:"jm",r:"Americas",fam:"unique",tell:"Gold SALTIRE (X) dividing green (top/bottom) & black (sides).",hook:"Jamaica = gold X making triangles: green top&bottom, black left&right. Only flag with no red/white/blue.",mean:"Gold sun, green land, black strength.",hist:"A gold diagonal cross splitting green and black triangles \u2014 gold for sunshine, green for the land, black for strength; one of the few flags with no red, white or blue.",sub:"Caribbean",fact:"The only national flag with no red, white, or blue."},{n:"Trinidad and Tobago",c:"tt",r:"Americas",fam:"unique",tell:"Red field with a black DIAGONAL stripe edged in white.",hook:"Trinidad = red with a bold black-and-white slash from top-hoist to bottom-fly.",mean:"Fire, water/earth, unity.",hist:"A white-edged black diagonal on red \u2014 red for warmth and people, black for strength and unity, white for the surrounding sea.",sub:"Caribbean",fact:"A single white-edged black diagonal on red \u2014 sea, people and strength in three colours."},{n:"Bahamas",c:"bs",r:"Americas",fam:"unique",tell:"Aquamarine-gold-aquamarine + black hoist TRIANGLE.",hook:"Bahamas = turquoise/gold sea-and-sand bands with a black triangle at the pole.",mean:"Sea, sand, vigour of the people.",hist:"Aquamarine and gold stripes for the sea and sand, with a black hoist triangle for the strength and enterprise of the people.",sub:"Caribbean",fact:"A black triangle points into gold-and-aquamarine bands for the sand and sea."},{n:"Barbados",c:"bb",r:"Americas",fam:"unique",tell:"Blue-gold-blue + black TRIDENT head centred.",hook:"Barbados = Neptune's broken TRIDENT on the gold middle band.",mean:"Broken trident = break from colonial past.",hist:"Blue-gold-blue with a black broken trident head \u2014 the trident of the sea god, broken to mark the break from colonial rule.",sub:"Caribbean",fact:"Its broken trident is unique \u2014 the break marks the clean break from colonial rule."},{n:"Belize",c:"bz",r:"Americas",fam:"unique",tell:"Blue field, thin red top & bottom + detailed coat of arms (two woodcutters).",hook:"Belize = the most DETAILED flag (most colours); two men + a mahogany tree in a white disc.",mean:"'Sub Umbra Floreo' \u2014 logging heritage.",hist:"Royal blue with red edges and a detailed coat of arms \u2014 the only national flag to depict people, two woodcutters at work.",sub:"Central America",fact:"The only national flag to depict people \u2014 two woodcutters \u2014 and, at 12 colours, the most colourful."},{n:"Grenada",c:"gd",r:"Americas",fam:"unique",tell:"Red border with 6 stars + green/yellow triangles + a NUTMEG.",hook:"Grenada = red frame, 6 stars, and a little NUTMEG pod (the 'Spice Isle').",mean:"Nutmeg, 6 parishes + 1 island star.",hist:"A red border with six stars for the parishes, a seventh central star, and a nutmeg pod for the 'Isle of Spice'.",sub:"Caribbean",fact:"The only national flag to depict a spice \u2014 a nutmeg, for the 'Isle of Spice'."},{n:"Saint Lucia",c:"lc",r:"Americas",fam:"unique",tell:"Blue field + black-and-white ARROW/triangle over a gold triangle.",hook:"St. Lucia = twin volcanic PITONS: a black triangle over gold over blue.",mean:"The Pitons rising from the sea.",hist:"Blue with a black-and-white arrowhead over a gold triangle, representing the twin Pitons rising from the sea.",sub:"Caribbean",fact:"Its black-and-white triangles picture the twin Pitons rising from the sea."},{n:"Dominica",c:"dm",r:"Americas",fam:"unique",tell:"Green field, tricolour cross, red centre disc with a purple SISSEROU PARROT.",hook:"Dominica = the only flag with PURPLE \u2014 a Sisserou parrot ringed by 10 stars.",mean:"National parrot; 10 parishes.",hist:"Green with a cross of yellow, black and white stripes and a central Sisserou parrot ringed by ten stars \u2014 one of only two flags to use purple.",sub:"Caribbean",fact:"One of only two national flags to contain purple \u2014 here in the Sisserou parrot."},{n:"Antigua and Barbuda",c:"ag",r:"Americas",fam:"unique",tell:"Red field + black/blue/white bands with a rising gold SUN.",hook:"Antigua = a golden half-SUN on black, inside a red V. 'Dawn of a new era.'",mean:"Sunrise of independence.",hist:"A rising golden sun on black over red, blue and white \u2014 the sun for a new era, the colours for soil, sea and hope.",sub:"Caribbean",fact:"A rising golden sun on black over sea and sand \u2014 the sun of a new era."},{n:"Saint Kitts and Nevis",c:"kn",r:"Americas",fam:"unique",tell:"Green & red split by a black DIAGONAL band with 2 white stars.",hook:"vs Trinidad: St. Kitts = a black diagonal with TWO stars, green & red fields (yellow edges).",mean:"2 stars = the two islands.",hist:"A black diagonal band with two white stars, edged in green and red \u2014 the stars for hope and liberty of the two islands.",sub:"Caribbean",fact:"Two white stars for its two islands, on a rare black diagonal edged green and red."},{n:"Saint Vincent and the Grenadines",c:"vc",r:"Americas",fam:"unique",tell:"Blue-yellow-green vertical + three green DIAMONDS (V-shape) on gold.",hook:"St. Vincent = three green gems forming a 'V' on the yellow band. 'The Gems.'",mean:"V for Vincent; Caribbean gems.",hist:"Blue, gold and green with three green diamonds set in a 'V' \u2014 the 'Gems of the Antilles', arranged for Vincent.",sub:"Caribbean",fact:"Its three green diamonds form a 'V' for Vincent \u2014 the 'Gems of the Antilles'."},{n:"Australia",c:"au",r:"Oceania",fam:"unique",tell:"Union Jack canton + big 7-point Commonwealth star + Southern Cross (5 stars, one small).",hook:"vs New Zealand: Australia has MORE stars, all WHITE, plus a large star under the Jack.",mean:"Commonwealth star + Southern Cross.",hist:"The Union Jack, the large seven-pointed Commonwealth Star, and the Southern Cross constellation on a blue field.",sub:"Australasia",fact:"Carries the Union Jack, the Southern Cross, and a seven-pointed Commonwealth Star."},{n:"New Zealand",c:"nz",r:"Oceania",fam:"unique",tell:"Union Jack canton + FOUR red, white-edged stars (Southern Cross).",hook:"vs Australia: NZ = just 4 RED stars, no big star. 'NZ = fewer, red.'",mean:"Southern Cross constellation.",hist:"The Union Jack with four red, white-bordered stars of the Southern Cross \u2014 set apart from Australia's by the stars' colour and count.",sub:"Australasia",fact:"Told apart from Australia's flag by its four red Southern Cross stars (Australia has five, white)."},{n:"Fiji",c:"fj",r:"Oceania",fam:"unique",tell:"Light-blue field + Union Jack + shield (lion, sugarcane, dove).",hook:"Fiji = pale sky-BLUE ensign with a shield of a lion & sugarcane.",mean:"Pacific sky + colonial shield.",hist:"A light blue ensign with the Union Jack and a shield of sugarcane, a dove and a lion \u2014 light blue for the Pacific Ocean.",sub:"Melanesia",fact:"One of the last flags still flying Britain's Union Jack in the canton (with Australia, New Zealand and Tuvalu)."},{n:"Tuvalu",c:"tv",r:"Oceania",fam:"unique",tell:"Light-blue + Union Jack + 9 yellow STARS mapping the islands.",hook:"Tuvalu = sky-blue with 9 gold stars laid out like the islands' geography.",mean:"9 islands mapped.",hist:"A light blue ensign with the Union Jack and nine yellow stars laid out to map the positions of the islands.",sub:"Polynesia",fact:"Keeps Britain's Union Jack; its nine yellow stars are laid out to map the nine islands."},{n:"Papua New Guinea",c:"pg",r:"Oceania",fam:"unique",tell:"Diagonal split: red (with gold bird-of-paradise) & black (with Southern Cross).",hook:"PNG = diagonal red/black; a gold BIRD-OF-PARADISE up top, Southern Cross below.",mean:"National bird + constellation.",hist:"Divided diagonally: a gold bird-of-paradise on red, and the white stars of the Southern Cross on black.",sub:"Melanesia",fact:"One of the few national flags designed by a teenager \u2014 15-year-old Susan Karike."},{n:"Samoa",c:"ws",r:"Oceania",fam:"unique",tell:"Red field + blue canton with the Southern Cross (5 white stars).",hook:"Samoa = red flag, blue box with the Southern Cross. 'Red Samoa, corner cross.'",mean:"Southern Cross.",hist:"Red with a blue canton bearing the five white stars of the Southern Cross.",sub:"Polynesia",fact:"Its five stars are the Southern Cross, shared with the flags of Australia, New Zealand and Papua New Guinea."},{n:"Tonga",c:"to",r:"Oceania",fam:"unique",tell:"Red field + white canton with a red CROSS.",hook:"Tonga = red with a little red CROSS on a white box. (Looks like a Red-Cross-in-a-corner.)",mean:"Christianity; couldn't use the Red Cross emblem itself.",hist:"Red with a white canton holding a red cross for the nation's Christian faith; the red stands for the blood of Christ.",sub:"Polynesia",fact:"By Tonga's constitution, the flag may never be changed."},{n:"Solomon Islands",c:"sb",r:"Oceania",fam:"unique",tell:"Diagonal thin yellow line splitting blue (5 stars) & green.",hook:"Solomon Is. = a thin gold DIAGONAL; blue triangle holds 5 white stars.",mean:"5 stars = original provinces.",hist:"A yellow diagonal stripe dividing blue and green, with five white stars for the island groups \u2014 blue for water, green for land.",sub:"Melanesia",fact:"Five white stars for its provinces sit above a thin gold stripe dividing blue sea from green land."},{n:"Vanuatu",c:"vu",r:"Oceania",fam:"unique",tell:"Black Y (pall) + red & green fields + yellow boar's-TUSK & fern emblem.",hook:"Vanuatu = black 'Y' on its side with a curled boar TUSK crest.",mean:"Tusk = prosperity; Y = island chain.",hist:"A black 'Y' echoing the islands' shape, with a boar's-tusk and fern emblem \u2014 red for blood, green for the land, black for the people.",sub:"Melanesia",fact:"The boar's tusk and namele fern are unique symbols; the black Y traces the islands."},{n:"Kiribati",c:"ki",r:"Oceania",fam:"unique",tell:"Red top with a gold FRIGATEBIRD & sun; blue-white wavy sea below.",hook:"Kiribati = a golden bird flying over a rising sun, above blue ocean WAVES.",mean:"Frigatebird over the Pacific.",hist:"A gold frigatebird flying over a rising sun, above three white wavy bands for the ocean and the island groups.",sub:"Micronesia",fact:"A frigatebird over a rising sun and three waves \u2014 a scene on no other flag."},{n:"Marshall Islands",c:"mh",r:"Oceania",fam:"unique",tell:"Blue field + orange/white diagonal RAYS + white star (many points).",hook:"Marshall Is. = two widening diagonal rays (orange/white) with a big 24-ray star in the corner.",mean:"Rays = equator/islands; star points = municipalities.",hist:"Blue with two rising diagonal stripes (orange and white) and a large 24-point star, for the equator, the island chains and the atolls.",sub:"Micronesia",fact:"Two rising stripes for the Equator and the island chains, under a 24-point star for the districts."},{n:"Micronesia",c:"fm",r:"Oceania",fam:"unique",tell:"Light-blue field, 4 white stars in a diamond.",hook:"Micronesia = UN-blue with just FOUR stars in a diamond (the 4 states).",mean:"4 island states.",hist:"Light blue with four white stars for the states of the federation \u2014 blue for the Pacific.",sub:"Micronesia",fact:"Light blue with four white stars for its four states \u2014 blue for the vast Pacific."},{n:"Nauru",c:"nr",r:"Oceania",fam:"unique",tell:"Blue field, thin gold horizontal line, single white 12-point STAR below-hoist.",hook:"Nauru = a gold line = the EQUATOR, and a star showing the island's position just below it.",mean:"The island sits just south of the equator.",hist:"A blue field with a thin gold line for the equator and a single white star marking the island's position just below it.",sub:"Micronesia",fact:"The single star marks the island's real position just south of the Equator \u2014 shown by the gold stripe."},{n:"DR Congo",c:"cd",r:"Africa",fam:"unique",tell:"Sky-blue field, red DIAGONAL stripe (yellow-edged) + gold star top-hoist.",hook:"DR Congo = sky-blue with a red diagonal sash and a gold star in the corner. (vs Congo-Brazzaville's green/yellow/red diagonal.)",mean:"Star of a united future.",hist:"Sky blue with a large yellow star and a yellow-edged red diagonal \u2014 red for the martyrs of independence, blue for peace.",sub:"Middle Africa",fact:"Sky-blue with a yellow star and a red diagonal \u2014 red for the martyrs of independence."},{n:"Guatemala",c:"gt",r:"Americas",fam:"centralamerica",tell:"Blue-white-blue VERTICAL + crest with a quetzal bird & scroll.",hook:"vs the others: Guatemala is the only Central-American one that's VERTICAL, and its emblem has the resplendent QUETZAL + crossed rifles.",mean:"Quetzal = liberty; rifles & swords = defence.",hist:"Sky-blue and white vertical bands with the national arms \u2014 a resplendent quetzal, a scroll and crossed rifles \u2014 for liberty.",sub:"Central America",fact:"Features the resplendent quetzal \u2014 a bird said to die in captivity, hence a symbol of liberty."},{n:"El Salvador",c:"sv",r:"Americas",fam:"centralamerica",tell:"Blue-white-blue + coat of arms with a triangle & 5 volcanoes.",hook:"vs Nicaragua: El Salvador's crest is denser \u2014 a triangle over 5 VOLCANOES, wreathed. Text reads 'Republica de El Salvador'.",mean:"Triangle = equality; volcanoes = the isthmus.",hist:"Blue-white-blue, the historic Central American colours, with the national coat of arms at the centre.",sub:"Central America",fact:"One of three near-identical Central American flags (with Honduras and Nicaragua) \u2014 the central emblem is the only giveaway."},{n:"Nicaragua",c:"ni",r:"Americas",fam:"centralamerica",tell:"Blue-white-blue + triangle with 5 volcanoes and a RAINBOW.",hook:"vs El Salvador: Nicaragua's emblem has a bright RAINBOW and a Phrygian cap on a pole; text reads 'Republica de Nicaragua'.",mean:"Rainbow of peace; 5 volcanoes = 5 members.",hist:"Blue-white-blue with a central triangle, rainbow and volcanoes, closely modelled on the old United Provinces of Central America.",sub:"Central America",fact:"One of only two national flags to contain purple, hidden inside its central rainbow."},{n:"Honduras",c:"hn",r:"Americas",fam:"centralamerica",tell:"Blue-white-blue + FIVE blue stars in an X pattern on the white.",hook:"Honduras = the easy one: FIVE STARS (no fussy crest) arranged in an X on the white band.",mean:"5 stars = the 5 union states, Honduras central.",hist:"Blue-white-blue with five blue stars in the centre for the five nations of the former Central American federation.",sub:"Central America",fact:"Its five blue stars mark the five states of the old Central American federation."},{n:"Costa Rica",c:"cr",r:"Americas",fam:"centralamerica",tell:"Blue-white-RED-white-blue; fat red centre band.",hook:"Costa Rica = the odd one out: it adds a bold RED stripe down the middle (inspired by France). Civil version has no crest.",mean:"Red band added 1848 for revolutionary ideals.",hist:"The Central American blue-and-white with a bold red central stripe added in 1848, inspired by the ideals of the French tricolour.",sub:"Central America",fact:"The only Central American flag to add a bold red stripe \u2014 inspired by the ideals of France's tricolour."}],u5=[["Chad","Romania","Chad's blue is a deep indigo; Romania's is a bright cobalt. Otherwise identical blue-yellow-red vertical tricolours."],["Indonesia","Monaco","Same red-over-white \u2014 but Monaco is nearly square (shorter) and Indonesia is a wide 3:2 banner."],["Netherlands","Luxembourg","Both red-white-blue horizontal. Luxembourg's blue is lighter and its flag is longer; the Netherlands' red is deeper."],["Ireland","C\xF4te d'Ivoire","Both green-white-orange vertical \u2014 but the order flips. Ireland: GREEN at the pole. C\xF4te d'Ivoire: ORANGE at the pole."],["Mali","Guinea","Both green-yellow-red vertical, mirrored. Mali reads green\u2192red (green at pole); Guinea reads red\u2192green (red at pole)."],["Senegal","Mali","Senegal adds a green STAR in the centre band; Mali is bare."],["Norway","Iceland","Colour-swapped Nordic crosses. Norway: red field / blue cross. Iceland: blue field / red cross."],["New Zealand","Australia","NZ has 4 red stars only. Australia has 6 white stars including a large 7-point star beneath the Union Jack."],["Slovakia","Slovenia","Both white-blue-red + shield. Slovakia's shield (double-cross on hills) sits centre; Slovenia's (Mt. Triglav) hugs the hoist."],["Venezuela","Ecuador","Both yellow-blue-red. Ecuador has a condor coat of arms centred; Venezuela has an arc of white stars (no crest)."],["Colombia","Ecuador","Both yellow(double)-blue-red. Colombia is plain; Ecuador carries the condor arms in the middle."],["Qatar","Bahrain","Serrated split. Qatar is maroon with 9 points; Bahrain is red with 5 points."],["Jordan","Palestine","Both black-white-green with a red hoist triangle. Jordan's triangle holds a white 7-point star; Palestine's is empty."],["Egypt","Yemen","Both red-white-black. Egypt has the gold Eagle of Saladin centred; Yemen is bare."],["Poland","Indonesia","Poland is white-over-red; Indonesia is red-over-white \u2014 vertical mirror images."],["Liberia","United States","Both stars-and-stripes. Liberia has ONE star and 11 stripes; the USA has 50 stars and 13 stripes."],["Italy","Mexico","Both green-white-red vertical. Mexico carries the eagle-and-snake emblem and is longer; Italy is bare."],["Ireland","Italy","Both green-white + a warm colour. Ireland ends in ORANGE and is longer; Italy ends in RED and is even/short."],["Luxembourg","Netherlands","See Netherlands/Luxembourg \u2014 the classic 'lighter and longer' tell for Luxembourg."],["Austria","Latvia","Both red-white-red horizontal. Latvia's red is a dark maroon and its white stripe is thinner; Austria's bands are equal and bright."],["Andorra","Moldova","Both blue-yellow-red vertical with a centred crest. Andorra: cattle & mitre shield. Moldova: an eagle holding a shield."],["Chad","Andorra","Both blue-yellow-red vertical. Andorra has a coat of arms in the centre; Chad is bare (and darker blue than Romania)."],["El Salvador","Nicaragua","Both blue-white-blue with a triangle-and-volcanoes crest. Nicaragua has a bright RAINBOW in the triangle; El Salvador's is denser with no rainbow. Read the text ring if unsure."],["Guatemala","Honduras","Both blue-white-blue. Guatemala is VERTICAL with a quetzal crest; Honduras is horizontal with five blue stars in an X."],["Honduras","El Salvador","Both blue-white-blue horizontal. Honduras has five plain stars; El Salvador has a full coat of arms."],["Costa Rica","Thailand","Both are 5-band flags with a fat centre. Costa Rica: blue-white-RED-white-blue (red centre). Thailand: red-white-BLUE-white-red (blue centre)."],["Congo (Rep.)","DR Congo","Both have a diagonal. Congo-Brazzaville: green/yellow/red bands on the diagonal. DR Congo: sky-blue with a single red diagonal sash + gold star."]],c5={nordic:{label:"Nordic cross",dot:"#3b6ea5"},panafrican:{label:"Pan-African",dot:"#2e9e5b"},panarab:{label:"Pan-Arab",dot:"#b5342a"},panslavic:{label:"Pan-Slavic",dot:"#4b4fb0"},grancolombia:{label:"Gran Colombia",dot:"#e0a52b"},centralamerica:{label:"Central America",dot:"#3fa9d6"},crescent:{label:"Crescent & star",dot:"#1f9e8f"},tricolor:{label:"Tricolour",dot:"#8a56c4"},unique:{label:"Distinct",dot:"#8a97a6"}},H2=e=>c5[e]||c5.unique,Ce=["Africa","Americas","Asia","Europe","Oceania"],S2={Africa:["Northern Africa","Western Africa","Middle Africa","Eastern Africa","Southern Africa"],Americas:["Northern America","Central America","Caribbean","South America"],Asia:["Western Asia","Central Asia","South Asi @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
:root{
  --ink:#0b1a2b; --ink2:#122a40; --panel:#0f2336;
  --paper:#f4f1e7; --paper-line:#ddd6c4;
  --amber:#e8a531; --amber-dk:#b97f1e;
  --signal:#d6482f; --go:#2fa06a;
  --txt:#eaf0f5; --muted:#8ea3b6; --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
.app{min-height:100vh;background:
  radial-gradient(1200px 500px at 80% -10%, #163a56 0%, rgba(22,58,86,0) 60%),
  var(--ink);
  color:var(--txt); font-family:Inter,system-ui,sans-serif; padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));}
.app *::selection{background:var(--amber);color:#0b1a2b}

/* header */
.hd{position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);
  background:linear-gradient(180deg, rgba(11,26,43,.96), rgba(11,26,43,.82));
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 18px) 0 calc(env(safe-area-inset-left,0px) + 18px);}
.hd-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hd h1{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.22em;
  font-size:22px;margin:0;color:var(--txt);
  border-bottom:3px solid var(--amber);padding-bottom:2px;line-height:1}
.hd-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tab{appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;
  padding:8px 12px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}

.mn{max-width:1060px;margin:0 auto;padding:18px}

/* method strip */
.method{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:6px;padding:12px 14px;font-size:13.5px;line-height:1.55;color:#cdd8e2;margin-bottom:18px}
.method b{color:var(--txt)} .hl{color:var(--amber);font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.startmode{margin:0 0 16px}
.custom-pick{display:flex;flex-direction:column;gap:4px}
.cp-group{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.02)}
.cp-row{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 2px 10px}
.cp-label{display:flex;align-items:center;gap:9px;flex:1;padding:8px 0;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--txt)}
.cp-label input,.cp-sub input{width:17px;height:17px;accent-color:var(--amber);cursor:pointer}
.cp-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--amber);background:rgba(232,165,49,.14);border-radius:4px;padding:1px 6px}
.cp-exp{appearance:none;background:transparent;border:0;color:var(--muted);font-size:18px;line-height:1;width:34px;height:34px;cursor:pointer;font-family:'IBM Plex Mono',monospace}
.cp-exp:hover{color:var(--txt)}
.cp-subs{display:flex;flex-wrap:wrap;gap:4px;padding:2px 10px 10px 36px}
.cp-sub{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:6px;padding:5px 9px 5px 7px;cursor:pointer}
.cp-sub.on{color:var(--txt);border-color:rgba(232,165,49,.4)}
.cp-sub input{width:14px;height:14px}
.start-btn:disabled{opacity:.5;cursor:default}
.scope-picker{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}
.scope-picker .seg{flex-wrap:wrap;background:var(--panel)}
.scope-picker .subseg{background:rgba(255,255,255,.03)}
.learn-count{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
  color:var(--muted);text-transform:uppercase;margin:-4px 0 14px}
.round-cta{display:block;width:100%;text-align:left;appearance:none;cursor:pointer;
  background:linear-gradient(180deg, rgba(232,165,49,.15), rgba(232,165,49,.05));
  border:1px solid rgba(232,165,49,.35);border-radius:10px;padding:14px 16px;margin:0 0 16px}
.round-cta:hover{border-color:var(--amber)}
.round-cta-t{display:block;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--amber)}
.round-cta-s{display:block;font-size:12.5px;color:#c7d2dc;margin-top:3px}
.round-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.round-exit{appearance:none;background:transparent;border:1px solid var(--line);border-radius:6px;
  color:var(--muted);padding:6px 10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer}
.round-exit:hover{color:var(--txt);border-color:var(--muted)}
.round-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.study{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.study .plate.big{width:100%;padding:22px;border-radius:0}
.study-body{padding:16px 16px 18px}
.study-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0}
.study-body .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.study-body .chips{display:flex;gap:6px;margin-bottom:12px}
.study-nav{display:flex;gap:10px}
.half-btn{flex:1;margin-top:0}
.rem{float:right;font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(11,26,43,.6);font-weight:600}
.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);padding:10px 12px;font-size:14px;font-family:inherit}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg.small button{padding:6px 10px;font-size:12.5px}
.seg button{appearance:none;background:transparent;border:0;color:var(--muted);
  font-family:inherit;font-size:13px;padding:9px 13px;cursor:pointer}
.seg button.on{background:var(--amber);color:#0b1a2b;font-weight:600}
.ghost{appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:6px;padding:9px 13px;font-family:inherit;font-size:13px;cursor:pointer}
