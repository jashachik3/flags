h="100%" height="100%" transform="translate(-133.3 37.3)"/></svg>',cr:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><g fill-rule="evenodd" stroke-width="1pt"><path fill="#0000b4" d="M0 0h640v480H0z"/><path fill="#fff" d="M0 75.4h640v322.3H0z"/><path fill="#d90000" d="M0 157.7h640v157.7H0z"/></g></svg>'},q1=[{n:"Denmark",c:"dk",r:"Europe",fam:"nordic",tell:"White cross on plain red \u2014 the oldest national flag, the Dannebrog.",hook:"DENmark = the DEN/original. Simplest Nordic: red field, white cross, nothing else. All other Nordic crosses are variations on this.",mean:"Legend: fell from the sky in 1219. The template for every Nordic cross.",hist:"The Dannebrog is traditionally called the oldest continuously used national flag; legend says it fell from the sky during a 1219 battle. Its off-centre white cross became the template for every Nordic flag.",sub:"Northern Europe",fact:"The Dannebrog is the oldest national flag still in use, traced to the 13th century."},{n:"Sweden",c:"se",r:"Europe",fam:"nordic",tell:"Yellow cross on blue.",hook:"Sweden = IKEA colours: blue + yellow. Blue field, gold cross.",mean:"Blue and gold from the national coat of arms.",hist:"A gold Scandinavian cross on blue, drawn from Sweden's blue-and-gold royal coat of arms and used since the 16th century.",sub:"Northern Europe",fact:"One of five Nordic-cross flags \u2014 the off-centre cross marks the Scandinavian family (with Denmark, Norway, Iceland, Finland)."},{n:"Norway",c:"no",r:"Europe",fam:"nordic",tell:"Red field, white-outlined blue cross.",hook:"Norway = Red, White & Blue crammed into a Nordic cross (it was under Denmark=red then Sweden=blue). Iceland is the exact colour-swap.",mean:"Combines Danish red + French-revolution liberty blue.",hist:"Adopted 1821: Denmark's red-and-white with a blue cross added, giving the red-white-blue shared by the era's liberty movements.",sub:"Northern Europe",fact:"One of the five Nordic-cross flags, and the only three-colour one \u2014 a blue cross laid inside Denmark's white-edged red."},{n:"Iceland",c:"is",r:"Europe",fam:"nordic",tell:"Blue field, white-outlined red cross.",hook:"Iceland = Norway's negative. Swap Norway's blue and red: blue field / red cross. (Fire=red on glacial=blue-white.)",mean:"Blue mountains, white ice, red volcanic fire.",hist:"Adopted 1915 and kept at independence in 1944 \u2014 blue for the mountains, white for ice and snow, red for volcanic fire.",sub:"Northern Europe",fact:"One of the five Nordic-cross flags \u2014 essentially Norway's colours reversed."},{n:"Finland",c:"fi",r:"Europe",fam:"nordic",tell:"Blue cross on white \u2014 the palest Nordic flag.",hook:"Finland = a thousand blue LAKES on white SNOW. The only Nordic cross that is blue-on-white.",mean:"Blue lakes/sky, white snow.",hist:"Adopted 1918 after independence from Russia; the blue cross stands for the country's thousands of lakes and its sky, white for winter snow.",sub:"Northern Europe",fact:"The plainest of the five Nordic-cross flags \u2014 a single blue cross on white."},{n:"France",c:"fr",r:"Europe",fam:"tricolor",tell:"Blue-white-red vertical, blue at hoist.",hook:"The original tricolour. Blue-White-Red left to right = 'BWR' \u2192 alphabetical-ish. The ancestor of most tricolours.",mean:"Libert\xE9, \xE9galit\xE9, fraternit\xE9 (1789).",hist:"The 1789 Revolution combined the white of the monarchy with the red and blue of Paris. This tricolour became the model copied around the world.",sub:"Western Europe",fact:"The original tricolour \u2014 its blue-white-red template was copied onto flags around the world."},{n:"Netherlands",c:"nl",r:"Europe",fam:"panslavic",tell:"Red-white-blue horizontal; a deep/bright red on top.",hook:"vs Luxembourg: Netherlands red is darker and the flag is squarer. 'Dutch is Deeper red.'",mean:"Oldest tricolour; inspired Russia and many others.",hist:"The world's oldest tricolour, evolving from the orange-white-blue 'Prince's Flag' of the 16th-century revolt against Spain; the orange later shifted to red.",sub:"Western Europe",fact:"The world's oldest tricolour \u2014 near-identical to Luxembourg's, but with a deeper blue and a squarer shape."},{n:"Luxembourg",c:"lu",r:"Europe",fam:"panslavic",tell:"Red-white-blue horizontal; lighter sky-blue, longer/skinnier.",hook:"vs Netherlands: Luxembourg is Lighter blue and Longer. Two L's.",mean:"Colours from the Grand Duke's arms.",hist:"Red-white-blue stripes from the Grand Duke's coat of arms \u2014 nearly the Dutch flag, but longer and with a lighter blue.",sub:"Western Europe",fact:"Near-identical to the Netherlands' flag \u2014 Luxembourg's blue is lighter and its shape longer."},{n:"Russia",c:"ru",r:"Europe",fam:"panslavic",tell:"White-blue-red horizontal, top to bottom.",hook:"The Pan-Slavic parent. WBR top\u2192down. 'White snow, Blue sky, Red blood.' Slovakia/Slovenia add an emblem to this exact stack.",mean:"Source of Pan-Slavic colours (1690s).",hist:"Peter the Great adopted white-blue-red in the 1690s after visiting the Netherlands; it became the source of the Pan-Slavic colours.",sub:"Eastern Europe",fact:"Its white-blue-red is the original source of the Pan-Slavic colours later copied by Slovakia, Slovenia and others."},{n:"Slovakia",c:"sk",r:"Europe",fam:"panslavic",tell:"White-blue-red + shield with a white double-cross on three blue hills.",hook:"vs Slovenia: SlovaKia's shield is at CENTRE-ish and has a Cross on hills. 'K = Kross.'",mean:"Double-cross = Christian heritage.",hist:"The Pan-Slavic white-blue-red with the national arms \u2014 a double cross on three hills \u2014 shifted toward the hoist.",sub:"Eastern Europe",fact:"Pan-Slavic stripes like Russia's \u2014 a near-twin of Slovenia's, told apart by the arms near the hoist."},{n:"Slovenia",c:"si",r:"Europe",fam:"panslavic",tell:"White-blue-red + shield near the HOIST with Mt. Triglav + stars.",hook:"vs Slovakia: SloveNia's shield hugs the hoist (top-left) and shows a mountaiN. 'N = mountaiN, Near the pole.'",mean:"Triglav is Slovenia's highest peak.",hist:"Pan-Slavic white-blue-red with arms showing Mount Triglav and stars from the Counts of Celje.",sub:"Southern Europe",fact:"Pan-Slavic stripes and a near-twin of Slovakia's \u2014 the Mount Triglav shield and its position are the giveaway."},{n:"Serbia",c:"rs",r:"Europe",fam:"panslavic",tell:"Red-blue-white (inverted order) + eagle & crown shield toward hoist.",hook:"Serbia flips the Slavic order to Red-Blue-White and adds a double eagle. 'Serbia = Same colours, Swapped order.'",mean:"Double-headed eagle, royal arms.",hist:"Inverted Pan-Slavic stripes (red-blue-white) charged with the state arms: a double-headed eagle and shield.",sub:"Southern Europe",fact:"One of only three flags bearing a double-headed eagle (with Albania and Montenegro)."},{n:"Croatia",c:"hr",r:"Europe",fam:"panslavic",tell:"Red-white-blue + red-and-white CHECKERBOARD shield.",hook:"Croatia = the CHECKERED shield (\u0161ahovnica). Only Slavic tricolour with a chessboard.",mean:"Checkerboard is centuries-old Croatian symbol.",hist:"Pan-Slavic red-white-blue stripes centred by the checkerboard '\u0161ahovnica' shield, a Croatian symbol for centuries.",sub:"Southern Europe",fact:"Pan-Slavic stripes set apart by the red-and-white checkerboard shield at its heart."},{n:"Czechia",c:"cz",r:"Europe",fam:"panslavic",tell:"White over red with a blue triangle from the hoist.",hook:"Czech = a blue WEDGE eating into white/red. Poland+blue triangle.",mean:"Blue added to distinguish from Poland.",hist:"White over red (the old Bohemian colours) with a blue triangle added in 1920 to tell it apart from Poland; kept after the 1993 split.",sub:"Eastern Europe",fact:"Bohemia's white-over-red with a blue triangle added \u2014 the wedge is what separates it from Poland's plain bicolour."},{n:"Poland",c:"pl",r:"Europe",fam:"unique",tell:"White on top, red on bottom. Nothing else.",hook:"vs Indonesia/Monaco (red-over-white): Poland is White-over-red \u2014 the INVERSE. 'Poland = Pale on top.'",mean:"White eagle on red field, simplified.",hist:"Simply white over red, taken from the white eagle on a red shield used since medieval times.",sub:"Eastern Europe",fact:"White over red from the white eagle \u2014 the exact reverse of Indonesia's and Monaco's red-over-white."},{n:"Austria",c:"at",r:"Europe",fam:"unique",tell:"Red-white-red horizontal bands.",hook:"Red-White-Red. Legend: a duke's white tunic stayed white only under his belt after battle. Same stripes as Latvia but Austria's red is brighter and bands are equal.",mean:"One of the oldest flags.",hist:"Red-white-red is among Europe's oldest designs; legend ties it to a duke's blood-soaked tunic, white where his belt had been.",sub:"Western Europe",fact:"Red-white-red is one of the oldest coat-of-arms designs in the world, tied to a 12th-century legend."},{n:"Latvia",c:"lv",r:"Europe",fam:"unique",tell:"Dark carmine-red / white / dark-red, with a thin white stripe.",hook:"vs Austria: Latvia's red is a MAROON/dried-blood shade and the white stripe is THINNER. 'Latvia = darker, leaner.'",mean:"Legend of a bloodstained sheet.",hist:"A deep carmine 'Latvian red' with a narrow white stripe, mentioned in a 13th-century chronicle and revived at independence in 1918.",sub:"Northern Europe",fact:"Its dark carmine 'Latvian red' with a narrow white band is among the oldest recorded flag designs."},{n:"Germany",c:"de",r:"Europe",fam:"tricolor",tell:"Black-red-gold horizontal.",hook:"Black-Red-Gold, top\u2192down. vs Belgium (same colours but VERTICAL).",mean:"1848 liberal revolution colours.",hist:"Black-red-gold dates to 19th-century liberal and unification movements and became the flag of the democratic republic and of reunified Germany.",sub:"Western Europe",fact:"Flies the black-red-gold of 1848 democracy, not the black-white-red of the old empire."},{n:"Belgium",c:"be",r:"Europe",fam:"tricolor",tell:"Black-yellow-red VERTICAL.",hook:"vs Germany: Belgium is the same trio but standing UP (vertical), and yellow is in the middle.",mean:"From the Duchy of Brabant.",hist:"Black-yellow-red vertical stripes from the arms of the Duchy of Brabant, adopted at the 1830 revolution.",sub:"Western Europe",fact:"One of the few near-square national flags, in the black-yellow-red of Brabant."},{n:"Italy",c:"it",r:"Europe",fam:"tricolor",tell:"Green-white-red vertical.",hook:"vs Ireland/Mexico: Italy is short/even and has NO emblem. 'Italy = pizza margherita: green basil, white mozzarella, red tomato.'",mean:"Napoleonic-era tricolour.",hist:"Green-white-red, inspired by the French tricolour in the Napoleonic era and adopted at Italian unification.",sub:"Southern Europe",fact:"A green-white-red tricolour inspired by France's \u2014 set apart from Hungary's by running vertical, not horizontal."},{n:"Ireland",c:"ie",r:"Europe",fam:"tricolor",tell:"Green-white-ORANGE vertical, green at hoist.",hook:"vs C\xF4te d'Ivoire: Ireland's GREEN is at the pole (Irish are 'green with envy'), orange trails. Also longer than Italy and ends in orange not red.",mean:"Green Catholics, orange Protestants, white peace.",hist:"Green for the Gaelic-Catholic tradition, orange for Protestants, and white for peace between them \u2014 a tricolour of reconciliation from 1848.",sub:"Northern Europe",fact:"The mirror image of C\xF4te d'Ivoire \u2014 green sits at the pole here, orange there."},{n:"Hungary",c:"hu",r:"Europe",fam:"tricolor",tell:"Red-white-green horizontal.",hook:"vs Italy (vertical) & Bulgaria (has green not red on bottom): Hungary is horizontal Red-White-Green.",mean:"Strength, faithfulness, hope.",hist:"Red-white-green stripes: red for strength, white for faithfulness, green for hope, flown since the 1848 revolution.",sub:"Eastern Europe",fact:"Red-white-green like Italy's, but in horizontal bands \u2014 orientation is the quickest tell."},{n:"Bulgaria",c:"bg",r:"Europe",fam:"tricolor",tell:"White-green-red horizontal.",hook:"vs Hungary: Bulgaria puts GREEN in the middle and white on top. 'Bulgaria's Belly is green.'",mean:"White peace, green land, red valour.",hist:"White-green-red horizontal bands: white for peace, green for the country's farmland and forests, red for the blood of independence.",sub:"Eastern Europe",fact:"Russia's Pan-Slavic template with green swapped in for blue \u2014 white, green, red."},{n:"Spain",c:"es",r:"Europe",fam:"unique",tell:"Red-yellow-red with a wide gold band + coat of arms toward hoist.",hook:"'Blood and sand' \u2014 thin red / thick gold / thin red, crest on the left. The wide gold stripe is the tell.",mean:"Pillars of Hercules on the arms.",hist:"The red-yellow-red 'Rojigualda' was chosen in the 18th century for visibility at sea; the arms show the historic kingdoms and the Pillars of Hercules.",sub:"Southern Europe",fact:"Its red-yellow-red was chosen for visibility at sea; the arms show the Pillars of Hercules and 'Plus Ultra'."},{n:"Portugal",c:"pt",r:"Europe",fam:"unique",tell:"Green (hoist) + red, with armillary sphere & shield on the seam.",hook:"Portugal = the golden SPHERE (navigator's armillary) on the green/red seam. Green is the smaller hoist side.",mean:"Sphere = Age of Discovery.",hist:"Green and red were adopted with the 1910 republic; the armillary sphere recalls the Age of Discovery and the shield the victories over the Moors.",sub:"Southern Europe",fact:"Its armillary sphere \u2014 a navigator's instrument from the Age of Discovery \u2014 appears on no other flag."},{n:"Greece",c:"gr",r:"Europe",fam:"unique",tell:"Nine blue-white stripes + white cross on blue canton.",hook:"Greece = SEA STRIPES (9, for the syllables of 'Freedom or Death') with a cross in the corner.",mean:"Blue sea/sky, white waves, Orthodox cross.",hist:"Nine blue-and-white stripes (often linked to the syllables of 'Freedom or Death') with a white cross for Orthodox Christianity.",sub:"Southern Europe",fact:"Its nine stripes are popularly tied to the nine syllables of 'Eleftheria i Thanatos' (Freedom or Death)."},{n:"Switzerland",c:"ch",r:"Europe",fam:"unique",tell:"SQUARE. White cross on red.",hook:"One of only two square flags (with Vatican). Red Cross is its colour-inverse.",mean:"Neutrality; medieval Swiss cross.",hist:"A white cross on red \u2014 one of only two square national flags \u2014 with a cross dating to medieval confederate forces.",sub:"Western Europe",fact:"One of only two square national flags (the other is Vatican City)."},{n:"United Kingdom",c:"gb",r:"Europe",fam:"unique",tell:"The Union Jack \u2014 overlaid red+white crosses on blue.",hook:"Three crosses stacked: England (red +), Scotland (white X), Ireland (red X). The 'canton parent' of Australia, NZ, Fiji, Tuvalu.",mean:"Union of the kingdoms.",hist:"The Union Jack overlays the crosses of St George (England), St Andrew (Scotland) and St Patrick (Ireland), combined in 1801.",sub:"Northern Europe",fact:"The Union Jack layers three crosses (England, Scotland, Ireland) and still sits in many other flags' cantons."},{n:"Albania",c:"al",r:"Europe",fam:"unique",tell:"Black double-headed EAGLE on deep red.",hook:"Albania = one angry black double eagle on blood-red. 'Land of the Eagles.'",mean:"Skanderbeg's eagle.",hist:"A black double-headed eagle on red, taken from the seal of the 15th-century national hero Skanderbeg.",sub:"Southern Europe",fact:"One of only three flags bearing a double-headed eagle (with Serbia and Montenegro) \u2014 here in black on red."},{n:"Montenegro",c:"me",r:"Europe",fam:"unique",tell:"Gold-bordered red field with a gold double-headed eagle + lion.",hook:"vs Albania: Montenegro's eagle is GOLD on red with a gold border (looks 'framed/royal').",mean:"Royal standard revived.",hist:"A red banner with a gold border bearing the state arms \u2014 a crowned double-headed eagle \u2014 adopted in 2004.",sub:"Southern Europe",fact:"One of only three flags bearing a double-headed eagle (with Albania and Serbia) \u2014 Montenegro's is gold."},{n:"Malta",c:"mt",r:"Europe",fam:"unique",tell:"White + red halves with the George Cross (grey) at top hoist.",hook:"Malta = split White|Red with a little grey medal in the top-left corner.",mean:"George Cross awarded for WWII bravery.",hist:"White and red with the George Cross, awarded by Britain in 1942 for the islanders' wartime bravery, in the top hoist corner.",sub:"Southern Europe",fact:"Uniquely carries a foreign honour \u2014 Britain's George Cross, awarded for the island's WWII bravery."},{n:"Andorra",c:"ad",r:"Europe",fam:"grancolombia",tell:"Blue-yellow-red vertical + coat of arms in the centre.",hook:"vs Romania/Chad/Moldova: Andorra has an EMBLEM in the middle (cows & mitre). 'Andorra = Arms in the middle, thin.'",mean:"Franco-Spanish co-principality.",hist:"A blue-yellow-red tricolour blending French and Spanish colours (for its two co-princes) with the national arms at the centre.",sub:"Southern Europe",fact:"Blends France's blue-red with Spain's red-yellow, reflecting Andorra's two co-princes."},{n:"Moldova",c:"md",r:"Europe",fam:"grancolombia",tell:"Blue-yellow-red vertical + eagle-with-shield emblem centred.",hook:"vs Andorra: Moldova's emblem is an EAGLE holding a shield (aurochs head). Same tricolour, different crest.",mean:"Related to Romania; eagle & aurochs.",hist:"A blue-yellow-red tricolour close to Romania's, with the state arms: an eagle holding a shield with an aurochs head.",sub:"Eastern Europe",fact:"One of the few flags whose reverse differs \u2014 the coat of arms shows only on the front (as with Paraguay)."},{n:"Romania",c:"ro",r:"Europe",fam:"grancolombia",tell:"Blue-yellow-red vertical, NO emblem, brighter cobalt blue.",hook:"vs Chad: Romania's blue is a brighter cobalt. Twins otherwise. 'Romania = Radiant blue.'",mean:"Plain civil version of the arms flag.",hist:"Blue-yellow-red vertical tricolour \u2014 nearly identical to Chad's \u2014 drawn from the colours of the historic provinces.",sub:"Eastern Europe",fact:"All but identical to Chad's flag \u2014 they differ only in the shade of blue."},{n:"Ukraine",c:"ua",r:"Europe",fam:"unique",tell:"Blue over yellow, two equal bands.",hook:"Ukraine = blue SKY over yellow WHEAT fields. Just two stripes.",mean:"Sky and grain.",hist:"Two bands, blue above yellow, for blue sky over golden wheat fields.",sub:"Eastern Europe",fact:"Just two bands \u2014 blue sky over golden wheat \u2014 one of the simplest flags in Europe."},{n:"Belarus",c:"by",r:"Europe",fam:"unique",tell:"Red over green with a red-on-white embroidery pattern at the hoist.",hook:"Belarus = red/green with a woven RUG pattern running up the left edge.",mean:"Ornament from folk textiles.",hist:"Red and green with a white-and-red traditional embroidery pattern at the hoist, based on the 1951 Soviet-era design.",sub:"Eastern Europe",fact:"One of only two flags with a woven folk pattern at the hoist (the other is Turkmenistan)."},{n:"Estonia",c:"ee",r:"Europe",fam:"unique",tell:"Blue-black-white horizontal.",hook:"Estonia = the only Baltic with BLACK in the middle. 'Blue skies, black past, white hope.' Blue on top.",mean:"National awakening colours.",hist:"Blue-black-white: blue for sky and lakes, black for the soil and hardship, white for snow and hope \u2014 from a 19th-century student society.",sub:"Northern Europe",fact:"Blue-black-white \u2014 the black band is a rare flag colour, standing for hardship and the soil."},{n:"Lithuania",c:"lt",r:"Europe",fam:"panafrican",tell:"Yellow-green-red horizontal.",hook:"vs Africa's yellow/green/red: Lithuania is the European one. 'Lit up: yellow sun on top.'",mean:"Sun, forests, blood.",hist:"Yellow-green-red: yellow for sun and prosperity, green for forests, red for the blood shed for the nation.",sub:"Northern Europe",fact:"Yellow-green-red \u2014 a Pan-African-looking palette that's rare in Europe."},{n:"Bosnia and Herzegovina",c:"ba",r:"Europe",fam:"unique",tell:"Blue field, yellow triangle, row of white stars along the diagonal.",hook:"Bosnia = a yellow TRIANGLE (the country's shape) with stars marching up its edge.",mean:"Triangle = 3 peoples; EU-style stars.",hist:"Blue with a yellow triangle (for the three peoples and the country's shape) and a line of white stars; adopted in 1998 as a neutral design.",sub:"Southern Europe",fact:"Its yellow triangle has three points for the three peoples; the stars run off both edges to suggest they continue forever."},{n:"North Macedonia",c:"mk",r:"Europe",fam:"unique",tell:"Golden sun with rays radiating to the edges on red.",hook:"N. Macedonia = a blazing SUN with 8 thick rays reaching the corners, on red.",mean:"'New sun of liberty.'",hist:"A stylised golden sun with eight rays on red, adopted in 1995 to replace the disputed Vergina sun.",sub:"Southern Europe",fact:"A rising sun with eight broad rays, adopted in 1995 to replace the disputed 16-ray Vergina sun."},{n:"Kosovo",c:"xk",r:"Europe",fam:"unique",tell:"Blue field, gold map of Kosovo, 6 white stars in an arc.",hook:"Kosovo = the country's own MAP in gold under 6 stars. (Bosnia/EU cousin.)",mean:"6 stars = 6 ethnic groups.",hist:"Blue with a gold map of the territory and six white stars for its main communities; adopted at independence in 2008.",sub:"Southern Europe",fact:"One of only two flags to depict the country's own map (the other is Cyprus)."},{n:"Cyprus",c:"cy",r:"Europe",fam:"unique",tell:"White field, copper-coloured island map + two green olive branches.",hook:"Cyprus = its own copper ISLAND shape (Cyprus = copper) over crossed olive branches.",mean:"Neutral map + peace branches.",hist:"A copper-coloured map of the island above two olive branches for peace \u2014 one of the few flags to depict its own map.",sub:"Southern Europe",fact:"One of only two flags to depict the country's own map (the other is Kosovo)."},{n:"Liechtenstein",c:"li",r:"Europe",fam:"unique",tell:"Blue over red with a gold CROWN in the top hoist.",hook:"Liechtenstein = blue/red with a little gold crown (added after being mistaken for Haiti at the Olympics!).",mean:"Crown = the princely house.",hist:"Blue over red with a gold crown, added in 1937 after the flag was found to be identical to Haiti's at the Olympics.",sub:"Western Europe",fact:"Gained its gold crown in 1937 after tying with Haiti's flag at the Olympics."},{n:"Monaco",c:"mc",r:"Europe",fam:"unique",tell:"Red over white, nearly square.",hook:"vs Indonesia: identical colours, but Monaco is more SQUARE (and tiny country). vs Poland: inverse.",mean:"Grimaldi heraldic colours.",hist:"Red over white from the heraldic colours of the ruling Grimaldi family; almost identical to Indonesia's flag.",sub:"Western Europe",fact:"Identical to Indonesia's red-over-white, but shorter and closer to square."},{n:"San Marino",c:"sm",r:"Europe",fam:"unique",tell:"White over light-blue + coat of arms with three towers.",hook:"San Marino = white/sky-blue with THREE TOWERS on a mountain crest.",mean:"Three towers of Monte Titano.",hist:"White over light blue with the state arms \u2014 white for the snowy peaks of Mount Titano, blue for the sky.",sub:"Southern Europe",fact:"Shows the three towers of Mount Titano that guard the tiny republic."},{n:"Vatican City",c:"va",r:"Europe",fam:"unique",tell:"SQUARE. Yellow + white with crossed keys & tiara.",hook:"Vatican = the other square flag: gold|white with St. Peter's KEYS.",mean:"Keys of the papacy.",hist:"Yellow and white vertical bands with the papal tiara and crossed keys of St Peter; one of only two square flags.",sub:"Southern Europe",fact:"One of only two square national flags (the other is Switzerland)."},{n:"Japan",c:"jp",r:"Asia",fam:"unique",tell:"Single red disc centred on white.",hook:"Land of the Rising Sun \u2192 one red SUN on white. The cleanest sun flag.",mean:"Hinomaru, 'circle of the sun.'",hist:"The Hinomaru, a red sun disc on white, reflects Japan as the 'Land of the Rising Sun'; used for centuries and official since the 19th.",sub:"East Asia",fact:"The red 'Hinomaru' sun-disc has stood for Japan for centuries."},{n:"Bangladesh",c:"bd",r:"Asia",fam:"unique",tell:"Red disc slightly off-centre on green.",hook:"vs Japan: Bangladesh = green field (lush delta), disc nudged toward the hoist so it looks centred when flying.",mean:"Green land, red sun of independence.",hist:"A red disc set slightly toward the hoist on green: green for the land, the red sun for the blood of the 1971 independence war.",sub:"South Asia",fact:"Its red disc is set toward the hoist so it looks centred once the flag is flying."},{n:"Palau",c:"pw",r:"Oceania",fam:"unique",tell:"Yellow disc off-centre on sky-blue.",hook:"vs Japan: Palau = golden MOON on Pacific blue, disc left of centre.",mean:"Full moon over the ocean.",hist:"A golden full moon offset on sky blue \u2014 blue for the ocean, the moon for peace and nationhood, not Japan's sun.",sub:"Micronesia",fact:"Often mistaken for Japan's \u2014 but it's a gold moon on ocean blue, set toward the hoist."},{n:"South Korea",c:"kr",r:"Asia",fam:"unique",tell:"Red-blue yin-yang + 4 black trigrams in the corners.",hook:"Korea = the TAEGEUK swirl with 4 bar-symbols in the corners. 'Balance + 4 corners.'",mean:"Um-yang harmony; I Ching trigrams.",hist:"The white field bears the red-blue taegeuk (yin-yang) and four black trigrams from the I Ching, symbols of balance.",sub:"East Asia",fact:"The only national flag drawn from the I Ching \u2014 a yin-yang taegeuk ringed by four trigrams."},{n:"China",c:"cn",r:"Asia",fam:"unique",tell:"Red field, one big gold star + 4 small stars arcing around it.",hook:"China = one BIG star (Party) leading 4 little stars, top-left. Red field.",mean:"Communist Party + the people.",hist:"Red for the revolution with one large gold star for the Communist Party and four smaller stars for the united people.",sub:"East Asia",fact:"Its four small stars curve toward one large star \u2014 the people gathered around the Party."},{n:"Vietnam",c:"vn",r:"Asia",fam:"unique",tell:"Single large yellow star centred on red.",hook:"vs China: Vietnam = ONE big yellow star, dead CENTRE.",mean:"Star of revolution.",hist:"A single gold five-pointed star on red, for the revolution and the unity of the people's classes.",sub:"Southeast Asia",fact:"Red with a single gold star \u2014 often confused with China's flag, which has five."},{n:"Taiwan",c:"tw",r:"Asia",fam:"unique",tell:"Red field, blue canton with a white 12-ray sun.",hook:"Taiwan = 'blue sky, white sun, red earth' \u2014 a white 12-point sun in a blue box.",mean:"12 rays = 12 hours/months of progress.",hist:"A red field with a blue canton holding a 'white sun with twelve rays', the emblem of the Kuomintang and the Republic of China.",sub:"East Asia",fact:"Its white sun has 12 triangular rays for the 12 two-hour periods of the day."},{n:"North Korea",c:"kp",r:"Asia",fam:"unique",tell:"Blue-red-blue bands + white disc with a red star toward hoist.",hook:"N. Korea = red central band with a red STAR in a white circle. Blue borders.",mean:"Star of communism.",hist:"A wide red band with a red star in a white disc, framed by white and blue stripes \u2014 red for revolution, blue for sovereignty.",sub:"East Asia",fact:"The only Korean flag with a star \u2014 a red star in a white disc between broad red and blue bands."},{n:"Mongolia",c:"mn",r:"Asia",fam:"unique",tell:"Red-blue-red vertical + gold soyombo symbol at hoist.",hook:"Mongolia = the gold SOYOMBO column (fire, sun, moon) on the left, blue sky stripe in the middle.",mean:"Soyombo = national emblem.",hist:"Red-blue-red panels with the yellow 'Soyombo' emblem at the hoist, a column of symbols for fire, sun, moon and more.",sub:"East Asia",fact:"The hoist carries the Soyombo, a national ideogram found on no other flag."},{n:"India",c:"in",r:"Asia",fam:"unique",tell:"Saffron-white-green + navy 24-spoke wheel in the centre.",hook:"India = the blue CHAKRA wheel centred on the white band.",mean:"Ashoka wheel of dharma.",hist:"Saffron, white and green with the navy-blue Ashoka Chakra (a 24-spoke wheel) at the centre, standing for law and motion.",sub:"South Asia",fact:"Its Ashoka Chakra replaced Gandhi's spinning wheel at independence."},{n:"Niger",c:"ne",r:"Africa",fam:"unique",tell:"Orange-white-green with a small orange disc centred.",hook:"vs India: Niger has a plain orange CIRCLE (sun) instead of a wheel, and is nearly square.",mean:"Sun over the Sahara + Niger River.",hist:"Orange-white-green horizontal bands with an orange sun disc \u2014 close to India's flag, but with a plain circle.",sub:"Western Africa",fact:"Nearly identical to India's flag, but with a plain orange sun-disc instead of a wheel."},{n:"Pakistan",c:"pk",r:"Asia",fam:"crescent",tell:"White hoist stripe + green field with white crescent & star.",hook:"Pakistan = green with a white VERTICAL stripe at the pole, plus crescent+star.",mean:"White stripe = minorities.",hist:"Dark green with a white crescent and star, plus a white hoist stripe representing the country's religious minorities.",sub:"South Asia",fact:"Its white hoist stripe stands for religious minorities \u2014 a detail no other national flag spells out."},{n:"T\xFCrkiye",c:"tr",r:"Asia",fam:"crescent",tell:"Red field, white crescent + star.",hook:"T\xFCrkiye = the classic red crescent flag; star sits INSIDE the crescent's opening.",mean:"Ottoman heritage.",hist:"A white crescent and star on red, symbols carried over from the Ottoman Empire.",sub:"Western Asia",fact:"Its crescent and star spread from the Ottoman era onto many other flags."},{n:"Tunisia",c:"tn",r:"Africa",fam:"crescent",tell:"Red field, white CIRCLE containing red crescent & star.",hook:"vs T\xFCrkiye: Tunisia puts its crescent+star inside a white DISC.",mean:"White sun-disc, Ottoman roots.",hist:"A red field with a white disc containing a red crescent and star, rooted in Ottoman-era design.",sub:"Northern Africa",fact:"T\xFCrkiye flies its crescent on plain red \u2014 Tunisia sets the same crescent inside a white disc."},{n:"Malaysia",c:"my",r:"Asia",fam:"crescent",tell:"14 red/white stripes + blue canton with yellow crescent & 14-point star.",hook:"vs USA: Malaysia = 'Stars & Stripes' cousin but with a CRESCENT + one big star. 14 stripes = 14 states.",mean:"Federation of 14.",hist:"The 'Jalur Gemilang': 14 red-and-white stripes and a 14-pointed star for the states and territories, with a crescent for Islam.",sub:"Southeast Asia",fact:"Its 14 stripes and 14-point star echo the American 'Stars and Stripes' \u2014 a Southeast-Asian cousin."},{n:"Singapore",c:"sg",r:"Asia",fam:"crescent",tell:"Red over white + white crescent & 5 stars in the top hoist.",hook:"Singapore = red/white split, crescent hugging FIVE stars in a ring, top-left.",mean:"5 stars = democracy, peace, progress, justice, equality.",hist:"Red over white with a white crescent and five stars for democracy, peace, progress, justice and equality.",sub:"Southeast Asia",fact:"A young crescent moon opening to five stars \u2014 for a young nation and five ideals."},{n:"Indonesia",c:"id",r:"Asia",fam:"unique",tell:"Red over white, 3:2 ratio.",hook:"vs Monaco (squarer) & Poland (inverse): Indonesia = big red-over-white banner. 'Indonesia is Immense/wide.'",mean:"Courage over purity.",hist:"Simply red over white ('Sang Saka Merah-Putih') \u2014 red for courage, white for purity; identical to Monaco's but wider.",sub:"Southeast Asia",fact:"Identical in design to Monaco's flag \u2014 the two differ only in proportions."},{n:"Thailand",c:"th",r:"Asia",fam:"unique",tell:"Red-white-BLUE-white-red horizontal (blue centre is double-height).",hook:"Thailand = 5 stripes, fat BLUE middle. 'Nation(red)-Religion(white)-King(blue).'",mean:"Blue = monarchy, wider centre.",hist:"Five stripes ('Trairong'): red for the nation, white for religion, and the central blue for the monarchy.",sub:"Southeast Asia",fact:"Five stripes in a 1-2-2-2-1 rhythm; the wide central blue for the monarchy sits at the exact middle."},{n:"Laos",c:"la",r:"Asia",fam:"unique",tell:"Red-blue-red + big white disc centred.",hook:"vs Thailand: Laos = red/blue/red with a plain white MOON on the blue.",mean:"Moon over the Mekong.",hist:"Red bands around a blue centre bearing a white disc \u2014 the full moon over the Mekong and the unity of the people.",sub:"Southeast Asia",fact:"Unusually for a communist state, its flag carries no red star \u2014 just a white disc for the full moon."},{n:"Cambodia",c:"kh",r:"Asia",fam:"unique",tell:"Blue-red-blue + white ANGKOR WAT temple centred.",hook:"Cambodia = the only flag with a BUILDING: white Angkor Wat on red.",mean:"Angkor Wat temple.",hist:"The only national flag to show a building: a white image of Angkor Wat on a red band between blue stripes.",sub:"Southeast Asia",fact:"Angkor Wat sits at its centre \u2014 the most prominent building on any national flag."},{n:"Nepal",c:"np",r:"Asia",fam:"unique",tell:"The only NON-rectangular flag \u2014 two stacked triangular pennants with moon & sun.",hook:"Nepal = double PENNANT (crimson, blue border), sun below, moon above. Unmistakable shape.",mean:"Himalayan peaks; sun & moon = permanence.",hist:"The world's only non-rectangular national flag \u2014 two stacked pennants bearing a moon and sun to symbolise permanence.",sub:"South Asia",fact:"The only non-rectangular national flag \u2014 two stacked pennants rather than a rectangle."},{n:"Bhutan",c:"bt",r:"Asia",fam:"unique",tell:"Diagonal split yellow/orange with a white DRAGON.",hook:"Bhutan = 'Land of the Thunder Dragon' \u2014 a white dragon lies along the diagonal.",mean:"Druk, the thunder dragon.",hist:"A white 'Druk' (the Thunder Dragon) across a divided field \u2014 yellow for civil authority, orange for Buddhism.",sub:"South Asia",fact:"The only national flag featuring a dragon."},{n:"Sri Lanka",c:"lk",r:"Asia",fam:"unique",tell:"Golden LION holding a sword on maroon, plus green+orange stripes at hoist.",hook:"Sri Lanka = a sword-wielding LION and 4 corner leaves; green/orange bars for minorities.",mean:"Sinhalese lion + Tamil/Muslim stripes.",hist:"A gold lion holding a sword on maroon, with bo-tree leaves at the corners and stripes for the Tamil and Muslim communities.",sub:"South Asia",fact:"One of the few flags with a lion bearing a sword, and among the most detailed anywhere."},{n:"Philippines",c:"ph",r:"Asia",fam:"unique",tell:"Blue over red + white hoist triangle with sun & 3 stars.",hook:"Philippines = white TRIANGLE at the pole, golden sun + 3 stars. (Flips to red-on-top in wartime.)",mean:"Sun = liberty, 3 stars = island groups.",hist:"Blue, red and white with a golden sun and three stars; uniquely, it is flown blue-up in peacetime and red-up in war.",sub:"Southeast Asia",fact:"The only flag deliberately flown upside-down \u2014 red on top \u2014 to signal a state of war."},{n:"Myanmar",c:"mm",r:"Asia",fam:"unique",tell:"Yellow-green-red horizontal + big white star centred.",hook:"Myanmar = Pan-Africa-looking bands (yellow/green/red) but with one big white STAR.",mean:"Solidarity star.",hist:"Yellow-green-red horizontal stripes with a large white star at the centre, adopted in 2010.",sub:"Southeast Asia",fact:"Three bands and a large white star, adopted in 2010 to replace the old socialist design."},{n:"Israel",c:"il",r:"Asia",fam:"unique",tell:"Blue Star of David between two blue stripes on white.",hook:"Israel = blue STAR OF DAVID; stripes echo a prayer shawl (tallit).",mean:"Menorah nation; tallit design.",hist:"A blue Star of David between two blue stripes on white, echoing the tallit prayer shawl.",sub:"Western Asia",fact:"Modelled on the tallit prayer shawl, with the Star of David between two blue stripes."},{n:"Lebanon",c:"lb",r:"Asia",fam:"unique",tell:"Red-white-red with a green CEDAR tree centred.",hook:"Lebanon = the green CEDAR on the white band (red bands top & bottom).",mean:"Cedar of Lebanon.",hist:"Red stripes around a white band bearing a green cedar tree, the ancient symbol of Lebanon.",sub:"Western Asia",fact:"The only national flag centred on a cedar tree, a symbol of Lebanon since antiquity."},{n:"Saudi Arabia",c:"sa",r:"Asia",fam:"unique",tell:"Green field, white Arabic shahada + a sword.",hook:"Saudi = green with white SCRIPT and a SWORD underlining it.",mean:"The Islamic declaration of faith.",hist:"Green with the Islamic declaration of faith (shahada) and a sword in white; because of the sacred text, it is never flown at half-mast.",sub:"Western Asia",fact:"Bearing the Islamic creed, it is never flown at half-mast and is printed on both sides so the text always reads correctly."},{n:"Afghanistan",c:"af",r:"Asia",fam:"unique",tell:"White field with black shahada script (Taliban flag).",hook:"Afghanistan (current) = plain WHITE with black Arabic script.",mean:"Islamic Emirate banner.",hist:"Afghanistan's flag has changed more often than almost any nation's, shifting with each government; recent versions carry the Islamic declaration of faith.",sub:"South Asia",fact:"No national flag has been redesigned more often \u2014 it has changed with nearly every change of power."},{n:"Iran",c:"ir",r:"Asia",fam:"panafrican",tell:"Green-white-red + red emblem centred + Kufic script along the band edges.",hook:"Iran = green/white/red with a tulip-like EMBLEM and rows of tiny script (Allahu Akbar x22).",mean:"Emblem = stylised 'Allah'.",hist:"Green-white-red with a stylised red emblem forming the word 'Allah', and 'Allahu Akbar' repeated along the band edges.",sub:"Western Asia",fact:"The word 'Allah' is stylised in the centre, and 'Allahu Akbar' is repeated 22 times along the bands."},{n:"Iraq",c:"iq",r:"Asia",fam:"panarab",tell:"Red-white-black + green 'Allahu Akbar' script centred.",hook:"Iraq = Pan-Arab bars with green SCRIPT (takbir) across the white middle.",mean:"Red/white/black + takbir.",hist:"Red-white-black Arab-liberation stripes with the green takbir, 'Allahu Akbar', in the white band.",sub:"Western Asia",fact:"One of only two national flags to carry the takbir \u2014 'Allahu Akbar', God is greatest \u2014 the other being Iran."},{n:"Syria",c:"sy",r:"Asia",fam:"panarab",tell:"Green-white-black with three red stars (current transitional flag).",hook:"Syria (2024+) = green top, black bottom, THREE red stars on white. (Note: recently changed from red-top.)",mean:"Independence-era flag revived.",hist:"An Arab-liberation design in red/black, white and green with stars; Syria's official flag changed in 2024 with its new government.",sub:"Western Asia",fact:"An Arab-liberation flag whose star count is the quickest way to tell it from Egypt's and Iraq's."},{n:"Yemen",c:"ye",r:"Asia",fam:"panarab",tell:"Red-white-black horizontal, plain.",hook:"Yemen = the BARE Pan-Arab tricolour, no emblem. 'Yemen = plainest of the reds.'",mean:"Arab Liberation colours.",hist:"A plain red-white-black horizontal tricolour in the Arab-liberation colours, adopted at the 1990 unification of North and South Yemen.",sub:"Western Asia",fact:"The plain red-white-black Arab tricolour \u2014 Egypt, Syria and Iraq add emblems to the very same bars."},{n:"Egypt",c:"eg",r:"Africa",fam:"panarab",tell:"Red-white-black + gold Eagle of Saladin centred.",hook:"vs Yemen/Iraq/Syria: Egypt = the golden EAGLE on the white band.",mean:"Eagle of Saladin.",hist:"Red-white-black Arab-liberation stripes with the gold Eagle of Saladin at the centre.",sub:"Northern Africa",fact:"Its gold Eagle of Saladin appears on several Arab flags; the three bars are shared across the region."},{n:"Jordan",c:"jo",r:"Asia",fam:"panarab",tell:"Black-white-green + red hoist triangle with a white 7-point star.",hook:"vs Palestine: Jordan adds a white 7-pointed STAR inside the red triangle.",mean:"Star = 7 verses of the Quran's opening.",hist:"Black, white and green Arab Revolt stripes with a red hoist triangle bearing a white seven-pointed star.",sub:"Western Asia",fact:"Its white seven-pointed star stands for the seven verses that open the Quran."},{n:"Palestine",c:"ps",r:"Asia",fam:"panarab",tell:"Black-white-green + plain red hoist triangle (no star).",hook:"vs Jordan: Palestine's red triangle is EMPTY. 'Palestine = plain triangle.'",mean:"Pan-Arab; Arab Revolt colours.",hist:"The Arab Revolt colours \u2014 black, white and green stripes with a red triangle \u2014 symbolising Palestinian nationhood.",sub:"Western Asia",fact:"The Arab Revolt colours \u2014 the template that Jordan, Sudan, Kuwait and the UAE all draw from."},{n:"Sudan",c:"sd",r:"Africa",fam:"panarab",tell:"Red-white-black + GREEN hoist triangle.",hook:"vs Jordan/Palestine: Sudan's triangle is GREEN, not red. 'Sudan = green wedge.'",mean:"Green wedge = Islam/prosperity.",hist:"Red-white-black Arab-liberation stripes with a green hoist triangle, adopted in 1970.",sub:"Northern Africa",fact:"Arab-liberation bars with a green triangle \u2014 a near-cousin of Jordan's and Palestine's."},{n:"United Arab Emirates",c:"ae",r:"Asia",fam:"panarab",tell:"Red VERTICAL hoist bar + green-white-black horizontal bands.",hook:"UAE = red stands UP the pole, then green/white/black flow right. 'UAE = red pillar on the left.'",mean:"Pan-Arab unity.",hist:"The Pan-Arab colours \u2014 red, green, white and black \u2014 uniting the seven emirates in 1971.",sub:"Western Asia",fact:"Carries all four Pan-Arab colours \u2014 red, green, white and black \u2014 in one design."},{n:"Kuwait",c:"kw",r:"Asia",fam:"panarab",tell:"Green-white-red + black TRAPEZOID from the hoist.",hook:"vs UAE: Kuwait's hoist shape is a black slanted TRAPEZOID, and bands are green/white/red.",mean:"Pan-Arab; black trapezoid.",hist:"Pan-Arab green, white and red stripes with a black trapezoid at the hoist, adopted at independence in 1961.",sub:"Western Asia",fact:"Its Pan-Arab colours trace to a poem: white deeds, black battles, green lands, red swords."},{n:"Qatar",c:"qa",r:"Asia",fam:"unique",tell:"MAROON + white split by a 9-point serrated line.",hook:"vs Bahrain: Qatar is MAROON with NINE white spikes (and taller/skinnier). 'Qatar = 9, darker.'",mean:"9 points = 9th Gulf emirate.",hist:"Maroon and white split by a nine-point serrated line; the distinctive maroon came from natural dye fading in the sun over time.",sub:"Western Asia",fact:"The only national flag wider than twice its height (an 11:28 ratio)."},{n:"Bahrain",c:"bh",r:"Asia",fam:"unique",tell:"RED + white split by a 5-point serrated line.",hook:"vs Qatar: Bahrain is bright RED with FIVE spikes. 'Bahrain = fewer, brighter.'",mean:"5 points = 5 pillars of Islam.",hist:"White and red divided by a five-point zigzag, the points standing for the Five Pillars of Islam.",sub:"Western Asia",fact:"Its five white points stand for the Five Pillars of Islam; Qatar's serration uses nine."},{n:"Oman",c:"om",r:"Asia",fam:"unique",tell:"Red hoist bar (with khanjar dagger) + white/red/green fields.",hook:"Oman = the crossed DAGGER (khanjar) emblem in the top hoist; red L-shape.",mean:"National khanjar dagger.",hist:"White, red and green with the national emblem \u2014 crossed swords and a khanjar dagger \u2014 in the top hoist.",sub:"Western Asia",fact:"The only Arab flag with its national emblem \u2014 a khanjar dagger and crossed swords \u2014 set in the hoist."},{n:"Kazakhstan",c:"kz",r:"Asia",fam:"unique",tell:"Sky-blue with a gold sun + eagle + ornamental hoist pattern.",hook:"Kazakhstan = golden EAGLE under a sun on turquoise; a gold 'vine' runs up the pole.",mean:"Steppe eagle, endless sky.",hist:"Sky blue with a golden sun and a soaring steppe eagle, and an ornamental national pattern down the hoist.",sub:"Central Asia",fact:"One of the few flags with a bird in flight \u2014 a golden steppe eagle beneath the sun."},{n:"Uzbekistan",c:"uz",r:"Asia",fam:"unique",tell:"Blue-white-green (thin red lines) + crescent & 12 stars in top blue.",hook:"Uzbekistan = blue/white/green with a crescent and an ARC of 12 stars.",mean:"12 stars = zodiac/months.",hist:"Blue, white and green stripes edged in red, with a crescent and twelve stars, adopted at independence in 1991.",sub:"Central Asia",fact:"Its crescent and twelve stars recall the months and the zodiac; blue nods to Timur's banners."},{n:"Turkmenistan",c:"tm",r:"Asia",fam:"unique",tell:"Green field + vertical CARPET stripe of guls + crescent & 5 stars.",hook:"Turkmenistan = green with a red CARPET band running up the hoist (most detailed flag).",mean:"Carpet guls = five tribes.",hist:"Green with a vertical band of five carpet 'guls' (rug patterns) beside a crescent and stars \u2014 often called the world's most detailed flag.",sub:"Central Asia",fact:"Widely called the world's most intricate flag, with five woven carpet patterns."},{n:"Kyrgyzstan",c:"kg",r:"Asia",fam:"unique",tell:"Red field, yellow sun with a criss-cross tunduk (yurt roof) centre.",hook:"Kyrgyzstan = red with a SUN whose centre shows a yurt's roof lattice.",mean:"Tunduk = the crown of a yurt.",hist:"A red field with a golden sun whose centre shows the crossed roof-poles (tunduk) of a traditional yurt.",sub:"Central Asia",fact:"Its sun has 40 rays for the 40 Kyrgyz tribes, over the crossed roof-poles of a yurt."},{n:"Tajikistan",c:"tj",r:"Asia",fam:"unique",tell:"Red-white-green (wide white) + gold crown & 7 stars.",hook:"vs Iran/Hungary: Tajikistan = red/white/green with a gold CROWN + arc of 7 stars on the wide white band.",mean:"Crown + 7 stars = unity.",hist:"Red-white-green stripes with a golden crown and an arc of seven stars in the centre.",sub:"Central Asia",fact:"Red-white-green with a golden crown and seven stars \u2014 the widest white band of the Central Asian flags."},{n:"Azerbaijan",c:"az",r:"Asia",fam:"unique",tell:"Blue-red-green + white crescent & 8-point star on red.",hook:"Azerbaijan = blue/red/green stack with crescent+star. 'Turkic (blue), progress (red), Islam (green).'",mean:"8 points = Turkic peoples.",hist:"Blue, red and green stripes with a white crescent and eight-pointed star \u2014 blue for Turkic heritage, red for progress, green for Islam.",sub:"Western Asia",fact:"Blue for Turkic roots, red for progress, green for Islam \u2014 with a crescent and eight-point star."},{n:"Armenia",c:"am",r:"Asia",fam:"unique",tell:"Red-blue-orange horizontal.",hook:"Armenia = red/blue/APRICOT-orange. 'Armenian apricot on the bottom.'",mean:"Blood, sky, apricot/wheat.",hist:"Red, blue and apricot-orange stripes \u2014 red for the people's blood, blue for the sky, orange for the land and courage.",sub:"Western Asia",fact:"Its bottom band is 'apricot', a colour found on virtually no other national flag."},{n:"Georgia",c:"ge",r:"Asia",fam:"unique",tell:"Big red cross on white + a small red cross in each quarter (5 crosses).",hook:"Georgia = FIVE red crosses (one big, four small) on white \u2014 the 'Five Cross Flag.'",mean:"St. George crosses.",hist:"The 'Five Cross Flag': one large red St George's cross with four smaller Bolnisi crosses, a medieval design revived in 2004.",sub:"Western Asia",fact:"One of the few flags with five crosses \u2014 a large St George's cross and four smaller Bolnisi crosses."},{n:"Maldives",c:"mv",r:"Asia",fam:"unique",tell:"Red border, green rectangle, white crescent.",hook:"Maldives = green box inside a red frame, white crescent inside the green.",mean:"Red frame, green palms, Islam.",hist:"A red border around green with a white crescent \u2014 red for national heroes, green for palms and prosperity, the crescent for Islam.",sub:"South Asia",fact:"One of the simplest crescent flags \u2014 a plain white crescent on green, with no star."},{n:"Brunei",c:"bn",r:"Asia",fam:"unique",tell:"Yellow field, black & white diagonal stripes, red crest centred.",hook:"Brunei = YELLOW with two slanted black/white bars and a red parasol crest.",mean:"Yellow = sultan; crest = state motto.",hist:"Yellow with black and white diagonal stripes and a red national crest that includes a crescent and upturned hands.",sub:"Southeast Asia",fact:"One of only a handful of flags to carry Arabic script \u2014 its crest spells a national motto."},{n:"Timor-Leste",c:"tl",r:"Asia",fam:"unique",tell:"Red field, black triangle with white star, yellow triangle behind.",hook:"Timor-Leste = nested TRIANGLES (yellow then black) with a white star at the point.",mean:"Star of hope emerging.",hist:"Red with a black triangle and a white star, adopted at independence in 2002 \u2014 black for the darkness to be overcome, the star for peace.",sub:"Southeast Asia",fact:"One of the newest national flags (2002) \u2014 two triangles for the dark past behind a white star of hope."},{n:"Ethiopia",c:"et",r:"Africa",fam:"panafrican",tell:"Green-yellow-red + blue disc with a gold star (pentagram).",hook:"Ethiopia = the ORIGIN of Pan-African colours; centre has a blue circle + radiant star.",mean:"Never colonised; the template.",hist:"Green-yellow-red with a blue disc and gold star; as an uncolonised power, Ethiopia was the original source of the Pan-African colours.",sub:"Eastern Africa",fact:"Its green-yellow-red, worn by Africa's uncolonised state, became the Pan-African template."},{n:"Ghana",c:"gh",r:"Africa",fam:"panafrican",tell:"Red-yellow-green + black STAR centred.",hook:"Ghana = the 'Black Star' of Africa on red/gold/green.",mean:"Black star of African freedom.",hist:"Red-yellow-green Pan-African stripes with a black star for African freedom \u2014 the star that named the Black Star Line.",sub:"Western Africa",fact:"Its lone black star named Ghana's football team and the old Black Star shipping line."},{n:"Senegal",c:"sn",r:"Africa",fam:"panafrican",tell:"Green-yellow-red VERTICAL + green star on the middle band.",hook:"vs Mali/Guinea: Senegal is vertical with a green STAR in the centre.",mean:"Star = unity, hope.",hist:"Green-yellow-red vertical Pan-African stripes with a green star at the centre.",sub:"Western Africa",fact:"Essentially Mali's flag with a green star added at the centre."},{n:"Mali",c:"ml",r:"Africa",fam:"panafrican",tell:"Green-yellow-red vertical, NO emblem.",hook:"vs Guinea: Mali reads Green\u2192Red left-to-right ('Mali = green Mint on the left'). No star (unlike Senegal).",mean:"Pan-African vertical.",hist:"Green, yellow and red vertical Pan-African stripes, adopted at independence in 1960.",sub:"Western Africa",fact:"The reverse of Guinea's flag \u2014 green, yellow, red instead of red, yellow, green."},{n:"Guinea",c:"gn",r:"Africa",fam:"panafrican",tell:"Red-yellow-green vertical.",hook:"vs Mali: Guinea is the MIRROR \u2014 Red on the left. 'Guinea = Gules(red) at the pole.'",mean:"Reverse of Mali's order.",hist:"Red-yellow-green vertical stripes \u2014 the reverse of Mali's \u2014 for work, justice and solidarity.",sub:"Western Africa",fact:"The reverse of Mali's flag \u2014 red, yellow, green instead of green, yellow, red."},{n:"Cameroon",c:"cm",r:"Africa",fam:"panafrican",tell:"Green-red-yellow VERTICAL + gold star on the red middle.",hook:"vs Senegal: Cameroon's middle band is RED with a gold star (not green band/green star).",mean:"Star of unity.",hist:"Green, red and yellow vertical Pan-African stripes with a yellow star on the red band.",sub:"Middle Africa",fact:"Pan-African stripes with a single gold 'star of unity' on the red band."},{n:"Guinea-Bissau",c:"gw",r:"Africa",fam:"panafrican",tell:"Red hoist bar (black star) + yellow/green horizontal fields.",hook:"Guinea-Bissau = red VERTICAL band with a black star, then yellow-over-green. Ghana's colours rearranged.",mean:"Black star of PAIGC.",hist:"A red hoist band with a black star beside yellow and green stripes \u2014 Pan-African colours from the independence party.",sub:"Western Africa",fact:"Takes neighbouring Guinea's colours and adds a black star at the hoist."},{n:"Congo (Rep.)",c:"cg",r:"Africa",fam:"panafrican",tell:"Diagonal green/yellow/red from bottom-hoist to top-fly.",hook:"Congo-Brazzaville = Pan-African colours on a DIAGONAL slash.",mean:"Diagonal green/gold/red.",hist:"A yellow diagonal band splitting green and red, a distinctive Pan-African arrangement adopted in 1959.",sub:"Middle Africa",fact:"One of the few flags split by a diagonal band \u2014 yellow slashing corner to corner."},{n:"Benin",c:"bj",r:"Africa",fam:"panafrican",tell:"Green vertical hoist bar + yellow-over-red horizontal.",hook:"Benin = green box on the left, then yellow above red. 'Benin = big green Block.'",mean:"Pan-African.",hist:"A green hoist band beside horizontal yellow and red, using the Pan-African colours.",sub:"Western Africa",fact:"Pan-African colours in an L-shape \u2014 a green vertical band beside yellow and red."},{n:"Burkina Faso",c:"bf",r:"Africa",fam:"panafrican",tell:"Red over green + yellow STAR in the centre.",hook:"Burkina Faso = red/green split with a gold star on the seam.",mean:"Star of revolution.",hist:"Red over green with a central yellow star \u2014 red for revolution, green for hope and plenty, the star for guidance.",sub:"Western Africa",fact:"Red over green with a gold star \u2014 revolution above the fertile land."},{n:"Togo",c:"tg",r:"Africa",fam:"panafrican",tell:"5 green/yellow stripes + red canton with white star.",hook:"Togo = looks like a Pan-African 'Liberia': stripes + a red corner box with a white star.",mean:"5 stripes = 5 regions.",hist:"Five green and yellow stripes with a red canton and a white star, blending Pan-African and stars-and-stripes influences.",sub:"Western Africa",fact:"Five stripes and a star canton \u2014 a Pan-African take on the Stars and Stripes."},{n:"Cabo Verde",c:"cv",r:"Africa",fam:"unique",tell:"Blue field, white-red-white stripes low, ring of 10 yellow stars.",hook:"Cabo Verde = a CIRCLE of 10 stars (the islands) on ocean blue.",mean:"10 islands.",hist:"Blue with a white-red-white band and a circle of ten yellow stars for the islands \u2014 closer to European blue than to Pan-African colours.",sub:"Western Africa",fact:"A ring of ten yellow stars for its ten islands \u2014 its blue is closer to the EU flag than to Pan-African colours."},{n:"S\xE3o Tom\xE9 and Pr\xEDncipe",c:"st",r:"Africa",fam:"panafrican",tell:"Green-yellow-green + red hoist triangle + 2 black stars.",hook:"S\xE3o Tom\xE9 = yellow centre with TWO black stars (the two islands), red triangle at pole.",mean:"Two islands, Pan-African.",hist:"Green-yellow-green with a red hoist triangle and two black stars for the two islands, in Pan-African colours.",sub:"Middle Africa",fact:"Two black stars for its two islands, in Pan-African colours."},{n:"Angola",c:"ao",r:"Africa",fam:"unique",tell:"Red over black + gold half-gear, machete & star.",hook:"Angola = red/black with a yellow GEAR + MACHETE (industry + farming).",mean:"Socialist-style emblem.",hist:"Red over black with a crossed machete and half-gearwheel and a star, echoing independence-era and socialist symbolism.",sub:"Middle Africa",fact:"One of the few flags modelled on the hammer-and-sickle \u2014 here a machete crossed with a gear."},{n:"Mozambique",c:"mz",r:"Africa",fam:"unique",tell:"Green/black/yellow stripes + red triangle with a RIFLE, hoe & book.",hook:"Mozambique = the only flag with a modern RIFLE (AK-47) in the emblem.",mean:"Defence, agriculture, education.",hist:"The only flag with a modern rifle \u2014 an AK-47 crossed with a hoe over an open book \u2014 on Pan-African colours with a red triangle.",sub:"Eastern Africa",fact:"The only national flag featuring a modern firearm, an AK-47."},{n:"South Africa",c:"za",r:"Africa",fam:"unique",tell:"Green Y-shape (pall) splitting red/blue with black-and-gold hoist triangle.",hook:"South Africa = the green 'Y' converging \u2014 two paths joining into one.",mean:"Unity of diverse peoples.",hist:"The 1994 'Rainbow Nation' flag: a green Y joins two paths into one, symbolising the unity of a once-divided society.",sub:"Southern Africa",fact:"Six colours in one design \u2014 the most of any national flag that uses no seal or emblem."},{n:"Kenya",c:"ke",r:"Africa",fam:"unique",tell:"Black-red-green (white edges) + Maasai SHIELD & spears centred.",hook:"Kenya = a Maasai SHIELD with crossed spears on black/red/green.",mean:"Defence of freedom.",hist:"Black, red and green stripes edged in white with a red-and-white Maasai shield and spears for the defence of freedom.",sub:"Eastern Africa",fact:"Its Maasai shield and crossed spears stand for the defence of freedom."},{n:"Tanzania",c:"tz",r:"Africa",fam:"unique",tell:"Green & blue split by a black DIAGONAL band with yellow edges.",hook:"Tanzania = green + blue triangles divided by a gold-edged black slash.",mean:"Land, sea, people, minerals.",hist:"A green and blue field split by a gold-edged black diagonal \u2014 green for land, blue for sea, black for the people, gold for minerals.",sub:"Eastern Africa",fact:"A black diagonal splits green and blue \u2014 the union of Tanganyika and Zanzibar."},{n:"Malawi",c:"mw",r:"Africa",fam:"unique",tell:"Black-red-green + rising red SUN on the black.",hook:"vs Kenya: Malawi = horizontal black/red/green with a red HALF-SUN rising on top.",mean:"Dawn of freedom.",hist:"Black, red and green with a rising red sun on the black band, marking the dawn of freedom for Africa.",sub:"Eastern Africa",fact:"Its rising red sun on black marks the dawn of freedom for the continent."},{n:"Uganda",c:"ug",r:"Africa",fam:"unique",tell:"Six black-yellow-red stripes + white disc with a grey CRANE.",hook:"Uganda = the grey crowned CRANE in a white circle; 6 stripes twice over.",mean:"National bird.",hist:"Six black-yellow-red stripes with the grey crowned crane, the national bird, in a central white disc.",sub:"Eastern Africa",fact:"The only national flag to feature a crane \u2014 the grey crowned crane, facing the hoist."},{n:"Rwanda",c:"rw",r:"Africa",fam:"unique",tell:"Blue-yellow-green + golden SUN in the top-fly corner.",hook:"Rwanda = calm blue on top with a small gold sun in the upper right.",mean:"Peace, prosperity, hope + sun of enlightenment.",hist:"Blue, yellow and green with a golden sun, adopted in 2001 to move past the earlier flag tied to the genocide.",sub:"Eastern Africa",fact:"Redesigned in 2001 to drop the red of the old flag, which was tied to the genocide."},{n:"Burundi",c:"bi",r:"Africa",fam:"unique",tell:"White SALTIRE (X) dividing red/green + 3 red stars in a white centre disc.",hook:"Burundi = a white X splitting red & green, with 3 stars in the middle.",mean:"3 stars = unity, work, progress.",hist:"A white saltire dividing red and green panels, with three red stars for unity, work and progress.",sub:"Eastern Africa",fact:"Three stars for 'Unity, Work, Progress', set in a rare white X-shaped saltire."},{n:"Zambia",c:"zm",r:"Africa",fam:"unique",tell:"Green field with orange EAGLE + red/black/orange bars in the fly corner.",hook:"Zambia = mostly GREEN, with the flair (eagle + 3 stripes) shoved into the bottom-right.",mean:"Eagle of freedom, copper.",hist:"Green with an orange eagle above red-black-orange stripes at the fly \u2014 green for land, the eagle for freedom, copper-orange for mineral wealth.",sub:"Eastern Africa",fact:"Unusually, its emblem \u2014 an orange eagle over colour bars \u2014 sits in the fly, not the centre."},{n:"Zimbabwe",c:"zw",r:"Africa",fam:"unique",tell:"7 green/yellow/red/black stripes + white triangle with red star & soapstone BIRD.",hook:"Zimbabwe = the Great Zimbabwe BIRD on a red star, in a white triangle.",mean:"Zimbabwe Bird = national emblem.",hist:"Green-yellow-red-black stripes with a white triangle holding the soapstone 'Zimbabwe Bird' and a red star.",sub:"Eastern Africa",fact:"Bears the soapstone 'Zimbabwe Bird' from the ancient ruins the country is named after."},{n:"Botswana",c:"bw",r:"Africa",fam:"unique",tell:"Light-blue field with a black horizontal stripe edged in white.",hook:"Botswana = sky blue with a single black/white bar. 'Water(blue) + racial harmony(black&white).'",mean:"Rain (pula) + unity.",hist:"Sky blue for the life-giving rain behind its motto 'Pula', crossed by a black-and-white band symbolising racial harmony.",sub:"Southern Africa",fact:"A rare flag with no red and no emblem \u2014 sky-blue split by a black-and-white bar for racial harmony."},{n:"Namibia",c:"na",r:"Africa",fam:"unique",tell:"Diagonal red band (white-edged) splitting blue & green + gold sun.",hook:"Namibia = a red DIAGONAL with a golden sun in the blue upper triangle.",mean:"Sun of life; blue sky, green land.",hist:"A red diagonal with a gold sun dividing blue and green \u2014 blue for sky and ocean, green for vegetation, red for the people.",sub:"Southern Africa",fact:"A bold red diagonal between blue and green, with a golden 12-rayed sun."},{n:"Lesotho",c:"ls",r:"Africa",fam:"unique",tell:"Blue-white-green + black Basotho HAT centred.",hook:"Lesotho = the black conical HAT (mokorotlo) on the white band.",mean:"Basotho hat = national identity.",hist:"Blue, white and green with a black 'mokorotlo' (Basotho straw hat) at the centre, adopted in 2006.",sub:"Southern Africa",fact:"The only national flag to depict a hat \u2014 the black Basotho 'mokorotlo'."},{n:"Eswatini",c:"sz",r:"Africa",fam:"unique",tell:"Blue-red-blue (yellow edges) + black/white SHIELD, spears & staff.",hook:"Eswatini = a big Nguni SHIELD lying sideways across the red band.",mean:"Ox-hide shield & weapons.",hist:"A large ox-hide shield with spears and staff over red, blue and yellow bands \u2014 red for past battles, blue for peace, yellow for resources.",sub:"Southern Africa",fact:"Its ox-hide shield, spears and staff make it one of the few flags to show weapons."},{n:"Nigeria",c:"ng",r:"Africa",fam:"unique",tell:"Green-white-green vertical.",hook:"Nigeria = simple green/white/green. 'Naija: green fields around white peace.'",mean:"Agriculture + peace.",hist:"Green-white-green vertical bands \u2014 green for the land and agriculture, white for peace.",sub:"Western Africa",fact:"Designed by a 23-year-old student who won a national contest \u2014 green for farmland, white for peace."},{n:"Algeria",c:"dz",r:"Africa",fam:"crescent",tell:"Green & white halves + red crescent & star centred.",hook:"Algeria = green|white split with a red crescent straddling the seam.",mean:"Islam + purity + martyrs.",hist:"Green and white with a red crescent and star \u2014 green and white for Islam and peace, red for the blood of the independence struggle.",sub:"Northern Africa",fact:"Green and white for Islam and peace, with a red crescent and star said to bring good fortune."},{n:"Morocco",c:"ma",r:"Africa",fam:"unique",tell:"Red field with a green 5-point PENTAGRAM outline.",hook:"Morocco = red with a green 'Seal of Solomon' STAR (open outline).",mean:"Pentagram = seal of Solomon.",hist:"A red field with a green interlaced pentagram, the 'Seal of Solomon'.",sub:"Northern Africa",fact:"A green five-point 'Seal of Solomon', drawn as an open outline, on plain red."},{n:"Libya",c:"ly",r:"Africa",fam:"panarab",tell:"Red-black-green (black band is double-height) + white crescent & star.",hook:"Libya = fat BLACK middle band with crescent+star; thin red & green edges.",mean:"Kingdom-era flag restored.",hist:"Red, black and green with a white crescent and star; the black recalls the historic Cyrenaica flag, restored in 2011.",sub:"Northern Africa",fact:"From 1977 to 2011 this was the world's only flag of a single plain colour \u2014 solid green."},{n:"Somalia",c:"so",r:"Africa",fam:"unique",tell:"Light-blue field, single white 5-point star centred.",hook:"Somalia = one white star on UN-blue. 'Somalia = solo star.'",mean:"5 points = Somali regions.",hist:"A single white five-pointed 'Star of Unity' on light blue, for the regions of the Somali people.",sub:"Eastern Africa",fact:"Its white 'Star of Unity' marks the five regions historically home to Somali people."},{n:"Djibouti",c:"dj",r:"Africa",fam:"unique",tell:"Light-blue & green with a white hoist triangle + red star.",hook:"vs Somalia: Djibouti adds a white triangle (red star inside) and a green lower half.",mean:"Sky, earth, peace + unity star.",hist:"Light blue and green with a white hoist triangle and red star \u2014 blue for the Issa, green for the Afar, the star for unity.",sub:"Eastern Africa",fact:"Its colours mark the two main peoples \u2014 blue for the Issa, green for the Afar."},{n:"Eritrea",c:"er",r:"Africa",fam:"unique",tell:"Red TRIANGLE (olive wreath) spanning the flag + green & blue triangles.",hook:"Eritrea = a big red triangle pointing to the fly with a gold wreath/olive emblem.",mean:"Wreath = the independence struggle.",hist:"A red triangle bearing a gold wreath-and-olive emblem, set against green and blue triangles for the land and sea.",sub:"Eastern Africa",fact:"A red triangle with an olive wreath \u2014 reviving the emblem of its 1952 flag."},{n:"South Sudan",c:"ss",r:"Africa",fam:"unique",tell:"Black-red-green (white lines) + blue hoist triangle with gold star.",hook:"South Sudan = 6-colour flag (like Kenya + blue triangle + gold 'Star of Bethlehem').",mean:"Star of unity.",hist:"Black, red and green stripes edged in white, with a blue hoist triangle and a gold star for unity; adopted in 2011.",sub:"Eastern Africa",fact:"One of the newest flags (2011); its six colours make it among Africa's most colourful."},{n:"Central African Republic",c:"cf",r:"Africa",fam:"unique",tell:"4 horizontal bands crossed by a red VERTICAL stripe + gold star.",hook:"CAR = blue/white/green/yellow bands with a red bar down the middle (French + Pan-African fused) and a star top-left.",mean:"Union of French & African colours.",hist:"Four horizontal stripes crossed by a red vertical band, uniting French and Pan-African colours, with a gold star at the hoist.",sub:"Middle Africa",fact:"The only flag joining French blue-white-red with Pan-African green-yellow-red, crossed by a red bar."},{n:"Chad",c:"td",r:"Africa",fam:"grancolombia",tell:"Blue-yellow-red vertical, DARK indigo blue.",hook:"vs Romania: Chad's blue is a deep indigo. 'Chad = shade (darker).'",mean:"Blue sky, gold sun, red sacrifice.",hist:"A blue-yellow-red vertical tricolour, essentially identical to Romania's \u2014 blue for sky, yellow for sun, red for sacrifice.",sub:"Middle Africa",fact:"All but identical to Romania's flag \u2014 they differ only in the shade of blue."},{n:"Gabon",c:"ga",r:"Africa",fam:"unique",tell:"Green-yellow-blue horizontal, no emblem.",hook:"Gabon = green(forest)/yellow(equator sun)/blue(sea), top\u2192down.",mean:"Forest, equator, ocean.",hist:"Three simple bands \u2014 green for the forests, yellow for the equator and sun, blue for the sea.",sub:"Middle Africa",fact:"Three plain bands \u2014 green, gold, blue \u2014 one of the simplest flags anywhere."},{n:"Equatorial Guinea",c:"gq",r:"Africa",fam:"unique",tell:"Green-white-red + blue hoist triangle + coat of arms (silk-cotton tree).",hook:"Eq. Guinea = green/white/red with a blue wedge and a TREE crest.",mean:"Silk-cotton tree + 6 stars.",hist:"Green, white and red stripes with a blue hoist triangle and the national arms, which feature a silk-cotton tree.",sub:"Middle Africa",fact:"One of the few flags to show a tree \u2014 the silk-cotton tree in its central arms."},{n:"Liberia",c:"lr",r:"Africa",fam:"unique",tell:"11 red/white stripes + blue canton with ONE white star.",hook:"vs USA: Liberia = the 'American' flag with just ONE star. Founded by freed US slaves.",mean:"11 signers of its declaration.",hist:"Eleven red-and-white stripes and a single white star on blue, modelled on the US flag by freed American settlers.",sub:"Western Africa",fact:"Modelled directly on the US flag by the freed American settlers who founded it."},{n:"Sierra Leone",c:"sl",r:"Africa",fam:"unique",tell:"Green-white-blue horizontal.",hook:"Sierra Leone = green/white/blue. 'Mountains, unity, sea.'",mean:"Agriculture, peace, harbour.",hist:"Green, white and blue bands \u2014 green for agriculture and mountains, white for unity and justice, blue for the harbour.",sub:"Western Africa",fact:"Green-white-blue for the mountains, unity, and the harbour of Freetown."},{n:"C\xF4te d'Ivoire",c:"ci",r:"Africa",fam:"tricolor",tell:"Orange-white-green vertical, ORANGE at hoist.",hook:"vs Ireland: Ivory Coast leads with ORANGE at the pole and is shorter/even. 'Ivory = orange first.'",mean:"Savanna, peace, forests.",hist:"Orange-white-green vertical stripes \u2014 the mirror image of Ireland \u2014 with orange at the hoist for the northern savanna.",sub:"Western Africa",fact:"The mirror image of Ireland \u2014 orange sits at the pole here, green there."},{n:"Gambia",c:"gm",r:"Africa",fam:"unique",tell:"Red-blue-green horizontal with white dividing lines.",hook:"Gambia = red/blue/green with the blue RIVER band pinstriped in white (the Gambia River).",mean:"Sun, river, land.",hist:"Red, blue and green separated by thin white lines \u2014 red for sun and savanna, blue for the Gambia River, green for the land.",sub:"Western Africa",fact:"Its blue stripe is the River Gambia, framed by red savanna and green land, kept apart by thin white lines."},{n:"Mauritania",c:"mr",r:"Africa",fam:"crescent",tell:"Green field, gold crescent & star, red top & bottom stripes.",hook:"Mauritania = golden crescent 'smiling' upward on green, red bands added top & bottom.",mean:"Crescent + red = sacrifice.",hist:"Green with a gold crescent and star, plus red stripes top and bottom added in 2017 for the blood of independence.",sub:"Western Africa",fact:"Its gold crescent opens upward like a bowl; red bands were added in 2017 for the blood of independence."},{n:"Mauritius",c:"mu",r:"Africa",fam:"unique",tell:"Red-blue-yellow-green four equal bands.",hook:"Mauritius = FOUR stripes: red/blue/yellow/green (rare 4-band flag).",mean:"Freedom, ocean, light, agriculture.",hist:"Four equal bands of red, blue, yellow and green \u2014 for independence, the ocean, the light of freedom, and agriculture.",sub:"Eastern Africa",fact:"One of the few flags with four horizontal bands of four different colours."},{n:"Seychelles",c:"sc",r:"Africa",fam:"unique",tell:"Five rays fanning from the bottom-hoist: blue/yellow/red/white/green.",hook:"Seychelles = a colour FAN bursting from the corner. 'Rays of a new dawn.'",mean:"Dynamic nation moving forward.",hist:"Five colourful bands radiating from the lower hoist, symbolising a young country moving into the future.",sub:"Eastern Africa",fact:"Five colourful bands sweep from one corner \u2014 a young nation moving forward."},{n:"Comoros",c:"km",r:"Africa",fam:"unique",tell:"4 stripes (yellow/white/red/blue) + green hoist triangle with crescent & 4 stars.",hook:"Comoros = 4 coloured stripes + a green triangle holding a crescent and 4 stars (the islands).",mean:"4 islands = 4 stars/stripes.",hist:"Four stripes for the islands plus a green hoist triangle with a crescent and four stars \u2014 an Islamic unity motif.",sub:"Eastern Africa",fact:"Four stripes for its four islands, plus four stars \u2014 every colour appears exactly once."},{n:"Madagascar",c:"mg",r:"Africa",fam:"unique",tell:"White VERTICAL hoist band + red-over-green horizontal.",hook:"Madagascar = white column at the pole, then red above green.",mean:"Purity, sovereignty, coast.",hist:"A white vertical band beside red-over-green horizontals, its colours drawn from the island's history and Southeast-Asian heritage.",sub:"Eastern Africa",fact:"Its white vertical band beside red and green hints at the island's Southeast-Asian roots."},{n:"United States",c:"us",r:"Americas",fam:"unique",tell:"13 red/white stripes + blue canton of 50 white stars.",hook:"USA = Stars & Stripes: 13 stripes (colonies), 50 stars (states).",mean:"Original 13 + current 50.",hist:"The Stars and Stripes: thirteen stripes for the original colonies and fifty stars for the current states \u2014 a count that has grown with the nation.",sub:"Northern America",fact:"Its design has been revised 27 times as new states joined \u2014 more than any other flag."},{n:"Canada",c:"ca",r:"Americas",fam:"unique",tell:"Red-white-red vertical + red MAPLE LEAF centred.",hook:"Canada = the 11-point red MAPLE LEAF on white, red bars either side.",mean:"Maple leaf, national symbol.",hist:"The red-and-white Maple Leaf, adopted in 1965 to replace British-based ensigns with a distinctly Canadian symbol.",sub:"Northern America",fact:"The maple leaf's 11 points were chosen only for clarity in wind; they carry no meaning."},{n:"Mexico",c:"mx",r:"Americas",fam:"tricolor",tell:"Green-white-red vertical + EAGLE eating a snake on a cactus, centred.",hook:"vs Italy: Mexico has the EAGLE-on-cactus emblem in the middle (and is longer).",mean:"Aztec founding legend of Tenochtitlan.",hist:"Green-white-red carrying the Aztec founding legend \u2014 an eagle on a cactus devouring a serpent, marking where Tenochtitlan was built.",sub:"Central America",fact:"Depicts the Aztec founding legend \u2014 an eagle on a cactus devouring a serpent."},{n:"Brazil",c:"br",r:"Americas",fam:"unique",tell:"Green field, yellow diamond, blue globe with stars + banner.",hook:"Brazil = green with a gold DIAMOND and a starry blue globe reading 'Ordem e Progresso.'",mean:"Sky over Rio at independence.",hist:"Green for forests and a gold rhombus for wealth, with a blue globe showing the night sky over Rio at the 1889 republic and the motto 'Ordem e Progresso'.",sub:"South America",fact:"Its celestial globe shows the exact sky over Rio de Janeiro the morning the republic was declared."},{n:"Argentina",c:"ar",r:"Americas",fam:"unique",tell:"Light-blue/white/light-blue + gold 'Sun of May' face centred.",hook:"Argentina = sky-blue/white with a smiling SUN face in the middle.",mean:"Sun of May (1810 revolution).",hist:"Sky blue and white with the golden 'Sun of May', commemorating the 1810 revolution against Spain.",sub:"South America",fact:"Its golden human-faced 'Sun of May' marks the 1810 break from Spanish rule."},{n:"Uruguay",c:"uy",r:"Americas",fam:"unique",tell:"9 white/blue stripes + white canton with a Sun of May.",hook:"vs Argentina: Uruguay adds STRIPES (9) and puts the sun in the top-left corner.",mean:"9 stripes = original departments.",hist:"Nine blue-and-white stripes for the original departments, with a Sun of May in the canton.",sub:"South America",fact:"Shares the human-faced Sun of May with Argentina, above nine stripes for its first departments."},{n:"Colombia",c:"co",r:"Americas",fam:"grancolombia",tell:"Yellow (double-height) / blue / red horizontal, no emblem.",hook:"vs Venezuela/Ecuador: Colombia is PLAIN with a fat yellow top. 'Colombia = pure gold on top.'",mean:"Gold, sea, blood (Gran Colombia).",hist:"Yellow (half the flag), blue and red from the Gran Colombia tradition \u2014 yellow for the land's riches, blue for the seas, red for blood.",sub:"South America",fact:"Shares the Gran Colombia yellow-blue-red with Ecuador and Venezuela \u2014 Colombia flies the plain, emblem-free version."},{n:"Ecuador",c:"ec",r:"Americas",fam:"grancolombia",tell:"Yellow/blue/red + condor coat of arms centred.",hook:"vs Colombia: Ecuador adds a CONDOR crest in the middle.",mean:"Andean condor, Mt. Chimborazo.",hist:"The Gran Colombia yellow-blue-red with the national arms \u2014 Mount Chimborazo, a river and a condor \u2014 at the centre.",sub:"South America",fact:"One of three Gran Colombia flags (with Colombia and Venezuela) \u2014 its condor-and-Chimborazo arms set it apart."},{n:"Venezuela",c:"ve",r:"Americas",fam:"grancolombia",tell:"Yellow/blue/red + arc of 8 white STARS on the blue.",hook:"vs Colombia: Venezuela sprinkles an ARC of stars on the blue band.",mean:"8 stars = provinces of independence.",hist:"Gran Colombia yellow-blue-red with an arc of eight white stars and the national arms in the canton.",sub:"South America",fact:"One of three Gran Colombia flags (with Colombia and Ecuador) \u2014 look for its arc of eight white stars."},{n:"Peru",c:"pe",r:"Americas",fam:"unique",tell:"Red-white-red VERTICAL (state version adds crest).",hook:"vs Canada/Austria: Peru is red/white/red VERTICAL. 'Peru points up.'",mean:"Red = Inca/blood, white = peace.",hist:"Red-white-red vertical bands, said to come from the red-and-white flamingos the liberator San Mart\xEDn saw on landing.",sub:"South America",fact:"Its red-white-red bands are said to come from red-and-white flamingos the liberator San Mart\xEDn saw on landing."},{n:"Chile",c:"cl",r:"Americas",fam:"unique",tell:"White over red + blue canton with one white STAR.",hook:"vs Texas/others: Chile = white top, red bottom, single star in a blue square (top-hoist).",mean:"'La Estrella Solitaria' \u2014 lone star.",hist:"White and red with a blue canton and a single white star \u2014 the 'Estrella Solitaria', a guide to progress and honour.",sub:"South America",fact:"Its lone white star and blue canton predate \u2014 and inspired \u2014 the flags of Cuba and Puerto Rico."},{n:"Cuba",c:"cu",r:"Americas",fam:"unique",tell:"5 blue/white stripes + red hoist triangle with white star.",hook:"vs Puerto Rico: Cuba = BLUE stripes, RED triangle, white star.",mean:"3 blue stripes = old provinces.",hist:"Three blue stripes for the old provinces and two white for purity, with a red triangle for equality and a white 'Lone Star'.",sub:"Caribbean",fact:"Its lone-star design mirrors Puerto Rico's \u2014 the two swap red and blue."},{n:"Panama",c:"pa",r:"Americas",fam:"unique",tell:"Quartered: white with blue star / red / white / blue with red star.",hook:"Panama = four QUARTERS, diagonal stars (blue star top-left, red star bottom-right).",mean:"Two-party unity.",hist:"Quartered white, red and blue with two stars \u2014 the colours nodding to the political parties and to purity, authority and law.",sub:"Central America",fact:"Quartered in the colours of its two historic parties \u2014 a rare four-panel design with two stars."},{n:"Bolivia",c:"bo",r:"Americas",fam:"panafrican",tell:"Red-yellow-green + coat of arms centred (state flag).",hook:"vs Ghana/Ethiopia: Bolivia = red/yellow/green horizontal with a crest. (Also flies the multicolour Wiphala.)",mean:"Andean condor arms.",hist:"Red-yellow-green horizontal bands with the national arms \u2014 red for valour, yellow for mineral wealth, green for fertility.",sub:"South America",fact:"Its red-yellow-green looks Pan-African but predates that movement \u2014 the colours are Bolivia's own."},{n:"Paraguay",c:"py",r:"Americas",fam:"unique",tell:"Red-white-blue horizontal \u2014 DIFFERENT emblem on each side.",hook:"Paraguay = the only flag with different FRONT & BACK emblems (star one side, lion the other).",mean:"National seal / treasury seal.",hist:"Red-white-blue horizontal; uniquely, it shows different emblems on each side \u2014 the national arms on the front, the treasury seal on the back.",sub:"South America",fact:"The only national flag with a different emblem on its front and back."},{n:"Guyana",c:"gy",r:"Americas",fam:"unique",tell:"Green field + gold ARROWHEAD (red inner triangle), black & white edges.",hook:"Guyana = 'The Golden Arrowhead' pointing to the fly, red spearhead inside.",mean:"Green forests, gold future, red zeal.",hist:"The 'Golden Arrowhead': a green field with a white-edged gold arrow and a black-edged red hoist triangle \u2014 for forests, minerals and people.",sub:"South America",fact:"The 'Golden Arrowhead' \u2014 one of the few flags built entirely from overlapping triangles."},{n:"Suriname",c:"sr",r:"Americas",fam:"unique",tell:"Green-white-red-white-green + gold STAR centred.",hook:"Suriname = green/red bands (fat red middle) with a big yellow star.",mean:"Unity star.",hist:"Green, white and red bands with a large gold star for unity and a golden future.",sub:"South America",fact:"Its large gold star has five points for the five main ethnic groups living side by side."},{n:"Haiti",c:"ht",r:"Americas",fam:"unique",tell:"Blue over red + white square with coat of arms (palm & flags).",hook:"vs Liechtenstein: Haiti = blue/red with a white CREST box (palm tree + cannons) in the centre.",mean:"Palm of liberty.",hist:"Blue over red with the national arms \u2014 a palm tree, cannons and the motto 'L'Union Fait La Force' \u2014 from the 1803 revolution.",sub:"Caribbean",fact:"One of the few flags to show a palm tree, crowned with a liberty cap, in its central arms."},{n:"Dominican Republi
